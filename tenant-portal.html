<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Tenancy — Beacon Residentials</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%230B1E3D'/><path d='M8 22V13l8-6 8 6v9' stroke='%2300C896' stroke-width='2' fill='none' stroke-linecap='round' stroke-linejoin='round'/><path d='M13 22v-5h6v5' stroke='%2300C896' stroke-width='2' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --font:'DM Sans',system-ui,sans-serif; --disp:'DM Serif Display',Georgia,serif;
  --navy:#0B1E3D; --navy-mid:#132847; --green:#00C896; --green-dark:#009970;
  --white:#fff; --off:#F6F8FB; --border:#E4EAF1; --txt:#1A2B45; --muted:#7A8FA6;
  --red:#E53E3E; --red-bg:#FDECEC; --amber:#D97706; --amber-bg:#FEF3C7;
  --green-bg:rgba(0,200,150,.12); --blue:#3B6FE8; --blue-bg:#EAF0FE;
  --radius:12px;
}
body{font-family:var(--font);color:var(--txt);background:var(--off);min-height:100vh;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--disp);font-weight:400}
a{color:var(--green-dark);text-decoration:none}
.topbar{background:var(--navy);color:#fff;padding:16px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20}
.logo{font-family:var(--disp);font-size:20px;letter-spacing:-.3px}
.logo span{color:var(--green)}
.logo .plat{display:block;font-family:var(--font);font-size:9.5px;color:rgba(255,255,255,.4);letter-spacing:.4px;margin-top:1px}
.topbar-r{display:flex;align-items:center;gap:14px;font-size:13px}
.topbar-r .who{color:rgba(255,255,255,.75)}
.signout{background:none;border:1px solid rgba(255,255,255,.2);color:rgba(255,255,255,.75);font-family:var(--font);font-size:12px;padding:6px 12px;border-radius:7px;cursor:pointer}
.signout:hover{background:rgba(255,255,255,.08)}
.wrap{max-width:960px;margin:0 auto;padding:24px 20px 60px}
.ro-banner{display:flex;align-items:center;gap:10px;background:var(--white);border:1px solid var(--border);border-left:3px solid var(--green);border-radius:10px;padding:12px 16px;font-size:13px;color:var(--muted);margin-bottom:22px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.card{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.card-hd{padding:15px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:10px}
.card-hd h2{font-size:15px;color:var(--txt)}
.card-hd p{font-size:12px;color:var(--muted);margin-top:2px;font-family:var(--font)}
.card-bd{padding:16px 18px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--off);font-size:13px}
.kv:last-child{border:none}
.kv .k{color:var(--muted)}
.kv .v{font-weight:600;color:var(--txt);text-align:right}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:3px 9px;border-radius:100px;white-space:nowrap}
.hero{background:var(--navy);border-radius:var(--radius);padding:24px 26px;color:#fff;margin-bottom:22px;position:relative;overflow:hidden}
.hero::after{content:'';position:absolute;top:-80px;right:-60px;width:300px;height:300px;background:radial-gradient(circle,rgba(0,200,150,.14),transparent 70%)}
.hero h1{font-size:26px;margin-bottom:4px}
.hero p{font-size:13.5px;color:rgba(255,255,255,.6)}
.stat-row{display:flex;gap:28px;margin-top:18px;position:relative;z-index:1;flex-wrap:wrap}
.stat .n{font-family:var(--disp);font-size:24px}
.stat .l{font-size:11px;color:rgba(255,255,255,.5);text-transform:uppercase;letter-spacing:.4px;margin-top:2px}
.sec-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin:26px 2px 12px}
.cert-row{display:flex;gap:8px;flex-wrap:wrap}
.cert{flex:1;min-width:120px;border:1px solid var(--border);border-radius:9px;padding:9px 11px;font-size:12px}
.cert .cn{color:var(--muted);font-size:11px;margin-bottom:3px}
.cert .cv{font-weight:600}
.empty{text-align:center;padding:40px 20px;color:var(--muted);font-size:13.5px}
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:70vh;gap:14px;color:var(--muted)}
.spin{width:26px;height:26px;border:3px solid var(--border);border-top-color:var(--green);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.btn{display:inline-flex;align-items:center;gap:6px;font-family:var(--font);font-size:12.5px;font-weight:600;padding:8px 14px;border-radius:8px;border:1.5px solid var(--border);background:#fff;color:var(--txt);cursor:pointer;text-decoration:none}
.btn:hover{background:var(--off)}
.btn-navy{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn-navy:hover{background:var(--navy-mid)}
.fg{margin-bottom:14px}
.fg label{display:block;font-size:11.5px;font-weight:600;color:var(--txt);margin-bottom:5px}
.fg input,.fg select,.fg textarea{width:100%;padding:9px 11px;border:1.5px solid var(--border);border-radius:8px;font-family:var(--font);font-size:13.5px;color:var(--txt);background:#fff}
.job{border:1px solid var(--border);border-radius:9px;padding:11px 13px;margin-bottom:8px}
.job .t{font-size:13px;font-weight:600;color:var(--navy)}
.job .m{font-size:11.5px;color:var(--muted);margin:2px 0 4px}
.msg-in{display:flex;gap:8px}
.msg-in input{flex:1;padding:10px 12px;border:1.5px solid var(--border);border-radius:8px;font-family:var(--font);font-size:13.5px}
@media(max-width:720px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">Beacon <span>Residentials</span><span class="plat">Powered by NexLet</span></div>
  <div class="topbar-r"><span class="who" id="who"></span><button class="signout" onclick="signOut()">Sign out</button></div>
</div>

<div id="app"><div class="loading"><div class="spin"></div><div>Loading your tenancy…</div></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/dist/umd/supabase.min.js"></script>
<script>
// ── Tenant portal — enterprise-grade read + limited-write access for a managed
// tenant: view their tenancy & the property's compliance certs (read-only),
// report maintenance issues (writes agency_maintenance, reported_by='tenant'),
// message their agent (2-way, timestamped), and see the notices served to them
// (sent/received/archived trail). RLS scopes every read/write to their own row.
const SUPABASE_URL      = 'https://mahtcfukgzbonwibtsxz.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1haHRjZnVrZ3pib253aWJ0c3h6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU2MjQ2MDAsImV4cCI6MjA5MTIwMDYwMH0.-wC55rGp1WFKfjKR3EhuXqAPDiWJ4w_e2LBXjHr_y5Y';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = id => document.getElementById(id);
const esc = v => v==null?'':String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const gbp = n => '£'+Math.round(n||0).toLocaleString('en-GB');
const fmtDate = d => d?new Date(d).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}):'—';

function daysUntil(d){ if(!d) return null; const due=new Date(d); due.setHours(0,0,0,0); const now=new Date(); now.setHours(0,0,0,0); return Math.round((due-now)/864e5); }
function certRAG(d){ if(!d) return {label:'Not on file',bg:'var(--red-bg)',color:'var(--red)'}; const n=daysUntil(d); if(n<0) return {label:'Expired',bg:'var(--red-bg)',color:'var(--red)'}; if(n<30) return {label:n+'d left',bg:'var(--amber-bg)',color:'var(--amber)'}; return {label:'Valid',bg:'var(--green-bg)',color:'var(--green-dark)'}; }

async function signOut(){ await sb.auth.signOut(); location.href='login.html'; }

async function boot(){
  if(new URLSearchParams(location.search).get('preview')){ return renderSample(); }
  const { data:{ session } } = await sb.auth.getSession();
  if(!session){
    const inv=new URLSearchParams(location.search).get('invite');
    location.href='login.html?next='+encodeURIComponent('tenant-portal.html')+(inv?('&invite='+encodeURIComponent(inv)):'');
    return;
  }

  const inviteToken=new URLSearchParams(location.search).get('invite');
  if(inviteToken){
    try{ await sb.rpc('agency_tenant_invite_accept',{p_token:inviteToken}); }catch(e){ console.warn(e); }
    try{ history.replaceState(null,'','tenant-portal.html'); }catch(e){}
  }
  try{ await sb.rpc('claim_managed_tenant'); }catch(e){ console.warn(e); }

  const { data:me } = await sb.from('agency_tenants').select('*').eq('user_id',session.user.id).maybeSingle();
  if(!me){ renderNoAccess(session.user.email); return; }
  $('who').textContent = me.name || session.user.email;
  window._me = me; window._email = session.user.email; window._token = session.access_token;

  const [propR, agR, jobsR, noticesR, msgsR] = await Promise.all([
    sb.from('properties').select('*').eq('id', me.property_id).maybeSingle(),
    sb.from('agencies').select('*').eq('id', me.agency_id).maybeSingle(),
    sb.from('agency_maintenance').select('*').eq('tenant_id', me.id).order('created_at',{ascending:false}),
    sb.from('agency_notices').select('*').eq('property_id', me.property_id).order('created_at',{ascending:false}),
    sb.from('agency_messages').select('*').eq('tenant_id', me.id).order('created_at',{ascending:true})
  ]);
  window._ag = agR.data||{}; window._prop = propR.data||{};
  render(me, agR.data||{}, propR.data||{}, jobsR.data||[], noticesR.data||[], msgsR.data||[]);
  setInterval(pollMessages, 15000);
}
async function pollMessages(){
  if(!window._me) return;
  try{ const {data}=await sb.from('agency_messages').select('*').eq('tenant_id',window._me.id).order('created_at',{ascending:true});
    if(data){ const wrap=$('msg-list'); if(wrap) wrap.innerHTML=msgBubbles(data); } }catch(e){}
}

function renderNoAccess(email){
  $('app').innerHTML = `<div class="wrap"><div class="empty" style="padding-top:70px">
    <div style="font-size:34px;margin-bottom:12px">🔑</div>
    <h2 style="margin-bottom:8px">No tenancy found</h2>
    <p style="max-width:440px;margin:0 auto 18px">We couldn't find a tenancy on file for <b>${esc(email)}</b>. If your letting agent has invited you, make sure you signed in with the same email — or ask them to re-send the invite.</p>
  </div></div>`;
}

function render(me, ag, prop, jobs, notices, msgs){
  const c=(prop&&prop.certs)||{};
  const cert=(nm,d,extra)=>{const r=certRAG(d);return `<div class="cert"><div class="cn">${nm}</div><div class="cv"><span class="pill" style="background:${r.bg};color:${r.color}">${r.label}</span>${extra||''}</div></div>`;};

  const tenancyCard=`<div class="card"><div class="card-hd"><h2>Your tenancy</h2><p>Key details on file</p></div><div class="card-bd">
    <div class="kv"><span class="k">Property</span><span class="v">${esc((prop&&prop.address)||'—')}${prop&&prop.city?', '+esc(prop.city):''}</span></div>
    <div class="kv"><span class="k">Monthly rent</span><span class="v">${gbp(me.rent)}</span></div>
    <div class="kv"><span class="k">Tenancy start</span><span class="v">${fmtDate(me.start_date)}</span></div>
    <div class="kv"><span class="k">Deposit held</span><span class="v">${me.deposit!=null?gbp(me.deposit):'—'}${me.scheme?' · '+esc(me.scheme):''}</span></div>
    <div class="kv" style="border:none"><span class="k">Status</span><span class="v"><span class="pill" style="background:${me.status==='active'?'var(--green-bg)':'var(--off)'};color:${me.status==='active'?'var(--green-dark)':'var(--muted)'}">${me.status==='active'?'Active':esc(me.status||'—')}</span></span></div>
  </div></div>`;

  const agentCard=`<div class="card"><div class="card-hd"><h2>Your managing agent</h2><p>Who to contact</p></div><div class="card-bd">
    <div class="kv"><span class="k">Agency</span><span class="v">${esc(ag.name||'Beacon Residentials Ltd')}</span></div>
    ${ag.address?`<div class="kv"><span class="k">Address</span><span class="v">${esc(ag.address)}</span></div>`:''}
    <div class="kv" style="border:none"><span class="k">Redress scheme</span><span class="v">${esc(ag.redress_scheme||'—')}</span></div>
  </div></div>`;

  const certCard = prop ? `<div class="card" style="margin-top:16px"><div class="card-hd"><h2>Property compliance</h2><p>Certificates your agent keeps current</p></div><div class="card-bd">
    <div class="cert-row">
      ${cert('Gas Safety',c.gas)}
      ${cert('EICR (Electrical)',c.eicr)}
      ${cert('EPC',c.epc,c.epcRating?` <span style="color:var(--muted);font-weight:500">· ${esc(c.epcRating)}</span>`:'')}
    </div>
  </div></div>` : '';

  const jobRows = jobs.length ? jobs.map(j=>`<div class="job">
      <div class="t">${esc(j.category||'General')}${j.damp_mould?' · damp/mould':''}</div>
      <div class="m">${fmtDate(j.created_at)} · ${esc((j.status||'reported').replace('_',' '))}${j.severity==='urgent'?' · <b style="color:var(--red)">urgent</b>':''}</div>
      ${(j.photos||[]).length?`<div style="display:flex;gap:6px;margin-bottom:6px">${j.photos.map(u=>`<a href="${esc(u)}" target="_blank"><img src="${esc(u)}" style="width:52px;height:52px;object-fit:cover;border-radius:6px;background:var(--off)"></a>`).join('')}</div>`:''}
      <div style="font-size:12.5px;color:var(--txt)">${esc(j.description||'—')}</div>
    </div>`).join('') : `<div class="empty" style="padding:20px 0">No maintenance issues reported yet.</div>`;

  const maintCard = `<div class="card" style="margin-top:16px"><div class="card-hd"><h2>Maintenance</h2><p>Report an issue and we'll email you a confirmation</p></div><div class="card-bd">
    <div style="background:var(--red-bg);border-radius:9px;padding:11px 13px;margin-bottom:16px;font-size:12.5px;line-height:1.55;color:var(--txt)">
      <b style="color:var(--red)">Emergency?</b> If you smell gas, leave the property and call the National Gas Emergency line on <a href="tel:08001119999" style="color:var(--red);font-weight:700">0800 111 999</a>. If there's a fire or anyone is in danger, call <b>999</b>. Then call us on <a href="tel:${esc((ag.phone||'020 3627 0295').replace(/\s/g,''))}" style="color:var(--red);font-weight:700">${esc(ag.phone||'020 3627 0295')}</a>.
    </div>
    <div class="fg"><label>How urgent is it?</label><select id="jb-urg">
      <option value="normal">Routine: can wait a few days</option>
      <option value="urgent">Urgent: e.g. no heating or hot water, a leak, no power</option>
    </select></div>
    <div class="fg"><label>Category</label><select id="jb-cat">${['General','Plumbing','Electrical','Heating','Damp & mould','Appliance','Structural','Pest control'].map(x=>`<option>${x}</option>`).join('')}</select></div>
    <div class="fg"><label>What's the issue?</label><textarea id="jb-desc" rows="3" placeholder="Describe what's wrong and where"></textarea></div>
    <label style="display:flex;align-items:center;gap:8px;font-size:12.5px;margin-bottom:14px;cursor:pointer"><input type="checkbox" id="jb-damp" style="width:auto"> This involves damp or mould</label>
    <div class="fg"><label>Photos <span style="font-weight:400;color:var(--muted)">(optional, up to 4, very helpful)</span></label><input type="file" id="jb-photos" accept="image/*" multiple style="padding:7px"></div>
    <button class="btn btn-navy" id="jb-btn" onclick="reportJob()">Report issue</button>
    <div id="jb-msg" style="font-size:12.5px;margin-top:10px"></div>
    <div class="sec-title" style="margin-top:22px">Your reports</div>
    ${jobRows}
  </div></div>`;

  const noticeRows = notices.length ? notices.map(n=>{
    const st = n.status==='served'?['Received',  'var(--amber-bg)','var(--amber)'] : n.status==='withdrawn'?['Archived','var(--off)','#94A3B8'] : ['Not yet sent','var(--off)','#475569'];
    return `<div style="display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--off)">
      <span style="font-size:16px">⚖</span>
      <div style="flex:1"><div style="font-size:13px;font-weight:600;color:var(--navy)">${n.kind==='section13'?'Notice of rent increase':'Section 8 possession notice'}</div>
      <div style="font-size:11px;color:var(--muted)">${fmtDate(n.served_date||n.created_at)}</div></div>
      <span class="pill" style="background:${st[1]};color:${st[2]}">${st[0]}</span></div>`;
  }).join('') : `<div class="empty" style="padding:20px 0">No notices on file.</div>`;
  const docCard = `<div class="card" style="margin-top:16px"><div class="card-hd"><h2>Documents</h2><p>Notices served to you — sent, received &amp; archived</p></div><div class="card-bd" style="padding-top:4px">${noticeRows}</div></div>`;

  const msgCard = `<div class="card" style="margin-top:16px"><div class="card-hd"><h2>Messages</h2><p>Two-way, timestamped — talk directly with ${esc(ag.name||'your agent')}</p></div>
    <div class="card-bd">
      <div id="msg-list" style="max-height:280px;overflow-y:auto;margin-bottom:12px">${msgBubbles(msgs||[])}</div>
      <div class="msg-in"><input id="msg-input" placeholder="Write a message…" onkeydown="if(event.key==='Enter')sendMsg()"><button class="btn btn-navy" onclick="sendMsg()">Send</button></div>
    </div></div>`;

  $('app').innerHTML = `<div class="wrap">
    <div class="ro-banner">👁 This is your tenancy portal. Your letting agent manages the records above — message them for anything you need changed.</div>
    <div class="hero">
      <h1>Hello, ${esc((me.name||'').split(' ')[0]||'there')}</h1>
      <p>Your tenancy at ${esc((prop&&prop.address)||'your property')}, managed by ${esc(ag.name||'Beacon Residentials Ltd')}.</p>
      <div class="stat-row">
        <div class="stat"><div class="n">${gbp(me.rent)}</div><div class="l">Monthly rent</div></div>
        <div class="stat"><div class="n">${fmtDate(me.start_date)}</div><div class="l">Tenancy start</div></div>
        <div class="stat"><div class="n">${jobs.filter(j=>j.status!=='completed').length}</div><div class="l">Open issues</div></div>
      </div>
    </div>
    <div class="grid">${tenancyCard}${agentCard}</div>
    ${certCard}
    ${maintCard}
    ${docCard}
    ${msgCard}
  </div>`;
}
function msgBubbles(msgs){
  if(!msgs.length) return '<div style="color:var(--muted);font-size:13px;text-align:center;padding:16px 0">No messages yet — say hello below.</div>';
  return msgs.map(m=>{ const mine=m.sender==='tenant'; return `<div style="display:flex;justify-content:${mine?'flex-end':'flex-start'};margin-bottom:8px">
    <div style="max-width:78%;background:${mine?'var(--navy)':'var(--off)'};color:${mine?'#fff':'var(--txt)'};border-radius:11px;padding:9px 13px">
      <div style="font-size:13px;line-height:1.5;white-space:pre-wrap">${esc(m.body)}</div>
      <div style="font-size:10px;margin-top:3px;color:${mine?'rgba(255,255,255,.55)':'var(--muted)'}">${mine?'You':'Agent'} · ${new Date(m.created_at).toLocaleString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</div>
    </div></div>`; }).join('');
}
async function sendMsg(){
  const el=$('msg-input'); const body=(el.value||'').trim(); if(!body||!window._me) return;
  el.disabled=true;
  const row={id:'msg'+Math.random().toString(36).slice(2,10),agency_id:window._me.agency_id,tenant_id:window._me.id,property_id:window._me.property_id,sender:'tenant',body};
  const { error } = await sb.from('agency_messages').insert(row);
  el.disabled=false;
  if(error){ console.error(error); alert('Could not send — please try again'); return; }
  el.value='';
  const { data } = await sb.from('agency_messages').select('*').eq('tenant_id',window._me.id).order('created_at',{ascending:true});
  if(data) $('msg-list').innerHTML=msgBubbles(data);
}
const EDGE='https://mahtcfukgzbonwibtsxz.supabase.co/functions/v1/ai-proxy';
const AGENCY_MAINT_EMAIL='maintenance@beaconresidentials.co.uk';
function sendMail(to,subject,html){
  if(!to) return Promise.resolve({ok:false});
  return fetch(EDGE,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+(window._token||'')},
    body:JSON.stringify({type:'send_email',to,subject,html,from:((window._ag&&window._ag.name)||'Beacon Residentials')+' <documents@beaconresidentials.co.uk>'})})
    .then(r=>({ok:r.ok})).catch(e=>{ console.error('[maint email]',e); return {ok:false}; });
}
/* Shrinks photos before upload to keep storage egress down.
   Anything the browser can't decode (e.g. HEIC) goes up as-is. */
function shrinkPhoto(file){
  return new Promise(res=>{
    const r=new FileReader(); r.onerror=()=>res(file);
    r.onload=()=>{ const img=new Image(); img.onerror=()=>res(file);
      img.onload=()=>{ const max=1000, k=Math.min(1,max/Math.max(img.width,img.height));
        const c=document.createElement('canvas'); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);
        c.getContext('2d').drawImage(img,0,0,c.width,c.height);
        c.toBlob(b=>res(b?new File([b],'photo.jpg',{type:'image/jpeg'}):file),'image/jpeg',0.75); };
      img.src=r.result; };
    r.readAsDataURL(file); });
}
function brandedMail(inner){
  const ag=window._ag||{}, name=ag.name||'Beacon Residentials Ltd';
  return `<div style="font-family:Arial,sans-serif;max-width:520px;margin:0 auto;color:#4A4038">
    <div style="background:#1B2F4A;padding:20px 24px;border-radius:10px 10px 0 0"><div style="font-size:9px;font-weight:600;color:#C9B99E;letter-spacing:1px;text-transform:uppercase;margin-bottom:4px">Powered by NexLet AI</div><span style="color:#fff;font-size:20px;font-weight:700">${esc(name)}</span></div>
    <div style="border:1px solid #E3D9C8;border-top:none;border-radius:0 0 10px 10px;padding:26px 24px;font-size:14px;line-height:1.6">${inner}</div>
    <p style="font-size:11px;color:#8A7D6E;margin-top:14px;text-align:center">${esc(name)} · ${esc(ag.phone||'020 3627 0295')}${ag.redress_scheme?' · '+esc(ag.redress_scheme):''}</p></div>`;
}
async function reportJob(){
  if(!window._me || window._jbBusy) return;
  const desc=$('jb-desc').value.trim();
  if(!desc){ alert('Please describe the issue'); return; }
  const btn=$('jb-btn'), msg=$('jb-msg');
  window._jbBusy=true; btn.disabled=true; btn.textContent='Sending…';
  const me=window._me, id='mt'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  const cat=$('jb-cat').value;
  const damp=$('jb-damp').checked||cat==='Damp & mould';
  const urgent=$('jb-urg').value==='urgent';
  const files=[...($('jb-photos').files||[])].slice(0,4), photos=[];
  if(files.length) msg.innerHTML='<span style="color:var(--muted)">Uploading photos…</span>';
  for(const f of files){
    try{ const up=await shrinkPhoto(f); const ext=up.type==='image/jpeg'?'jpg':((f.name.split('.').pop()||'jpg').toLowerCase());
      const path='maintenance/'+me.id+'/'+id+'/'+Date.now()+Math.random().toString(36).slice(2,5)+'.'+ext;
      const {error:ue}=await sb.storage.from('tenant-documents').upload(path,up,{upsert:true,contentType:up.type||'image/jpeg'});
      if(!ue){ const {data:u}=sb.storage.from('tenant-documents').getPublicUrl(path); if(u&&u.publicUrl) photos.push(u.publicUrl); }
      else console.warn('[photo upload]',ue.message);
    }catch(e){ console.warn('[photo]',e); }
  }
  const row={id,agency_id:me.agency_id,property_id:me.property_id,tenant_id:me.id,reported_by:'tenant',category:cat,description:desc,photos,
    severity:damp?'hazard':(urgent?'urgent':'normal'),damp_mould:damp,status:'reported'};
  const { error } = await sb.from('agency_maintenance').insert(row);
  if(error){ console.error(error); window._jbBusy=false; btn.disabled=false; btn.textContent='Report issue';
    msg.innerHTML='<span style="color:var(--red)">Could not send your report. Please try again, or call us on '+esc((window._ag&&window._ag.phone)||'020 3627 0295')+'.</span>'; return; }
  const ag=window._ag||{}, pr=window._prop||{};
  const addr=(pr.address||'')+(pr.city?', '+pr.city:'');
  const lvl=damp?"Damp / mould (Awaab's Law)":(urgent?'Urgent':'Routine');
  const phone=ag.phone||'020 3627 0295';
  const photoHtml=photos.length?'<p style="margin:12px 0 0">'+photos.map((u,i)=>'<a href="'+esc(u)+'">Photo '+(i+1)+'</a>').join(' · ')+'</p>':'';
  const details=`<div style="background:#FBF3E7;border-radius:8px;padding:14px 16px;font-size:13.5px"><b>Reference:</b> ${esc(id.toUpperCase())}<br><b>Property:</b> ${esc(addr||'—')}<br><b>Category:</b> ${esc(cat)}<br><b>Priority:</b> ${lvl}<br><b>Description:</b> ${esc(desc)}</div>`;
  const agentHtml=brandedMail(`<p style="margin:0 0 12px"><b>${urgent||damp?'⚠ ':''}New repair reported by ${esc(me.name||'tenant')}</b></p>${details}${photoHtml}
    <p style="margin:14px 0 0;font-size:12.5px;color:#8A7D6E">Open the Maintenance page in NexLet to acknowledge it.</p>`);
  const tenantHtml=brandedMail(`<p style="margin:0 0 12px">Dear ${esc(me.name||'')},</p>
    <p style="margin:0 0 14px">Thank you for letting us know. We've received your repair report and will be in touch shortly to arrange the next steps.</p>${details}
    <p style="margin:14px 0 0">If the problem gets worse or becomes an emergency, please call us on ${esc(phone)}. If you smell gas, leave the property and call 0800 111 999.</p>
    <p style="margin:18px 0 0">Kind regards,<br><b>${esc(ag.name||'Beacon Residentials')}</b></p>`);
  const subj=(urgent||damp?'URGENT: ':'')+'Repair reported: '+cat+(pr.address?' at '+pr.address:'');
  await Promise.all([
    sendMail(AGENCY_MAINT_EMAIL, subj, agentHtml),
    sendMail(me.email||window._email, "We've received your repair report ("+id.toUpperCase()+')', tenantHtml)
  ]);
  location.reload();
}
