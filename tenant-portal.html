<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Tenancy — Beacon Residentials</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%230B1E3D'/><path d='M8 22V13l8-6 8 6v9' stroke='%2300C896' stroke-width='2' fill='none' stroke-linecap='round' stroke-linejoin='round'/><path d='M13 22v-5h6v5' stroke='%2300C896' stroke-width='2' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --font:'DM Sans',system-ui,sans-serif; --disp:'DM Serif Display',Georgia,serif;
  --navy:#0B1E3D; --green:#00C896; --green-dark:#009970;
  --off:#F6F8FB; --border:#E4EAF1; --txt:#1A2B45; --muted:#7A8FA6;
  --red:#E53E3E; --red-bg:#FDECEC; --amber:#D97706; --amber-bg:#FEF3C7; --green-bg:rgba(0,200,150,.12);
  --radius:12px;
}
body{font-family:var(--font);color:var(--txt);background:var(--off);min-height:100vh;-webkit-font-smoothing:antialiased}
h1,h2{font-family:var(--disp);font-weight:400}
.topbar{background:var(--navy);color:#fff;padding:16px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20}
.logo{font-family:var(--disp);font-size:20px}
.logo span{color:var(--green)}
.logo .plat{display:block;font-family:var(--font);font-size:9.5px;color:rgba(255,255,255,.4);margin-top:1px}
.signout{background:none;border:1px solid rgba(255,255,255,.2);color:rgba(255,255,255,.75);font-family:var(--font);font-size:12px;padding:6px 12px;border-radius:7px;cursor:pointer}
.wrap{max-width:820px;margin:0 auto;padding:24px 20px 60px}
.ro-banner{display:flex;gap:10px;background:#fff;border:1px solid var(--border);border-left:3px solid var(--green);border-radius:10px;padding:12px 16px;font-size:13px;color:var(--muted);margin-bottom:20px}
.hero{background:var(--navy);border-radius:var(--radius);padding:24px 26px;color:#fff;margin-bottom:20px}
.hero h1{font-size:24px}
.hero p{font-size:13px;color:rgba(255,255,255,.6);margin-top:4px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px}
.card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.card-hd{padding:14px 18px;border-bottom:1px solid var(--border)}
.card-hd h2{font-size:14.5px}
.card-bd{padding:16px 18px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--off);font-size:13px}
.kv:last-child{border:none}
.kv .k{color:var(--muted)}.kv .v{font-weight:600;text-align:right}
.pill{display:inline-flex;font-size:11px;font-weight:600;padding:3px 9px;border-radius:100px}
.btn{display:inline-flex;align-items:center;gap:6px;font-family:var(--font);font-size:12.5px;font-weight:600;padding:9px 16px;border-radius:8px;border:1.5px solid var(--border);background:#fff;color:var(--txt);cursor:pointer}
.btn.navy{background:var(--navy);color:#fff;border-color:var(--navy)}
textarea,select,input{width:100%;padding:9px 11px;border:1.5px solid var(--border);border-radius:8px;font-family:var(--font);font-size:13px;margin-top:4px}
label{font-size:12px;font-weight:600;color:var(--txt)}
.fg{margin-bottom:12px}
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:70vh;gap:14px;color:var(--muted)}
.spin{width:26px;height:26px;border:3px solid var(--border);border-top-color:var(--green);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:40px 20px;color:var(--muted);font-size:13.5px}
.job{border-bottom:1px solid var(--off);padding:10px 0}
.job:last-child{border:none}
@media(max-width:720px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="topbar">
  <div class="logo">Beacon <span>Residentials</span><span class="plat">Powered by NexLet</span></div>
  <div style="display:flex;align-items:center;gap:14px;font-size:13px">
    <span id="who" style="color:rgba(255,255,255,.75)"></span>
    <button class="signout" onclick="signOut()">Sign out</button>
  </div>
</div>
<div id="app"><div class="loading"><div class="spin"></div><div>Loading your tenancy…</div></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL='https://mahtcfukgzbonwibtsxz.supabase.co';
const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1haHRjZnVrZ3pib253aWJ0c3h6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU2MjQ2MDAsImV4cCI6MjA5MTIwMDYwMH0.-wC55rGp1WFKfjKR3EhuXqAPDiWJ4w_e2LBXjHr_y5Y';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const $=id=>document.getElementById(id);
const esc=v=>v==null?'':String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const gbp=n=>'£'+Math.round(n||0).toLocaleString('en-GB');
const fmtDate=d=>d?new Date(d).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}):'—';
let ME=null;

async function signOut(){ await sb.auth.signOut(); location.href='login.html'; }

async function boot(){
  if(new URLSearchParams(location.search).get('preview')) return renderSample();
  const { data:{ session } } = await sb.auth.getSession();
  if(!session){ location.href='login.html'; return; }
  let claim='none'; try{ const r=await sb.rpc('claim_managed_tenant'); claim=r.data; }catch(e){}
  const { data:me } = await sb.from('agency_tenants').select('*').eq('user_id',session.user.id).maybeSingle();
  if(!me){ $('app').innerHTML=`<div class="wrap"><div class="empty" style="padding-top:70px"><div style="font-size:34px;margin-bottom:12px">🔑</div><h2 style="margin-bottom:8px">No tenancy found</h2><p>We couldn't find a tenancy for <b>${esc(session.user.email)}</b>. Make sure you signed in with the email your agent holds for you.</p></div></div>`; return; }
  ME=me; $('who').textContent=me.name||session.user.email;
  const [ag,p,rl,mt]=await Promise.all([
    sb.from('agencies').select('*').eq('id', me.agency_id).maybeSingle(),
    sb.from('properties').select('*').eq('id',me.property_id).maybeSingle(),
    sb.from('agency_rent_ledger').select('*').eq('tenant_id',me.id).order('due_date',{ascending:false}),
    sb.from('agency_maintenance').select('*').eq('tenant_id',me.id).order('created_at',{ascending:false})
  ]);
  render(me, (ag&&ag.data)||{}, (p&&p.data)||{}, rl.data||[], mt.data||[]);
}

function render(me, ag, p, ledger, jobs){
  const c=p.certs||{};
  const arrears=ledger.filter(r=>r.status!=='paid'&&new Date(r.due_date)<=new Date()).reduce((s,r)=>s+r.amount,0);
  $('app').innerHTML = `<div class="wrap">
    <div class="ro-banner">👁 This is your tenancy portal. Contact your managing agent for anything you can't do here.</div>
    <div class="hero"><h1>Hello, ${esc((me.name||'').split(' ')[0]||'there')}</h1><p>${esc(p.address||'')}${p.city?', '+esc(p.city):''} · managed by ${esc(ag.name||'Beacon Residentials Ltd')}</p></div>
    <div class="grid">
      <div class="card"><div class="card-hd"><h2>Your tenancy</h2></div><div class="card-bd">
        <div class="kv"><span class="k">Rent</span><span class="v">${gbp(me.rent)}/month</span></div>
        <div class="kv"><span class="k">Start date</span><span class="v">${fmtDate(me.start_date)}</span></div>
        <div class="kv"><span class="k">Deposit</span><span class="v">${me.deposit?gbp(me.deposit)+(me.scheme?' · '+esc(me.scheme):''):'—'}</span></div>
        <div class="kv" style="border:none"><span class="k">Rent status</span><span class="v">${arrears>0?`<span class="pill" style="background:var(--red-bg);color:var(--red)">${gbp(arrears)} due</span>`:`<span class="pill" style="background:var(--green-bg);color:var(--green-dark)">Up to date</span>`}</span></div>
      </div></div>
      <div class="card"><div class="card-hd"><h2>Property compliance</h2></div><div class="card-bd">
        <div class="kv"><span class="k">Gas Safety</span><span class="v">${c.gas?fmtDate(c.gas):'—'}</span></div>
        <div class="kv"><span class="k">EICR</span><span class="v">${c.eicr?fmtDate(c.eicr):'—'}</span></div>
        <div class="kv" style="border:none"><span class="k">EPC</span><span class="v">${c.epc?fmtDate(c.epc)+(c.epcRating?' · '+esc(c.epcRating):''):'—'}</span></div>
      </div></div>
    </div>
    <div class="card" style="margin-bottom:20px"><div class="card-hd" style="display:flex;justify-content:space-between;align-items:center"><h2>Report a maintenance issue</h2></div>
      <div class="card-bd">
        <div class="fg"><label>Category</label><select id="mt-cat">${['General','Plumbing','Electrical','Heating','Damp & mould','Appliance','Structural','Pest control'].map(x=>`<option>${x}</option>`).join('')}</select></div>
        <div class="fg"><label>Describe the issue</label><textarea id="mt-desc" rows="3" placeholder="What's happening, and where?"></textarea></div>
        <button class="btn navy" onclick="reportIssue()">Submit report</button>
      </div></div>
    <div class="card"><div class="card-hd"><h2>Your reported issues</h2></div>
      <div class="card-bd">${jobs.length?jobs.map(j=>`<div class="job"><div style="font-weight:600;font-size:13px">${esc(j.category)}</div><div style="font-size:12.5px;color:var(--muted)">${esc(j.description)}</div><div style="font-size:11px;color:var(--muted);margin-top:3px">${fmtDate(j.created_at)} · <span style="text-transform:capitalize">${esc((j.status||'').replace('_',' '))}</span></div></div>`).join(''):'<div class="faint" style="color:var(--muted);font-size:13px">No issues reported yet.</div>'}</div></div>
  </div>`;
}
async function reportIssue(){
  const desc=$('mt-desc').value.trim(); if(!desc){ alert('Please describe the issue'); return; }
  const job={id:'mt'+Date.now().toString(36)+Math.random().toString(36).slice(2,8),agency_id:ME.agency_id,property_id:ME.property_id,tenant_id:ME.id,reported_by:'tenant',category:$('mt-cat').value,description:desc,severity:'normal',damp_mould:$('mt-cat').value==='Damp & mould',status:'reported'};
  const {error}=await sb.from('agency_maintenance').insert(job);
  if(error){ alert('Could not submit — please try again or contact your agent directly.'); return; }
  boot();
}
function renderSample(){
  $('who').textContent='Tom Blake';
  render({name:'Tom Blake',rent:1200,start_date:'2025-06-01',deposit:1385,scheme:'DPS',agency_id:'x'},
    {name:'Beacon Residentials Ltd'},
    {address:'42 Elm Street',city:'Leeds',certs:{gas:'2026-11-01',eicr:'2029-01-01',epc:'2031-01-01',epcRating:'C'}},
    [], [{category:'Heating',description:'Radiator in bedroom not heating up',created_at:'2026-06-10',status:'in_progress'}]);
}
boot();
</script>
</body>
</html>
