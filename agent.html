// ── Useful-life lookup (years) — standard figures used by TDS/mydeposits/DPS product-lifespan
// guides, editable per item. Deposit deductions must apportion by remaining useful life, never
// charge full replacement ("betterment") — see Propertymark/mydeposits guidance.
const ITEM_LIFE=[
  [/carpet/i,5],[/curtain|blind/i,5],[/paint|decorat|wallpaper|wall\b/i,4],
  [/laminate|vinyl|wood(en)? floor|flooring/i,10],[/sofa|armchair|upholster/i,8],
  [/mattress|\bbed\b/i,8],[/towel|bedding|linen|duvet|pillow/i,2],
  [/fridge|freezer|washing machine|dishwasher|\boven\b|cooker|microwave|appliance/i,8],
  [/kitchen unit|worktop|cupboard/i,15],[/bath|shower|toilet|sanitaryware|basin/i,15],
  [/door|handle|lock/i,10],[/furniture|wardrobe|table|chair|desk|drawer/i,10]
];
function _usefulLife(itemName){ const m=ITEM_LIFE.find(([re])=>re.test(itemName||'')); return m?m[1]:6; }
// Deterministic apportionment — AI supplies classification, estimated cost & apparent age;
// this function does the actual maths so the figure is defensible at adjudication, not just AI-asserted.
function _apportionCharge(classification,estCost,ageAtCheckin,lifeYears,tenancyMonths){
  estCost=+estCost||0; ageAtCheckin=+ageAtCheckin||0; lifeYears=+lifeYears||6;
  const tenancyYears=(tenancyMonths||0)/12;
  if(classification==='fair_wear'||!estCost) return {charge:0,breakdown:'Classified as fair wear &amp; tear — not chargeable.'};
  if(classification==='cleaning') return {charge:Math.round(estCost),breakdown:'Cleaning cost charged in full (£'+Math.round(estCost)+') — fair wear &amp; tear applies to condition, not cleanliness.'};
  const ageAtEnd=ageAtCheckin+tenancyYears;
  const remaining=Math.max(0,lifeYears-ageAtEnd);
  const fraction=lifeYears>0?remaining/lifeYears:0;
  const charge=Math.round(estCost*fraction);
  const breakdown=`Estimated repair/replacement cost £${Math.round(estCost)}. Useful life ${lifeYears} yrs; item was ~${ageAtCheckin.toFixed(1)} yrs old at check-in, +${tenancyYears.toFixed(1)} yrs tenancy = ${ageAtEnd.toFixed(1)} yrs old now, leaving ${remaining.toFixed(1)} yrs (${Math.round(fraction*100)}%) of useful life. Apportioned charge: £${Math.round(estCost)} × ${Math.round(fraction*100)}% = £${charge} (never the full replacement cost — avoids betterment).`;
  return {charge,breakdown};
}

async function addRoomPhotos(vid,i,stage,visitIdx,input){
  const files=[...(input.files||[])]; if(!files.length) return;
  const v=(S.inventories2||[]).find(x=>x.id===vid); const r=_ensureRoomShape(v.rooms[i]);
  const target=stage==='visit'?r.visits[visitIdx]:r[stage];
  let failed=0;
  for(const f of files){
    /* null means the browser could not decode it — HEIC, or a truncated file.
       Upload the original rather than losing the photograph. */
    const resized=await _resizeImg(f,700), blob=resized||f;
    const ext=resized?'jpg':((f.name||'').split('.').pop()||'jpg');
    const url=await _storageUpload(blob,vid+'/'+Date.now()+'-'+Math.random().toString(36).slice(2,7)+'.'+ext,'property-documents');
    /* The capture time has to be read from f, not from blob: drawing a photo
       onto a canvas to resize it throws the EXIF away. */
    if(url){ target.photos.push(url);
      if(window.NexLetCapture) await NexLetCapture.record(v,url,f,blob);
    } else failed++;
  }
  pushInv2(v); render();
  if(failed) toast('⚠ '+failed+' photo'+(failed>1?'s':'')+' failed to upload — check your connection and try again',1);
}

        </div>

      <div style="display:flex;gap:8px;margin-bottom:2px"><div style="flex:1"><div style="display:flex;gap:6px">${photoStrip(x.checkinPhotos)}</div>${_prov(x.checkinPhotos)}</div><div style="flex:1"><div style="display:flex;gap:6px">${photoStrip(x.stagePhotos)}</div>${_prov(x.stagePhotos)}</div></div>

      ${(r.type==='moveout'||r.type==='precheckout')&&x.charge?`<div style="background:#FBF6F2;border:1px solid #F0E0D4;border-radius:7px;padding:8px 11px;font-size:11px;color:#8A5A3A;line-height:1.55">${esc(x.summary)}${x.breakdown?'<br><span style="color:#A87A56">'+x.breakdown+'</span>':''}</div>`:(r.type!=='moveout'&&r.type!=='precheckout')?`<div style="font-size:11px;color:#8A7D6E;line-height:1.5">${esc(x.summary)}</div>`:`<div style="font-size:11px;color:#8A7D6E;line-height:1.5">${esc(x.summary)}</div>`}
    </div>`;
  }).join('');
  const footer=((r.type==='moveout'||r.type==='precheckout')?`<div style="background:#F9FAFB;border-top:1px solid #E2E5EA;padding:16px 24px;font-size:10.5px;color:#7A8699;line-height:1.6"><b style="color:#8A7D6E">How these figures were calculated</b><br>Every item was classified as fair wear &amp; tear (never chargeable), cleaning (charged in full), or damage. Damage is apportioned by remaining useful life: repair/replacement cost × (years of useful life remaining ÷ total useful life) — the tenant never pays full replacement cost, per Propertymark/mydeposits betterment guidance. The maths for each chargeable item is shown against that item above.${r.type==='precheckout'?' These figures are indicative only — the real move-out inspection determines the final deduction.':''}</div>`:'')
    +((r.sentLandlordAt||r.sentTenantAt)?`<div style="background:#EAF6EF;border-top:1px solid #E2E5EA;padding:10px 24px;font-size:10.5px;color:#1B7A4B;line-height:1.6">${r.sentLandlordAt?'✓ Sent to landlord '+new Date(r.sentLandlordAt).toLocaleString('en-GB',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}):''}${r.sentLandlordAt&&r.sentTenantAt?' · ':''}${r.sentTenantAt?'✓ Sent to tenant '+new Date(r.sentTenantAt).toLocaleString('en-GB',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}):''}</div>`:'')

  return `<div style="font-family:Arial,sans-serif;max-width:640px;margin:0 auto;border-radius:8px;overflow:hidden;border:1px solid #E2E5EA">
    <div style="background:#1B2F4A;color:#fff;padding:20px 24px">

        <div style="text-align:right;font-size:11px;color:rgba(255,255,255,.75);line-height:1.6">${dateBlock}</div>
      </div>
    </div>
    ${money}${remedyBanner}${metaBanner}${cleanBlock}${preamble}${legend}
    <div style="padding:4px 24px 8px;background:#fff">${rows}</div>
    ${footer}
  </div>`;
}
async function _signPhotoArr(arr){ if(!arr||!arr.length) return arr; return Promise.all(arr.map(async u=>(await _signedUrlFor(u))||u)); }
async function _signReportPhotos(r){ const copy={...r,results:await Promise.all(r.results.map(async x=>({...x,checkinPhotos:await _signPhotoArr(x.checkinPhotos),stagePhotos:await _signPhotoArr(x.stagePhotos)})))}; return copy; }
function viewInvReports(vid){
  const v=(S.inventories2||[]).find(x=>x.id===vid); if(!v||!v.reports||!v.reports.length) return;
  const p=P(v.propertyId)||{}; const l=L(p.landlordId)||{}; const t=(S.tenants||[]).find(x=>x.id===v.tenantId)||{};
  const typeLabel={movein:'Move-in',midterm:'Mid-tenancy',precheckout:'Pre-checkout',moveout:'Move-out'};
  modal('Inventory reports','<div class="faint" style="padding:20px;text-align:center">Loading photos…</div>',`<button class="btn" onclick="closeModal()">Close</button>`);
  Promise.all(v.reports.map(r=>_signReportPhotos(r))).then(signedReports=>{
    const body=signedReports.map(r=>`<div style="margin-bottom:18px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;flex-wrap:wrap;gap:6px">
        <b style="font-size:12.5px;color:var(--navy)">${typeLabel[r.type]} · ${fmtDate(r.date)}</b>
        <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">
          ${l.email?`<button class="btn sm ${r.sentLandlordAt?'':'navy'}" onclick="emailInvReport('${vid}','${r.id}','landlord')">${r.sentLandlordAt?'✓ Sent to landlord '+fmtDate(r.sentLandlordAt):'Send to landlord'}</button>`:''}
          ${t.email?`<button class="btn sm ${r.sentTenantAt?'':'navy'}" onclick="emailInvReport('${vid}','${r.id}','tenant')">${r.sentTenantAt?'✓ Sent to tenant '+fmtDate(r.sentTenantAt):'Send to tenant'}</button>`:''}
          <button class="btn sm" onclick="deleteInvReport('${vid}','${r.id}')" style="color:var(--red)">Delete</button>
        </div></div>${_invReportHtml(r,p,t,v)}</div>`).join('');
    modal('Inventory reports',body,`<button class="btn" onclick="closeModal()">Close</button>`);
  });
}
function deleteInvReport(vid,rid){
  if(!confirm('Delete this report? This cannot be undone.')) return;
  const v=(S.inventories2||[]).find(x=>x.id===vid); if(!v) return;
  v.reports=(v.reports||[]).filter(x=>x.id!==rid); pushInv2(v);
  if(v.reports.length) viewInvReports(vid); else closeModal();
  render(); toast('✓ Report deleted');
}
function emailInvReport(vid,rid,recipient){
  const v=(S.inventories2||[]).find(x=>x.id===vid); const r=(v.reports||[]).find(x=>x.id===rid); if(!r) return;
  const p=P(v.propertyId)||{}; const l=L(p.landlordId)||{}; const t=(S.tenants||[]).find(x=>x.id===v.tenantId)||{};
  const to=recipient==='landlord'?l.email:t.email;
  if(!to){ toast('No '+recipient+' email on file',1); return; }
  const typeTitle={movein:'Move-in condition report',midterm:'Mid-tenancy inspection report',precheckout:'Pre-checkout snag list',moveout:'Move-out & deposit report'}[r.type];
  toast('Sending report…');
  _signReportPhotos(r).then(signed=>{
    agencyEmail(to,typeTitle+' — '+(p.address||''),`<div style="font-family:Arial,sans-serif;max-width:640px;margin:0 auto;color:#4A4038">${_invReportHtml(signed,p,t,v)}</div>`);
    if(recipient==='landlord') r.sentLandlordAt=new Date().toISOString(); else r.sentTenantAt=new Date().toISOString();
    pushInv2(v); render(); toast('✓ Report emailed to '+recipient);
  });
}

// AI FEATURE FINDER — "where is X?" helper. Instant keyword match first; falls
// back to the shared AI proxy for a free-text query. Always deep-links via go().
// ═══════════════════════════════════════════════════════════════════════════
const FEATURES=[
  {v:'dashboard',t:'Agency Dashboard',d:'Portfolio overview, KPIs, alerts.',kw:'dashboard overview home summary kpi'},
  {v:'landlords',t:'Landlords',d:'Onboard, verify AML/ID, edit instructions, log contact.',kw:'landlord onboard onboarding aml id verification contact add new landlord'},
  {v:'pipeline',t:'Tenancy Progression',d:'Instructed → marketing → referencing → contract → move-in → managed.',kw:'pipeline progression board stage move in kanban'},
  {v:'referencing',t:'Referencing',d:'Tenant applicant checks: ID, right-to-rent, income, employer, credit.',kw:'referencing tenant check credit right to rent rtr income employer applicant'},
  {v:'properties',t:'Properties',d:'All properties across landlords.',kw:'property properties portfolio list address'},
  {v:'compliance',t:'Compliance',d:'Gas Safety, EICR, EPC — tree view by landlord → property, AI cert scan.',kw:'compliance certificate cert gas safety eicr epc expiry expiring scan ai scan upload certificate'},
  {v:'invoices',t:'Invoices',d:'Management fees (monthly/quarterly/annual), tenant-find, maintenance, rent remittance.',kw:'invoice invoicing billing fee money remittance rent collection client money cmp monthly quarterly maintenance bill'},
  {v:'notices',t:'Possession & Notices',d:'Section 8 (Form 3A) and Section 13 (Form 4A) with a pre-service compliance gate.',kw:'notice section 8 section 13 eviction possession court arrears rent increase form 3a form 4 evict'},
  {v:'templates',t:'Letters & Templates',d:'Welcome letters, rent statements, arrears, renewals — AI-polished, e-signed & timestamped.',kw:'letter letters template templates welcome email ai polish esign e-sign send'},
  {v:'settings',t:'Agency Settings',d:'Agency name, redress scheme, CMP, VAT, ICO, branding.',kw:'settings agency name branding redress cmp vat ico'},
  {v:'rent',t:'Rent & Arrears',d:'Monthly rent due tracking, log payments, see who is in arrears.',kw:'rent arrears payment paid overdue late tenant money due'},
  {v:'maintenance',t:'Maintenance',d:'Repairs log with Awaab’s Law hazard/damp timers.',kw:'maintenance repair repairs job jobs damp mould awaab hazard fix'},
  {v:'inventory2',t:'Inventory & Check-out',d:'Move-in vs move-out photos, AI-classified deposit deductions.',kw:'inventory check out checkout deposit deduction damage wear tear photo compare ai'}
];
function _aiSearchLocal(q){ const s=q.toLowerCase(); let best=null,bestScore=0; FEATURES.forEach(f=>{ const hay=(f.t+' '+f.d+' '+f.kw).toLowerCase(); const score=s.split(/\s+/).filter(w=>w.length>2&&hay.includes(w)).length; if(score>bestScore){bestScore=score;best=f;} }); return bestScore>0?best:null; }
function openAiFinder(){
  const body=`<div class="fg"><label>Ask in plain English — e.g. “where do I send a rent increase” or “how do I scan a gas certificate”</label>
      <input id="aif-q" placeholder="Type your question…" onkeydown="if(event.key==='Enter')aiFinderRun()"></div>
    <div id="aif-result"></div>
    <div class="faint" style="font-size:11.5px;margin-top:10px">Popular: ${FEATURES.slice(0,6).map(f=>`<a href="#" onclick="go('${f.v}');closeModal();return false" style="color:var(--blue);margin-right:10px">${esc(f.t)}</a>`).join('')}</div>`;
  modal('✦ Where do I find…?', body, `<button class="btn" onclick="closeModal()">Close</button><button class="btn navy" onclick="aiFinderRun()">Search</button>`);
  setTimeout(()=>{const i=document.getElementById('aif-q');if(i)i.focus();},50);
}
async function aiFinderRun(){
  const q=val('aif-q'); const box=document.getElementById('aif-result'); if(!q){return;}
  const card=f=>`<div class="note" style="margin-top:12px;cursor:pointer" onclick="go('${f.v}');closeModal()"><b style="color:var(--navy)">${esc(f.t)} →</b><div style="margin-top:3px">${esc(f.d)}</div></div>`;
  const local=_aiSearchLocal(q);
  if(local){ box.innerHTML=card(local); return; }
  if(!window._sessionToken){ box.innerHTML='<div class="faint" style="margin-top:10px">No exact match — try a section name from the sidebar, or connect to search with AI.</div>'; return; }
  box.innerHTML='<div class="faint" style="margin-top:10px;color:var(--blue)">✦ Thinking…</div>';
  try{
    const list=FEATURES.map(f=>f.v+': '+f.t+' — '+f.d).join('\n');
    const prompt=`A letting agent typed this question about where to find something in their portal: "${q}"\n\nAvailable sections:\n${list}\n\nReturn ONLY the single best matching section key (the word before the colon), nothing else. If nothing matches, return "none".`;
    const res=await fetch(AG_EDGE,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+window._sessionToken},body:JSON.stringify({model:'claude-sonnet-4-5',max_tokens:20,messages:[{role:'user',content:prompt}]})});
    const data=await res.json(); const key=((data.content&&data.content[0]&&data.content[0].text)||'').trim().toLowerCase();
    const f=FEATURES.find(x=>x.v===key);
    box.innerHTML = f?card(f):'<div class="faint" style="margin-top:10px">Couldn’t find a match — try browsing the sidebar.</div>';
  }catch(e){ console.error(e); box.innerHTML='<div class="faint" style="margin-top:10px">Search unavailable right now — try browsing the sidebar.</div>'; }
}

// COMPLIANCE — tree view: Landlord ▸ Property ▸ Certificate (native <details>,
// auto-expanded wherever something needs attention).
// ═══════════════════════════════════════════════════════════════════════════
function vCompliance(){
  const items=[]; S.properties.forEach(p=>{ _fullCertItems(p).forEach(it=>items.push({k:it[0],lab:it[1],date:it[2],rag:_itemRag(it)})); });
  const tot=items.length, ok=items.filter(x=>x.rag.k==='ok').length, soon=items.filter(x=>x.rag.k==='soon').length, bad=items.filter(x=>x.rag.k==='expired'||x.rag.k==='missing').length;
  const byLandlord=S.landlords.map(l=>{
    const props=S.properties.filter(p=>p.landlordId===l.id);
    const certs=[]; props.forEach(p=>{ _fullCertItems(p).forEach(it=>certs.push(_itemRag(it).k)); });
    const issues=certs.filter(k=>k!=='ok').length;
    return {l,props,issues,total:certs.length};
  }).filter(x=>x.props.length);
  const rows=byLandlord.map(({l,props,issues,total})=>{
    const propHtml=props.map(p=>{
      const items3=_fullCertItems(p).map(it=>[it[0],it[1]+(it[0]==='epc'&&p.certs&&p.certs.epcRating?' · '+p.certs.epcRating:''),it[2],it[3],it[4]]);
      const pIssues=items3.filter(it=>_itemRag(it).k!=='ok').length;
      const rec3=tenantRecFor(p.id); const dc=p.certs||{};
      const docUrlOf=k=>({gas:dc.gasDocUrl,eicr:dc.eicrDocUrl,epc:dc.epcDocUrl,legionella:dc.legionellaDocUrl,hmo:dc.hmoDocUrl,smoke:dc.smokeDocUrl,co:dc.coDocUrl,deposit:rec3&&rec3.depositCertUrl,rtr:rec3&&rec3.rtrDocUrl}[k]);
      const certHtml=items3.map(it=>{ const [k,lab,d,kind]=it; const r=_itemRag(it); const action=k==='rtr'?`rtrFromChecklist('${p.id}')`:k==='deposit'?`setTenant('${p.id}')`:`editCert('${p.id}','${k}')`; const docUrl=docUrlOf(k); return `<div class="tree-leaf">
          <span class="tree-dot" style="background:${r.color}"></span>
          <span style="flex:1;font-size:12.5px">${lab}</span>
          <span class="faint" style="font-size:11.5px;margin-right:8px">${kind==='custom'?r.label:d?(kind==='decl'?'Confirmed '+fmtDate(d):fmtDate(d)):(kind==='decl'?'Not confirmed':'No certificate')}</span>
          <span class="pill" style="background:${r.bg};color:${r.color}">${r.label}</span>
          ${docUrl?`<button class="btn sm" onclick="viewDoc('${docUrl}','${esc(lab)}')">View</button>`:''}
          <button class="btn sm" onclick="${action}">${r.k==='ok'?'Update':k==='deposit'?'Manage':'Add'}</button>
        </div>`; }).join('');
      return `<details class="tree-node" ${pIssues?'open':''}>
        <summary><span class="tree-caret">▸</span><span class="tree-ic">⌂</span><span style="flex:1;font-weight:600;font-size:13px;color:var(--navy)">${esc(p.address)}${p.city?', '+esc(p.city):''}</span>${pIssues?`<span class="pill" style="background:var(--red-bg);color:var(--red)">${pIssues} to fix</span>`:`<span class="pill" style="background:var(--green-bg);color:var(--green)">All valid</span>`}</summary>
        <div class="tree-children">${certHtml}</div></details>`;
    }).join('');
    return `<details class="tree-node lvl0" ${issues?'open':''}>
      <summary><span class="tree-caret">▸</span><span class="tree-ic" style="background:var(--navy);color:#fff">⚇</span><span style="flex:1;font-weight:700;font-size:13.5px;color:var(--navy)">${esc(l.name)}</span><span class="faint" style="font-size:12px;margin-right:6px">${props.length} propert${props.length===1?'y':'ies'}</span>${issues?`<span class="pill" style="background:var(--red-bg);color:var(--red)">${issues} of ${total} need attention</span>`:`<span class="pill" style="background:var(--green-bg);color:var(--green)">Fully compliant</span>`}</summary>
      <div class="tree-children">${propHtml}</div></details>`;
  }).join('');
  return `<h1 class="pg">Compliance</h1><div class="sub">Every certificate across your portfolio, grouped by landlord and property. Expands automatically where something needs attention.</div>
    <div class="grid4" style="margin-bottom:18px">
      <div class="kpi"><div class="l">Certificates tracked</div><div class="v">${tot}</div></div>
      <div class="kpi"><div class="l">Valid</div><div class="v" style="color:var(--green)">${ok}</div></div>
      <div class="kpi"><div class="l">Expiring soon</div><div class="v" style="color:var(--amber)">${soon}</div></div>
      <div class="kpi"><div class="l">Expired / missing</div><div class="v" style="color:var(--red)">${bad}</div></div>
    </div>
    <div class="panel" style="padding:6px 10px">${rows||'<div class="empty">No properties yet.</div>'}</div>`;
}
async function agentLogout(){
  try{ if(sb) await sb.auth.signOut(); }catch(e){ console.error(e); }
  try{ localStorage.removeItem('nxl_role'); }catch(e){}

function esc(v){ return v==null?'':String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function val(id){ const e=document.getElementById(id); return e?e.value.trim():''; }
function modal(title,body,ft,lock){ document.getElementById('modal-root').innerHTML=`<div class="ov" onclick="${lock?'':'if(event.target===this)closeModal()'}"><div class="modal"><div class="modal-hd"><h3>${title}</h3><button class="x" onclick="closeModal()">×</button></div><div class="modal-bd">${body}</div><div class="modal-ft">${ft}</div></div></div>`; }
function closeModal(){ document.getElementById('modal-root').innerHTML=''; OB=null; RF=null; }
let _tt; function toast(m,bad){ const t=document.getElementById('toast'); t.textContent=m; t.style.background=bad?'var(--red)':'var(--navy)'; t.classList.add('show'); clearTimeout(_tt); _tt=setTimeout(()=>t.classList.remove('show'),2600); }

boot();
