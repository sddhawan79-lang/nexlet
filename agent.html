<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NexLet — Agency Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0B1E3D; --navy2:#16305a; --orange:#E8923A; --green:#1B7A4B; --green-bg:#EAF6EF;
  --amber:#B86E20; --amber-bg:#FEF2E7; --red:#C0392B; --red-bg:#FBEAE8; --blue:#2A6FDB; --blue-bg:#E9F2FF;
  --purple:#7C3AED; --purple-bg:#F3EAFB; --txt:#1A2332; --muted:#64748B; --faint:#94A3B8;
  --border:#E2E5EA; --off:#F4F6F9; --bg:#EAEEF5;
  --font:'DM Sans',system-ui,sans-serif; --disp:'DM Serif Display',Georgia,serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--txt)}
.app{display:flex;min-height:100vh}
.sb{width:232px;flex-shrink:0;background:var(--navy);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.sb-logo{padding:20px 18px 14px;border-bottom:1px solid rgba(255,255,255,.08)}
.sb-logo .nm{font-family:var(--disp);font-size:19px;color:#fff}
.sb-logo .nm b{color:var(--orange);font-weight:400}
.sb-badge{display:inline-flex;align-items:center;gap:5px;margin-top:6px;background:rgba(232,146,58,.15);border:1px solid rgba(232,146,58,.35);color:var(--orange);font-size:10px;font-weight:700;letter-spacing:.5px;padding:2px 8px;border-radius:5px}
.sb-nav{padding:10px 0;flex:1;overflow-y:auto}
.nav{display:flex;align-items:center;gap:11px;padding:10px 16px;font-size:13px;color:rgba(255,255,255,.6);cursor:pointer;border-left:3px solid transparent;transition:all .12s;user-select:none}
.nav:hover{color:#fff;background:rgba(255,255,255,.04)}
.nav.on{color:#fff;background:rgba(255,255,255,.06);border-left-color:var(--orange)}
.nav .ic{width:17px;text-align:center;flex-shrink:0}
.sb-foot{padding:12px 16px;border-top:1px solid rgba(255,255,255,.08);font-size:12px;color:rgba(255,255,255,.55)}
.sb-user{display:flex;align-items:center;gap:9px}
.sb-av{width:30px;height:30px;border-radius:50%;background:var(--orange);color:var(--navy);font-weight:700;display:flex;align-items:center;justify-content:center;font-size:12px}
.nav-grp{padding:14px 18px 6px;font-size:10px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:rgba(255,255,255,.35);cursor:pointer;user-select:none}
.nav-grp:hover{color:rgba(255,255,255,.6)}
.nav-grp:first-child{padding-top:8px}
.main{flex:1;min-width:0}
.topbar{background:#fff;border-bottom:1px solid var(--border);padding:0 30px;height:60px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20}
.tb-title{font-size:11px;font-weight:700;letter-spacing:.7px;color:var(--faint);text-transform:uppercase}
.content{padding:26px 30px 90px;max-width:1120px}
h1.pg{font-family:var(--disp);font-size:24px;color:var(--navy);margin-bottom:3px;font-weight:400}
.sub{font-size:13px;color:var(--muted);margin-bottom:20px}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--border);background:#fff;color:#475569;border-radius:9px;padding:9px 15px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:all .12s}
.btn:hover{border-color:#c5d0dd}
.btn.navy{background:var(--navy);color:#fff;border-color:transparent}
.btn.navy:hover{background:var(--navy2)}
.btn.sm{padding:6px 11px;font-size:12px}
.btn.ghost{background:none;border:none;color:var(--muted)}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.kpi{background:#fff;border:1px solid var(--border);border-radius:12px;padding:16px 18px}
.kpi .l{font-size:10px;font-weight:700;letter-spacing:.5px;color:var(--faint);text-transform:uppercase}
.kpi .v{font-size:25px;font-weight:700;color:var(--navy);margin-top:5px;font-family:var(--disp)}
.kpi .v small{font-size:13px;font-weight:400}
.kpi .s{font-size:11px;color:var(--faint);margin-top:2px}
.panel{background:#fff;border:1px solid var(--border);border-radius:12px;overflow:hidden}
.panel+.panel{margin-top:14px}
.panel-hd{padding:15px 20px;border-bottom:1px solid #EEF1F5;display:flex;align-items:center;justify-content:space-between}
.panel-hd h2{font-size:14px;font-weight:700;color:var(--navy)}
.panel-bd{padding:18px 20px}
.row{display:flex;align-items:center;gap:14px;padding:15px 20px;border-bottom:1px solid #F1F3F6}
.row:last-child{border-bottom:none}
.av{width:40px;height:40px;border-radius:50%;background:var(--bg);color:var(--navy);font-weight:700;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.pill{font-size:10.5px;font-weight:700;padding:3px 10px;border-radius:100px;white-space:nowrap;display:inline-block}
.muted{color:var(--muted)} .faint{color:var(--faint)}
.fg{margin-bottom:14px}
.fg label{display:block;font-size:13.5px;font-weight:700;color:var(--navy);margin-bottom:6px}
.fg label .faint{display:block;font-weight:400;font-size:11.5px;color:var(--faint);margin-top:3px;text-transform:none;letter-spacing:0}
.fg input,.fg select,.fg textarea{width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:8px;font-family:inherit;font-size:13px;background:#fff;color:var(--txt)}
.fg input:focus,.fg select:focus,.fg textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(42,111,219,.12)}
.fg .hint{font-size:11px;color:var(--faint);margin-top:4px}
.inline2{display:flex;gap:10px}.inline2>*{flex:1}
.steps{display:flex;gap:6px;margin-bottom:20px;flex-wrap:wrap}
.st{display:flex;align-items:center;gap:7px;font-size:11.5px;font-weight:600;color:var(--faint);padding:5px 11px;border-radius:100px;background:#fff;border:1px solid var(--border)}
.st.on{color:#fff;background:var(--navy);border-color:transparent}
.st.done{color:var(--green);background:var(--green-bg);border-color:transparent}
.st .n{width:17px;height:17px;border-radius:50%;background:currentColor;color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center}
.st.on .n{background:#fff;color:var(--navy)} .st.done .n{background:var(--green);color:#fff}
.pipe{display:flex;gap:12px;overflow-x:auto;padding-bottom:10px}
.col{flex:0 0 230px;background:#EEF1F6;border-radius:12px;padding:11px}
.col-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;padding:0 4px}
.col-hd .t{font-size:12px;font-weight:700;color:var(--navy)}
.col-hd .c{font-size:11px;font-weight:700;color:#fff;min-width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 5px}
.tcard{background:#fff;border:1px solid var(--border);border-radius:9px;padding:11px 12px;margin-bottom:9px}
.tcard .w{font-size:13px;font-weight:700;color:var(--navy)}
.tcard .p{font-size:11px;color:var(--faint);margin:2px 0 8px}
.ov{position:fixed;inset:0;background:rgba(11,30,61,.45);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:100;overflow-y:auto}
.modal{background:#fff;border-radius:14px;width:100%;max-width:540px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal-hd{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.modal-hd h3{font-size:16px;color:var(--navy)}
.modal-bd{padding:20px 22px}
.modal-ft{padding:14px 22px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:9px}
.x{background:none;border:none;font-size:20px;color:var(--faint);cursor:pointer;line-height:1}
.chk{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--border);border-radius:9px;margin-bottom:8px;cursor:pointer}
.chk.on{border-color:var(--green);background:var(--green-bg)}
.chk .box{width:20px;height:20px;border-radius:5px;border:1.5px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff}
.chk.on .box{background:var(--green);border-color:var(--green)}
.tree-node{border:1px solid var(--border);border-radius:10px;margin:8px 0;overflow:hidden}
.tree-node.lvl0{border-color:#DCE3EC}
.tree-node summary{list-style:none;display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;background:#fff}
.tree-node summary::-webkit-details-marker{display:none}
.tree-node[open]>summary{border-bottom:1px solid var(--border)}
.tree-node .tree-caret{display:inline-block;transition:transform .15s;color:var(--faint);font-size:11px}
.tree-node[open]>summary .tree-caret{transform:rotate(90deg)}
.tree-node .tree-ic{width:26px;height:26px;border-radius:7px;background:var(--off);display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.tree-children{padding:6px 14px 10px 40px;background:#FBFCFE}
.tree-node .tree-node{margin:8px 0}
.tree-leaf{display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px solid #F1F3F6}
.tree-leaf:last-child{border-bottom:none}
.tree-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.chk.on .box{background:var(--green);border-color:var(--green)}
.doc{display:flex;align-items:center;gap:11px;padding:11px 13px;border:1px solid var(--border);border-radius:9px;margin-bottom:8px;flex-wrap:wrap;row-gap:8px}
.doc .di{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.empty{padding:34px;text-align:center;color:var(--muted);font-size:13px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:11px 20px;border-radius:10px;font-size:13px;z-index:200;box-shadow:0 8px 30px rgba(0,0,0,.3);opacity:0;transition:opacity .2s,transform .2s}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}
.note{background:var(--blue-bg);border:1px solid rgba(42,111,219,.2);border-radius:10px;padding:13px 15px;font-size:12.5px;color:var(--txt);line-height:1.55}
.note.warn{background:var(--amber-bg);border-color:rgba(184,110,32,.25)}
@media print{.sb,.topbar,.no-print,.back{display:none!important}.main{width:100%}.content{padding:0;max-width:none}#invoice-doc{box-shadow:none!important;border:none!important;max-width:none!important}body{background:#fff}}
.tl{position:relative;padding-left:22px}
.tl::before{content:'';position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--border)}
.tl-item{position:relative;padding:0 0 16px}
.tl-item::before{content:'';position:absolute;left:-19px;top:3px;width:10px;height:10px;border-radius:50%;background:var(--blue);border:2px solid #fff}
.back{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);cursor:pointer;margin-bottom:14px}
.kv{display:flex;gap:8px;font-size:13px;padding:6px 0;border-bottom:1px solid #F4F6F9}
.kv .k{color:var(--faint);width:150px;flex-shrink:0}
.kv .v{color:var(--txt);font-weight:500}
.feebox{display:flex;align-items:center;gap:8px;background:var(--off);border:1px solid var(--border);border-radius:9px;padding:6px 10px}
.feebox input{width:64px;border:1px solid var(--border);border-radius:6px;padding:6px 8px;font-family:inherit;font-size:14px;font-weight:700;text-align:center;color:var(--navy)}
</style>
</head>
<body>
<div class="app">
  <aside class="sb">
    <div class="sb-logo"><div class="nm" style="font-size:20px;line-height:1.15">Beacon <b style="color:var(--green);font-weight:400">Residentials</b></div><div style="font-size:10.5px;color:rgba(255,255,255,.45);margin-top:3px">Powered by Nex<span style="color:var(--orange)">Let</span></div><div class="sb-badge">AGENCY MODE</div></div>
    <nav class="sb-nav" id="nav"></nav>
    <div class="sb-foot">
      <div id="scheme-foot" style="margin:0 0 12px;padding:10px 12px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:10px"></div>
      <div class="sb-user"><div class="sb-av">SD</div><div>Saurabh — Agent</div></div>
      <a href="landlord.html?portal=landlord" style="display:block;margin-top:10px;font-size:11px;color:rgba(255,255,255,.5);text-decoration:none">↩ Switch to landlord portal</a>
      <a href="#" onclick="agentLogout();return false" style="display:block;margin-top:8px;font-size:11px;color:rgba(255,255,255,.5);text-decoration:none">⎋ Log out</a>
    </div>
  </aside>
  <main class="main">
    <div class="topbar"><span class="tb-title" id="tb-title">Dashboard</span><div style="display:flex;align-items:center;gap:10px"><button class="btn sm" id="notif-bell" onclick="openNotifications()" style="position:relative">🔔<span id="notif-badge" style="display:none;position:absolute;top:-5px;right:-5px;background:var(--red);color:#fff;font-size:9px;font-weight:700;border-radius:8px;padding:1px 5px;min-width:14px;text-align:center;line-height:1.4"></span></button><div id="tb-actions"></div></div></div>
    <div class="content" id="view"></div>
  </main>
  <button class="btn navy" onclick="openAiFinder()" title="Ask AI — where do I find…?" style="position:fixed;right:22px;bottom:22px;z-index:500;border-radius:100px;padding:12px 18px;box-shadow:0 8px 24px rgba(11,30,61,.28);display:flex;align-items:center;gap:7px">✦ Ask AI</button>
</div>
<div id="modal-root"></div>
<div class="toast" id="toast"></div>

<!-- Supabase (same project as landlord.html / tenant.html) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/signature_pad@4.1.7/dist/signature_pad.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.9/dist/purify.min.js"></script>
<script>
// ─────────────────────────────────────────────────────────────
// NexLet Agency Portal — functional front-end (local state demo).
// Same architecture/design as landlord.html. A developer wires this
// to the shared Supabase backend (see DEV-SPEC-agency-portal.md):
// agencies → landlords → properties hierarchy + RLS.
// ─────────────────────────────────────────────────────────────
const LS='nexlet_agency_v3';
const DEF_FEE=7.5;        // sole-agency full-management % default (editable per landlord)
const DEF_WEEKS=3;        // sole-agency let-only default = weeks of rent (editable per landlord)
const MULTI_FEE=12;       // multiple-agency full-management % default — higher: agent competes, isn't guaranteed the instruction
const MULTI_WEEKS=4.345;  // multiple-agency let-only default ≈ 1 month's rent
const REF_PARTNERS=['Vouch','FCC Paragon','HomeLet','Van Mildert','Goodlord (Acquire)'];

// ─────────────────────────────────────────────────────────────
// SUPABASE DATA LAYER  (Session 36 — wires this portal to the shared backend)
// Same project as landlord.html / tenant.html. Security model: DEV-SPEC-agency-portal.md.
//  • LIVE mode  → real Supabase, scoped to window._agencyId, protected by RLS.
//  • DEMO mode  → local-state only (open with ?demo=1). Touches no real data.
// ─────────────────────────────────────────────────────────────
const SUPABASE_URL = 'https://mahtcfukgzbonwibtsxz.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1haHRjZnVrZ3pib253aWJ0c3h6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU2MjQ2MDAsImV4cCI6MjA5MTIwMDYwMH0.-wC55rGp1WFKfjKR3EhuXqAPDiWJ4w_e2LBXjHr_y5Y';
let sb=null; try{ const { createClient }=window.supabase; sb=createClient(SUPABASE_URL,SUPABASE_ANON_KEY); }catch(e){ console.warn('Supabase client unavailable — demo only',e); }
let LIVE=false;                 // set true only after the auth gateway passes
window._agencyId=null;          // every LIVE query is scoped to this agency

// ── row ⇄ in-memory-object mappers (snake_case DB ⇄ camelCase S) ──
const rowToAgency=r=>({name:r.name||'',address:r.address||'',redress:r.redress_scheme||'',redressNo:r.redress_no||'',cmp:r.cmp_scheme||'Not holding client money',cmpNo:r.cmp_no||'',refPartner:r.ref_partner||'',icoNo:r.ico_no||'',vatRegistered:!!r.vat_registered,vatNumber:r.vat_number||'',invoiceSeq:r.invoice_seq||0,paymentTerms:r.payment_terms||14,abortiveFee:r.abortive_fee??250,noticeFee:r.notice_fee??75,renewalFee:r.renewal_fee??60,arrearsFee:r.arrears_fee??30,keyFee:r.key_fee??60,insuranceFee:r.insurance_fee??50,disputeFee:r.dispute_fee??75,invMoveinFee:r.inv_movein_fee??75,invMoveoutFee:r.inv_moveout_fee??65});
const agencyToRow=a=>({name:a.name,address:a.address,redress_scheme:a.redress,redress_no:a.redressNo,cmp_scheme:a.cmp,cmp_no:a.cmpNo,ref_partner:a.refPartner,ico_no:a.icoNo,vat_registered:!!a.vatRegistered,vat_number:a.vatNumber,invoice_seq:a.invoiceSeq||0,payment_terms:a.paymentTerms||14,abortive_fee:a.abortiveFee||0,notice_fee:a.noticeFee||0,renewal_fee:a.renewalFee||0,arrears_fee:a.arrearsFee||0,key_fee:a.keyFee||0,insurance_fee:a.insuranceFee||0,dispute_fee:a.disputeFee||0,inv_movein_fee:a.invMoveinFee||0,inv_moveout_fee:a.invMoveoutFee||0,updated_at:new Date().toISOString()});
const rowToLandlord=r=>({id:r.id,name:r.name||'',joint:r.joint||'',jointEmail:r.joint_email||'',entity:r.entity||'individual',boardOptOut:!!(r.docs&&r.docs.boardOptOut),email:r.email||'',phone:r.phone||'',address:r.address||'',nrl:!!r.nrl,prsReg:r.prs_reg||'',payout:r.payout||'',contactPref:r.contact_pref||'Email',aml:!!r.aml_verified,ownership:!!r.ownership_verified,service:r.service||'full',feePct:r.fee_pct,letWeeks:r.let_weeks,agreement:!!r.agreement_signed,status:r.status||'pending',docs:r.docs||{},comms:r.comms||[],inviteToken:r.invite_token||'',invitedAt:r.invited_at||''});
const landlordToRow=l=>({id:l.id,agency_id:window._agencyId,name:l.name,joint:l.joint||null,joint_email:l.jointEmail||null,entity:l.entity||'individual',email:l.email,phone:l.phone,address:l.address,nrl:!!l.nrl,prs_reg:l.prsReg,payout:l.payout,contact_pref:l.contactPref,aml_verified:!!l.aml,ownership_verified:!!l.ownership,service:l.service,fee_pct:l.feePct,let_weeks:l.letWeeks,agreement_signed:!!l.agreement,status:l.status,docs:l.docs||{},comms:l.comms||[],invite_token:l.inviteToken||null,invited_at:l.invitedAt||null,updated_at:new Date().toISOString()});
// Bill-to / statement name — a company landlord shows the company name; joint owners
// show "A & B". `joint` holds the second owner (or is blank). `entity` = individual|joint|company.
function landlordName(l){ if(!l) return ''; if(l.entity==='company') return l.name; return (l.joint&&l.joint.trim())?(l.name+' & '+l.joint):l.name; }
function landlordLegalLine(l){ if(!l) return ''; if(l.entity==='company') return esc(l.name)+' <span style="font-weight:400">(company landlord)</span>'; return esc(landlordName(l)); }
const rowToProp=r=>({id:String(r.id),landlordId:r.landlord_id,address:r.address||'',city:r.city||'',postcode:r.postcode||'',ptype:r.ptype||'',rent:r.rent||0,beds:r.beds||1,baths:r.baths||1,furnished:r.furnished||'',epc:r.epc||'',councilTaxBand:r.council_tax_band||'',rentDueDay:r.rent_due_day||'1st',available:r.available||null,description:r.description||'',features:r.features||[],feePct:r.fee_pct,certs:r.certs||{},tenant:r.tenant||undefined});
const propToRow=p=>({id:p.id,agency_id:window._agencyId,landlord_id:p.landlordId,address:p.address,city:p.city,postcode:p.postcode||null,ptype:p.ptype||null,rent:p.rent||0,beds:p.beds||1,baths:p.baths||1,furnished:p.furnished||null,epc:p.epc||null,council_tax_band:p.councilTaxBand||null,rent_due_day:p.rentDueDay||'1st',available:p.available||null,description:p.description||null,features:p.features||[],fee_pct:p.feePct,certs:p.certs||{},tenant:p.tenant||null});
// properties.id is a DB-assigned bigint (NOT a client-generated text id like our other
// tables) — a new property must be INSERTed without an id and get the real id back,
// or the save fails outright (non-numeric text can't go into a bigint column).
async function pushPropertyNew(p){
  if(!LIVE) return uid('p');   // demo mode: no real DB, keep a client-side id
  try{
    const row=propToRow(p); delete row.id;

    sb.from('agency_maintenance').select('*').eq('agency_id',window._agencyId).order('created_at',{ascending:false}),

  ]);
  S.landlords =(ll.data||[]).map(rowToLandlord);
  S.properties=(pr.data||[]).map(rowToProp);
  S.references=(rf.data||[]).map(rowToRef);
  S.tenancies =(tn.data||[]).map(rowToTen);

  S.letters   =lt.data||[];

  S.tenants   =(tns.data||[]).map(rowToTenant);

  S.jobs      =(mt.data||[]).map(rowToJob);
  S.inventories2=(iv2.data||[]).map(rowToInv2);
  S.messages  =(msg.data||[]).map(rowToMsg);
  // Lettings front-half (graceful — tables may not exist until sql-agency-lettings.sql is run)
  try{
    const [lst,app,vw,of]=await Promise.all([
      sb.from('agency_listings').select('*').eq('agency_id',window._agencyId),

    ]);

// ── auth gateway (§2a-B) + boot ──
async function boot(){
  const demo=new URLSearchParams(location.search).has('demo');
  if(demo || !sb){ LIVE=false; restoreView(); render(); return; }              // explicit demo, or lib missing
  document.getElementById('view').innerHTML='<div class="empty">Loading your agency…</div>';
  const { data:{ session } }=await sb.auth.getSession();
  if(!session){ location.href='login.html'; return; }            // no session → login
  const { data:agency }=await sb.from('agencies').select('*').eq('owner_user_id',session.user.id).maybeSingle();
  if(!agency){ try{localStorage.removeItem('nxl_role');}catch(e){} location.href='landlord.html?managed=0'; return; }  // not an agent → landlord app (clear stale hint)
  LIVE=true; window._agencyId=agency.id;
  try{localStorage.setItem('nxl_role','agent');}catch(e){}       // fast-path hint so future logins skip the query
  window._sessionToken=session.access_token; window._agentEmail=session.user.email; window._agentName=agency.name||'';
  try{ await loadData(agency); }catch(e){ console.error(e); toast('⚠ Could not load agency data',1); }
  reconcileAgreements();
  setInterval(pollAgreements, 20000);   // pick up landlord counter-signatures live
  setInterval(pollMessages, 15000);     // pick up new landlord/tenant messages live
  restoreView();
  render();
}

function daysUntil(d){ if(!d) return null; const due=new Date(d); due.setHours(0,0,0,0); const now=new Date(); now.setHours(0,0,0,0); return Math.round((due-now)/864e5); }
function certRAG(d){ if(!d) return {k:'missing',label:'Missing',bg:'var(--red-bg)',color:'var(--red)'}; const n=daysUntil(d); if(n<0) return {k:'expired',label:'Expired',bg:'var(--red-bg)',color:'var(--red)'}; if(n<30) return {k:'soon',label:n+'d left',bg:'var(--amber-bg)',color:'var(--amber)'}; return {k:'ok',label:'Valid',bg:'var(--green-bg)',color:'var(--green)'}; }
function fmtDate(d){ if(!d) return '—'; return new Date(d).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}); }
const CERT_LABELS={gas:'Gas Safety (CP12)',eicr:'EICR (Electrical)',epc:'EPC',hmo:'HMO / Selective Licence',legionella:'Legionella Risk Assessment',smoke:'Smoke Alarms',co:'CO Alarm',rtr:'Right to Rent Check',htr:'How to Rent Guide',infosheet:'Renters’ Rights Act Information Sheet'};
function declStatus(d){ return d?{k:'ok',label:'Confirmed',bg:'var(--green-bg)',color:'var(--green)'}:{k:'missing',label:'Missing',bg:'var(--amber-bg)',color:'var(--amber)'}; }
function _rtrRAG(rec){
  if(!rec||!rec.rtrCheckDate) return {k:'missing',label:'Missing',bg:'var(--red-bg)',color:'var(--red)'};
  if(rec.rtrResult==='Invalid') return {k:'expired',label:'Invalid',bg:'var(--red-bg)',color:'var(--red)'};
  if(rec.rtrResult==='Time-limited'&&rec.rtrExpiry) return certRAG(rec.rtrExpiry);
  return {k:'ok',label:'Confirmed',bg:'var(--green-bg)',color:'var(--green)'};
}
function _depositRAG(rec){
  if(rec.depositCertName){
    if(rec.depositCertExpiry){ const n=daysUntil(rec.depositCertExpiry);
      if(n<0) return {k:'expired',label:'Expired',bg:'var(--red-bg)',color:'var(--red)'};
      if(n<=30) return {k:'soon',label:'Renew soon',bg:'var(--amber-bg)',color:'var(--amber)'};
    }
    return {k:'ok',label:'Protected',bg:'var(--green-bg)',color:'var(--green)'};
  }
  const days=rec.start?Math.round((new Date()-new Date(rec.start))/864e5):0;
  if(days>30) return {k:'expired',label:'Overdue',bg:'var(--red-bg)',color:'var(--red)'};
  return {k:'soon',label:'Due within 30 days',bg:'var(--amber-bg)',color:'var(--amber)'};
}
function _itemRag(item){ const kind=item[3], d=item[2], pre=item[4]; return pre||(kind==='decl'?declStatus(d):certRAG(d)); }
function _fullCertItems(p){ const c=p.certs||{}; const rec=tenantRecFor(p.id);
  const items=[['gas','Gas Safety',c.gas,'exp'],['eicr','EICR (Electrical)',c.eicr,'exp'],['epc','EPC',c.epc,'exp'],['smoke','Smoke alarms',c.smoke,'decl'],['legionella','Legionella risk assessment',c.legionella,'exp']];
  if(!c.coNA) items.push(['co','CO alarm',c.co,'decl']);
  if(p.tenant){
    items.push(['rtr','Right to Rent check',null,'custom',_rtrRAG(rec)]);
    items.push(['htr','How to Rent guide',c.htr,'decl']);
    if(rec&&rec.start&&new Date(rec.start)<new Date('2026-05-01')) items.push(['infosheet','RRA Information Sheet (existing tenancy)',c.infosheet,'decl']);
    if(rec&&rec.deposit) items.push(['deposit','Deposit protection',null,'custom',_depositRAG(rec)]);
  }
  if(c.hmoApplicable) items.push(['hmo','HMO licence',c.hmo,'exp']);
  return items;
}

  const items=_fullCertItems(p);
  const done=items.filter(it=>{ const r=_itemRag(it); return r.k==='ok'||r.k==='soon'; }).length;
  return {items,pct:Math.round(done/items.length*100)}; }

function viewingDone(vid){

function saveViewingFeedback(vid){
  const v=(S.viewings||[]).find(x=>x.id===vid); if(!v)return;
  const out=val('vf-out'); v.status=out==='noshow'?'noshow':'done'; v.outcome=out; v.feedback=val('vf-note');

}

function recordOffer(appId){
  const a=(S.applicants||[]).find(x=>x.id===appId)||{}; const l=LST(a.listingId);
  const body=`<div class="note" style="margin-bottom:12px"><b>${esc(a.name)}</b>${l.address?' · '+esc(l.address)+' (asking '+gbp(l.rent)+')':''}</div>

function saveOffer(appId){
  const a=(S.applicants||[]).find(x=>x.id===appId); if(!a)return;
  const o={id:uid('of'),applicantId:appId,listingId:a.listingId||'',amount:parseFloat(val('of-amt'))||0,moveIn:val('of-move')||null,note:val('of-note'),status:'offered',createdAt:new Date().toISOString()};
  S.offers=S.offers||[]; S.offers.push(o); a.status='offer';
  save(); pushOffer&&pushOffer(o); pushApplicant&&pushApplicant(a); closeModal(); render(); toast('✓ Offer recorded');

function offerAction(oid,status){
  const o=(S.offers||[]).find(x=>x.id===oid); if(!o)return; o.status=status;
  const a=(S.applicants||[]).find(x=>x.id===o.applicantId);
  if(status==='accepted'&&a){ a.status='referencing'; pushApplicant&&pushApplicant(a);
    // hand off to Referencing: pre-seed a reference for this applicant + property
    const l=LST(o.listingId);
    S.references=S.references||[]; S.references.push({id:uid('r'),applicant:a.name,propertyId:l.propertyId||'',income:0,docs:{},creditState:'not_requested',status:'none',note:'From accepted offer — '+gbp(o.amount)+'/mo'});
    if(l.id){ l.status='let'; pushListing&&pushListing(l);
      if(l.propertyId) _commitTenant(l.propertyId,{name:a.name,email:a.email,start:o.moveIn||today()});
    }
    toast('✓ Accepted — applicant sent to Referencing'+(l.propertyId?' · tenancy created':''));
  } else { toast('Offer '+status); }
  save(); pushOffer&&pushOffer(o); render();
}

// ── REPORTING dashboard — arrears / fee income / compliance calendar (read-only) ──
function vReports(){
  // Arrears across portfolio
  const arrRows=(S.tenants||[]).map(t=>({t,owed:tenantArrears(t.id)})).filter(x=>x.owed>0).sort((a,b)=>b.owed-a.owed);
  const totalArrears=arrRows.reduce((s,x)=>s+x.owed,0);
  // Fee income (monthly management + this-year invoiced)
  const monthlyFee=S.landlords.filter(l=>l.service==='full').reduce((s,l)=>s+landlordMonthlyFee(l),0);
  const invoiced=(S.invoices||[]).filter(i=>i.status==='paid').reduce((s,i)=>s+(invTotal?invTotal(i).gross:0),0);
  // Compliance calendar — certs expiring in next 90 days, soonest first
  const cal=[];
  S.properties.forEach(p=>{ _fullCertItems(p).forEach(([k,lab,d,kind])=>{ if(kind==='exp'&&d){ const n=daysUntil(d); if(n<=90) cal.push({p,lab,d,n}); } });
    const rec=tenantRecFor(p.id); if(rec&&rec.rtrResult==='Time-limited'&&rec.rtrExpiry){ const n=daysUntil(rec.rtrExpiry); if(n<=90) cal.push({p,lab:'Right to Rent (time-limited)',d:rec.rtrExpiry,n}); } });
  const incomplete=S.properties.filter(p=>p.tenant).map(p=>({p,cl:_tenancyChecklist(p)})).filter(x=>x.cl.pct<100).sort((a,b)=>a.cl.pct-b.cl.pct);
  cal.sort((a,b)=>a.n-b.n);
  return `<h1 class="pg">Reports</h1><div class="sub">Portfolio health at a glance — arrears, fee income and the compliance calendar across every managed property.</div>
    <div class="grid4" style="margin-bottom:18px">
      ${kpiCard(gbp(totalArrears),'Total arrears',totalArrears>0?'var(--red)':'var(--green)')}
      ${kpiCard(arrRows.length,'Tenants in arrears','var(--amber)')}
      ${kpiCard(gbp(monthlyFee),'Monthly fee income','var(--green)')}
      ${kpiCard(cal.filter(x=>x.n<0).length,'Certs expired','var(--red)')}
    </div>
    <div class="grid2" style="gap:14px;align-items:start">
      <div class="panel"><div class="panel-hd"><h2>Arrears summary</h2><span class="faint" style="font-size:12px">${gbp(totalArrears)}</span></div>
        ${arrRows.length?arrRows.map(({t,owed})=>{ const p=P(t.propertyId); const m=t.rent?owed/t.rent:0; return `<div class="row"><div class="av" style="background:var(--red-bg);color:var(--red)">!</div><div style="flex:1;min-width:0"><div style="font-weight:600;font-size:13px;color:var(--navy)">${esc(t.name)} <span class="faint" style="font-weight:400">· ${esc(p.address||'')}</span></div><div class="faint" style="font-size:11.5px">${m.toFixed(1)} months' rent</div></div><div style="font-weight:700;color:var(--red)">${gbp(owed)}</div></div>`; }).join(''):`<div class="empty" style="padding:24px;text-align:center"><span class="faint" style="font-size:12.5px">✓ No arrears across the portfolio.</span></div>`}
      </div>
      <div class="panel"><div class="panel-hd"><h2>Fee income</h2></div><div class="panel-bd">
        <div class="kv"><span class="k">Monthly management fees (run-rate)</span><span class="v">${gbp(monthlyFee)}</span></div>
        <div class="kv"><span class="k">Annualised</span><span class="v">${gbp(monthlyFee*12)}</span></div>
        <div class="kv" style="border:none"><span class="k">Invoices paid (to date)</span><span class="v">${gbp(invoiced)}</span></div>
      </div></div>
    </div>
    <div class="panel"><div class="panel-hd"><h2>Compliance calendar — next 90 days</h2><span class="faint" style="font-size:12px">${cal.length}</span></div>
      ${cal.length?cal.map(({p,lab,d,n})=>{ const r=certRAG(d); return `<div class="row"><div class="av" style="background:${r.bg};color:${r.color}">${n<0?'✕':n}</div><div style="flex:1;min-width:0"><div style="font-weight:600;font-size:13px;color:var(--navy)">${lab} · ${esc(p.address||'')}</div><div class="faint" style="font-size:11.5px">${n<0?'Expired '+(-n)+' days ago':'Due in '+n+' days'} · ${fmtDate(d)}</div></div><span class="pill" style="background:${r.bg};color:${r.color}">${r.label}</span></div>`; }).join(''):`<div class="empty" style="padding:24px;text-align:center"><span class="faint" style="font-size:12.5px">✓ Nothing expiring in the next 90 days.</span></div>`}
    </div>
    <div class="panel" style="margin-top:18px"><div class="panel-hd"><h2>Tenancies not fully set up</h2><span class="faint" style="font-size:12px">${incomplete.length}</span></div>
      ${incomplete.length?incomplete.map(({p,cl})=>`<div class="row" style="cursor:pointer" onclick="go('property','${p.id}')"><div class="av" style="background:var(--amber-bg);color:var(--amber)">${cl.pct}%</div><div style="flex:1;min-width:0"><div style="font-weight:600;font-size:13px;color:var(--navy)">${esc(p.address||'')}</div><div class="faint" style="font-size:11.5px">Missing: ${cl.items.filter(i=>!i.done).map(i=>i.label).join(', ')}</div></div><span class="pill" style="background:var(--amber-bg);color:var(--amber)">Fix</span></div>`).join(''):`<div class="empty" style="padding:24px;text-align:center"><span class="faint" style="font-size:12.5px">✓ Every tenancy is fully set up.</span></div>`}
    </div>`;
}

// ── CLIENT-MONEY ACCOUNTING (gated) — client account balance + rent-in → fee →
//    landlord-payout ledger. Built now; activates when the agency holds client money
//    (Settings) OR the portfolio exceeds 10 properties (CMP becomes mandatory). ──
function holdsClientMoney(){ return (S.agency.cmp && S.agency.cmp!=='Not holding client money') || S.properties.length>10; }
function _clientLedger(){
  // Derived: each PAID rent = money-in; fee retained; net = owed to landlord. Payouts reduce owed.
  const ledger=[]; let balance=0;
  (S.rentLedger||[]).filter(r=>r.status==='paid').sort((a,b)=>new Date(a.paidDate||a.due)-new Date(b.paidDate||b.due)).forEach(r=>{
    const t=(S.tenants||[]).find(x=>x.id===r.tenantId)||{}; const p=P(t.propertyId)||{}; const l=L(p.landlordId)||{};
    if(l.service!=='full') return;
    const fee=Math.round(r.amount*propFee(p))/100; const net=Math.round((r.amount-fee)*100)/100;
    balance+=r.amount; ledger.push({date:r.paidDate||r.due,type:'rent',desc:'Rent received · '+(t.name||'')+' · '+(p.address||''),in:r.amount,out:0,balance,landlordId:l.id});
    balance-=fee; ledger.push({date:r.paidDate||r.due,type:'fee',desc:'Management fee retained ('+propFee(p)+'%)',in:0,out:fee,balance,landlordId:l.id});
  });
  (S.payouts||[]).forEach(po=>{ balance-=po.amount; ledger.push({date:po.date,type:'payout',desc:'Payout to '+(landlordName(L(po.landlordId))||'landlord'),in:0,out:po.amount,balance,landlordId:po.landlordId}); });
  ledger.sort((a,b)=>new Date(a.date)-new Date(b.date));
  // recompute running balance after sort
  let bal=0; ledger.forEach(x=>{ bal+=(x.in||0)-(x.out||0); x.balance=Math.round(bal*100)/100; });
  return {ledger,balance:Math.round(bal*100)/100};
}
function _landlordOwed(){
  const owed={};
  (S.rentLedger||[]).filter(r=>r.status==='paid').forEach(r=>{ const t=(S.tenants||[]).find(x=>x.id===r.tenantId)||{}; const p=P(t.propertyId)||{}; const l=L(p.landlordId)||{}; if(l.service!=='full')return; const fee=Math.round(r.amount*propFee(p))/100; owed[l.id]=(owed[l.id]||0)+(r.amount-fee); });
  (S.payouts||[]).forEach(po=>{ owed[po.landlordId]=(owed[po.landlordId]||0)-po.amount; });
  return owed;
}

// Tenant-facing document trail for one property — notices served, all archived (never deleted).
function propDocTrailPanel(p){
  const docs=(S.notices||[]).filter(n=>n.propertyId===p.id).map(n=>({label:(n.kind==='section13'?'Section 13 rent increase':'Section 8 notice'),date:n.served||n.createdAt,status:n.status==='served'?'Served — received by tenant':n.status==='withdrawn'?'Archived':'Draft (not yet sent)'})).sort((a,b)=>new Date(b.date||0)-new Date(a.date||0));
  if(!docs.length) return '';
  const pillColor={'Served — received by tenant':['var(--amber-bg)','var(--amber)'],Archived:['var(--off)','#94A3B8'],'Draft (not yet sent)':['var(--off)','#475569']};
  return `<div class="panel"><div class="panel-hd"><h2>Documents sent to this tenant</h2><span class="faint" style="font-size:12px">Sent, received &amp; archived</span></div>
    ${docs.map(d=>{ const c=pillColor[d.status]||['var(--off)','#475569']; return `<div class="row"><div class="av" style="font-size:15px">⚖</div><div style="flex:1"><div style="font-size:13px;font-weight:600;color:var(--navy)">${esc(d.label)}</div><div class="faint" style="font-size:11.5px">${d.date?fmtDate(d.date):'—'}</div></div><span class="pill" style="background:${c[0]};color:${c[1]}">${d.status}</span></div>`; }).join('')}
  </div>`;
}
function _rentDayOpts(sel){ const ord=n=>n+(n%10===1&&n!==11?'st':n%10===2&&n!==12?'nd':n%10===3&&n!==13?'rd':'th');
  let out=''; for(let i=1;i<=28;i++){ const v=ord(i); out+=`<option ${sel===v?'selected':''}>${v}</option>`; }
  out+=`<option ${sel==='Last working day'?'selected':''}>Last working day</option>`; return out; }
function editRentDueDay(pid){ const p=P(pid);
  const body=`<div class="fg"><label>Rent due day</label><select id="rd-day">${_rentDayOpts(p.rentDueDay)}</select></div>`;
  modal('Rent due day — '+esc(p.address), body, `<button class="btn" onclick="closeModal()">Cancel</button><button class="btn navy" onclick="saveRentDueDay('${pid}')">Save</button>`, true); }
function saveRentDueDay(pid){ const p=P(pid); p.rentDueDay=val('rd-day'); save(); pushProperty(p); closeModal(); render(); toast('✓ Rent due day updated'); }
function editPropRent(pid){ const p=P(pid); const isLet=!!p.tenant;
  const body=`<div class="note" style="margin-bottom:14px">${isLet?'This property is let — enter the actual rent agreed with the tenant.':'This is the expected/asking rent while marketing. Once a tenant is set up, come back here to enter the achieved rent.'}</div>
    <div class="fg"><label>${isLet?'Achieved':'Expected'} rent (£/mo)</label><input id="pr-rent" type="number" value="${p.rent||''}"></div>`;
  modal((isLet?'Achieved':'Expected')+' rent — '+esc(p.address), body, `<button class="btn" onclick="closeModal()">Cancel</button><button class="btn navy" onclick="savePropRent('${pid}')">Save</button>`, true); }
function savePropRent(pid){ const p=P(pid); const r=parseInt(val('pr-rent')); if(isNaN(r)||r<0){toast('Enter a valid rent',1);return;} p.rent=r;
  const l=L(p.landlordId); l.comms=l.comms||[]; l.comms.push({id:uid('c'),date:today(),type:'Note',note:(p.tenant?'Achieved':'Expected')+' rent for '+p.address+' set to '+gbp(r)+'/mo'});
  save(); pushProperty(p); pushLandlord(l); closeModal(); render(); toast('✓ Rent updated'); }
function editPropFee(pid){ const p=P(pid);
  const body=`<div class="note" style="margin-bottom:14px">Set the management fee for <b>${esc(p.address)}</b>. This is per-property — charge a different rate here (e.g. a family/friends discount) without affecting the landlord's other properties. Invoices use each property's own rate.</div>
    <div class="fg"><label>Management fee (%)</label><div class="feebox"><input id="pf-fee" type="number" step="0.5" value="${propFee(p)}"> <span>% of ${gbp(p.rent)}/mo = <b id="pf-calc">${gbp(p.rent*propFee(p)/100)}/mo</b></span></div></div>`;
  modal('Property fee — '+esc(p.address), body, `<button class="btn" onclick="closeModal()">Cancel</button><button class="btn navy" onclick="savePropFee('${pid}')">Save fee</button>`, true);
  setTimeout(()=>{const i=document.getElementById('pf-fee');if(i)i.oninput=()=>{const c=document.getElementById('pf-calc');if(c)c.textContent=gbp(p.rent*(parseFloat(i.value)||0)/100)+'/mo';};},0);
}
async function savePropFee(pid){ const p=P(pid); const oldFee=propFee(p); p.feePct=parseFloat(val('pf-fee')); if(isNaN(p.feePct))p.feePct=DEF_FEE;
  const l=L(p.landlordId); l.comms=l.comms||[]; l.comms.push({id:uid('c'),date:today(),type:'Note',note:'Fee for '+p.address+' set to '+p.feePct+'%'});
  if(p.feePct!==oldFee) await _sendFeeChangeLetter(p,l,oldFee,p.feePct);
  save(); pushProperty(p); pushLandlord(l); closeModal(); render(); toast('✓ Fee updated for this property'); }
async function _sendFeeChangeLetter(p,l,oldFee,newFee){
  const b=agencyBrand();
  const subject=`Management fee update — ${p.address}`;
  const sig=b.agent&&b.agent!==b.name?`${esc(b.agent)}<br>${esc(b.name)}`:esc(b.name);
  const body=`<p>Dear ${esc(l.name.split(' ')[0])},</p>
    <p>I hope you're well. I'm writing to let you know about a change to the management fee for <b>${esc(p.address)}</b>, effective <b>${fmtDate(today())}</b>.</p>

async function _storageUpload(file,path,bucket){

  try{

async function _signedUrlFor(url){
  const m=url.match(/\/object\/public\/([^/]+)\/(.+)$/);
  if(!m) return url;
  const [,bucket,path]=m;
  try{
    const headers={'Content-Type':'application/json'};
    if(window._sessionToken) headers['Authorization']='Bearer '+window._sessionToken;
    const res=await fetch(SIGN_EDGE,{method:'POST',headers,body:JSON.stringify({bucket,path:decodeURIComponent(path)})});
    const data=await res.json().catch(()=>({}));
    if(res.ok&&data.signedUrl) return data.signedUrl;
    console.error('sign-doc failed',data); return null;
  }catch(e){ console.error('sign-doc exception',e); return null; }
}

function _legRisk(w){
  const flags=[];

  if(!isNaN(cold)&&cold>=20) flags.push('Cold water reading ('+cold+'°C) is at or above 20°C — within the range Legionella can multiply.');
  if(!isNaN(hot)&&hot<60) flags.push('Hot water reading ('+hot+'°C) is below 60°C — should reach above 60°C at the outlet within a minute.');
  if(w.deadLegs==='yes') flags.push('Little-used outlets or dead legs identified — stagnant water increases risk.');
  if(w.tankCondition==='no') flags.push('Tank/cylinder cover or insulation is damaged or missing.');

  if(w.regularUse==='no') flags.push('Property has periods of low/no occupation — water can stagnate; flush all outlets before re-letting.');

function _commitTenant(pid,info){
  const p=P(pid); if(!p.id||!info.name) return null;
  p.tenant={name:info.name,email:info.email||'',start:info.start||today(),occupants:info.occupants||[]};
  let tn=S.tenancies.find(t=>t.propertyId===pid); if(tn)tn.stage='managed'; else { tn={id:uid('t'),who:p.address,propertyId:pid,stage:'managed'}; S.tenancies.push(tn); }
  let rec=tenantRecFor(pid);
  // A different name means a new tenant replacing the sitting one — close out the old record
  // instead of mutating it, so stale deposit/reference/contract docs from the outgoing tenant
  // never silently carry over and show as "Protected"/"On file" for the new tenancy.
  if(rec && info.name && rec.name && info.name.trim().toLowerCase()!==rec.name.trim().toLowerCase()){
    rec.status='ended'; rec.endDate=today(); pushTenantRec(rec); rec=null;
  }
  const isNew=!rec; if(isNew) rec={id:uid('tn'),status:'active'};
  rec.propertyId=pid; rec.landlordId=p.landlordId; rec.name=info.name; rec.email=info.email||''; rec.phone=info.phone||''; rec.start=info.start||today(); rec.rent=p.rent||0; rec.deposit=info.deposit!=null?info.deposit:rec.deposit; rec.occupants=info.occupants||[];
  if(info.guarantor!==undefined) rec.guarantor=info.guarantor;
  if(info.depositCertExpiry!==undefined) rec.depositCertExpiry=info.depositCertExpiry;
  if(info.depositCertName){ rec.depositCertName=info.depositCertName; rec.depositCertUrl=info.depositCertUrl||rec.depositCertUrl; }
  if(info.refDocName){ rec.refDocName=info.refDocName; rec.refDocUrl=info.refDocUrl||rec.refDocUrl; }
  if(info.origContractName){ rec.origContractName=info.origContractName; rec.origContractUrl=info.origContractUrl||rec.origContractUrl; }
  if(info.id1DocName){ rec.id1DocName=info.id1DocName; rec.id1DocUrl=info.id1DocUrl||rec.id1DocUrl; }
  if(info.id2DocName){ rec.id2DocName=info.id2DocName; rec.id2DocUrl=info.id2DocUrl||rec.id2DocUrl; }
  if(info.addressProofName){ rec.addressProofName=info.addressProofName; rec.addressProofUrl=info.addressProofUrl||rec.addressProofUrl; }
  S.tenants=S.tenants||[]; if(isNew) S.tenants.push(rec);
  save(); pushProperty(p); pushTenancy(tn); pushTenantRec(rec);
  return rec;
}

  anchor=anchor||1;
  if(freq==='monthly'){ const base=new Date(y,(anchor-1)+idx,1); const from=base,to=new Date(base.getFullYear(),base.getMonth()+1,0); return {label:from.toLocaleDateString('en-GB',{month:'long',year:'numeric'}),from:_iso(from),to:_iso(to),months:1}; }
  if(freq==='annual'){ const from=new Date(y,anchor-1,1); const to=new Date(y+1,anchor-1,0); return {label:anchor===1?'Year '+y:from.toLocaleDateString('en-GB',{month:'short',year:'numeric'})+' – '+to.toLocaleDateString('en-GB',{month:'short',year:'numeric'}),from:_iso(from),to:_iso(to),months:12}; }
  const startMonth=(anchor-1)+idx*3; const from=new Date(y,startMonth,1),to=new Date(y,startMonth+3,0);
  const lab='Q'+(idx+1)+' '+from.toLocaleDateString('en-GB',{month:'short'})+'–'+to.toLocaleDateString('en-GB',{month:'short'})+' '+to.getFullYear();
  return {label:lab,from:_iso(from),to:_iso(to),months:3};
}
function _defaultIdx(freq,anchor){ anchor=anchor||1; const m=new Date().getMonth(); const off=((m-(anchor-1))+12)%12; return freq==='monthly'?off:freq==='annual'?0:Math.floor(off/3); }
// Anchor = the calendar month (1-12) a landlord's billing periods should start from.
// Defaults to the EARLIEST active tenancy start date across their properties (e.g. a
// tenancy that started in March bills Mar–May, Jun–Aug… instead of forced Jan–Mar
// calendar quarters) — editable per-invoice if the agent wants a different anchor.
function _landlordAnchorMonth(lid){
  const props=S.properties.filter(p=>p.landlordId===lid);
  const starts=props.map(p=>{ const rec=tenantRecFor(p.id); return (rec&&rec.start)||(p.tenant&&p.tenant.start)||''; }).filter(Boolean).sort();
  return starts.length ? (new Date(starts[0]).getMonth()+1) : 1;
}

function openInvoiceFor(id){

  IV={landlordId:id,docType,freq:'quarterly',y:new Date().getFullYear(),anchor,idx:_defaultIdx('quarterly',anchor),items:[{desc:'',amount:''}],otherDeduct:'',otherDesc:'',ancFee:'noticeFee',ancQty:1,ancPropertyId:'',status:'draft'};

// Next-invoice reminders — flags full-management landlords whose last management
// invoice's period has ended (or ends within 7 days) so nothing gets missed.
function _nextInvoiceReminders(){
  const out=[];
  S.landlords.filter(l=>l.service==='full').forEach(l=>{
    const invs=(S.invoices||[]).filter(i=>i.landlordId===l.id&&i.type==='management'&&i.supplyTo).sort((a,b)=>new Date(b.supplyTo)-new Date(a.supplyTo));
    if(!invs.length) return; // no invoice history yet — nothing to remind against
    const next=new Date(invs[0].supplyTo); next.setDate(next.getDate()+1);
    const days=Math.round((next-new Date())/864e5);
    if(days<=7) out.push({l,next:_iso(next),days});
  });
  return out;
}
const ANC_FEES=[['noticeFee','Notice-serving'],['renewalFee','Tenancy renewal'],['arrearsFee','Arrears-chasing'],['keyFee','Lost key / lockout call-out'],['insuranceFee','Insurance-claim admin'],['disputeFee','Deposit dispute admin'],['invMoveinFee','Move-in inventory & check-in'],['invMoveoutFee','Move-out & check-out']];
// Build the current document from IV → {lines, title, totalLabel, period, kind, vat}
function _invBuild(){
  const l=L(IV.landlordId)||{}; const props=S.properties.filter(p=>p.landlordId===IV.landlordId);
  const rent=props.reduce((s,p)=>s+(p.rent||0),0);
  if(IV.docType==='tenantfind'){
    const net=Math.round(rent/4.345*feeOf(l)*100)/100;
    return {lines:[{desc:`Tenant-find fee · ${props.map(p=>p.address).join(', ')||'—'} · ${feeOf(l)} weeks' rent (one-off)`,net}],title:'INVOICE',totalLabel:'Total due',period:{label:'One-off',from:today(),to:today()},kind:'invoice',vat:!!S.agency.vatRegistered};
  }
  if(IV.docType==='ancillary'){
    const fee=(S.agency||{})[IV.ancFee]||0; const qty=Math.max(1,parseInt(IV.ancQty)||1); const net=Math.round(fee*qty*100)/100;
    const label=(ANC_FEES.find(x=>x[0]===IV.ancFee)||[])[1]||'Ancillary fee';
    const prop=props.find(p=>p.id===IV.ancPropertyId);
    return {lines:[{desc:`${label} fee${prop?' · '+prop.address:''}${qty>1?' × '+qty:''} (Clause 5b)`,net}],title:'INVOICE',totalLabel:'Total due',period:{label:'One-off',from:today(),to:today()},kind:'invoice',vat:!!S.agency.vatRegistered};
  }
  if(IV.docType==='maintenance'){
    const lines=(IV.items||[]).filter(x=>x.desc||x.amount).map(x=>({desc:'Works / disbursement · '+(x.desc||'—'),net:Math.round((+x.amount||0)*100)/100}));
    return {lines:lines.length?lines:[{desc:'Works / disbursement',net:0}],title:'INVOICE',totalLabel:'Total due',period:{label:'On completion',from:today(),to:today()},kind:'invoice',vat:!!S.agency.vatRegistered};
  }
  if(IV.docType==='remittance'){
    const pd=_period(IV.freq||'monthly',IV.y,IV.idx,IV.anchor);
    const rentCollected=Math.round(rent*pd.months*100)/100;
    const feeNet=props.reduce((s,p)=>s+p.rent*propFee(p)/100,0)*pd.months;
    const fee=Math.round(feeNet*(S.agency.vatRegistered?1.2:1)*100)/100;
    const other=Math.round((+IV.otherDeduct||0)*100)/100;
    const lines=[{desc:`Rent collected · ${pd.label}`,net:rentCollected},{desc:`Less: management fee${S.agency.vatRegistered?' (incl. VAT)':''}`,net:-fee}];
    if(other) lines.push({desc:'Less: other deductions'+(IV.otherDesc?' · '+IV.otherDesc:''),net:-other});
    return {lines,title:'REMITTANCE STATEMENT',totalLabel:'Net paid to landlord',period:pd,kind:'remittance',vat:false};
  }
  // management (recurring)
  const pd=_period(IV.freq||'quarterly',IV.y,IV.idx,IV.anchor);
  const lines=props.map(p=>({desc:`Management fee · ${p.address} · ${propFee(p)}% of ${gbp(p.rent)}/mo × ${pd.months} month${pd.months>1?'s':''}${IV.freq==='quarterly'?' (in advance)':''}`,net:Math.round(p.rent*propFee(p)/100*pd.months*100)/100}));
  return {lines:lines.length?lines:[{desc:'Management fee',net:0}],title:'INVOICE',totalLabel:'Total due',period:pd,kind:'invoice',vat:!!S.agency.vatRegistered};
}

// ── AI: verify landlord ID doc (name + expiry) against the name they gave us ──
async function obVerifyId(btn){
  const file=OB._file_?.idDoc; if(!file){toast('Re-attach the file, then verify',1);return;}
  btn.disabled=true; btn.textContent='Reading…';
  try{
    const b64=await _fileB64(file); const isImg=(file.type||'').startsWith('image/');
    const prompt='This is a UK photo ID (passport, driving licence, or BRP). Return ONLY JSON: {"name":"full name as shown","expiry":"YYYY-MM-DD or null"}.';
    const content=isImg?[{type:'image',source:{type:'base64',media_type:file.type,data:b64}},{type:'text',text:prompt}]:[{type:'document',source:{type:'base64',media_type:'application/pdf',data:b64}},{type:'text',text:prompt}];
    const res=await fetch(AG_EDGE,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+window._sessionToken},body:JSON.stringify({model:'claude-sonnet-4-5',max_tokens:200,messages:[{role:'user',content}]})});
    const data=await res.json(); const txt=((data.content&&data.content[0]&&data.content[0].text)||'{}').replace(/```json|```/g,'').trim();
    const parsed=JSON.parse(txt);
    OB.idAiChecked=true; OB.idAiName=parsed.name||''; OB.idAiExpiry=parsed.expiry||'';
    const norm=s=>(s||'').toLowerCase().replace(/[^a-z ]/g,'').split(' ').filter(Boolean);
    const a=new Set(norm(OB.name)); const b=norm(OB.idAiName);
    const hits=b.filter(t=>a.has(t)).length;
    OB.idAiMatch = hits>=Math.min(2,a.size) || (a.size===1&&hits>=1);
    OB.aml = OB.idAiMatch;
  }catch(e){ toast('Could not read the ID — review manually',1); OB.idAiChecked=true; OB.idAiMatch=false; }
  renderOnboard();
}

function uploadDoc(id,col){ const l=L(id);
  const label=col==='id'?'Photo ID (AML)':col==='ownership'?'Proof of ownership':'Signed agreement';
  const cur=l.docs&&l.docs[col]; const curExp=(col==='id'&&l.docs&&l.docs.idExpiry)||'';
  window._udFile=null;
  const body=`<div class="fg"><label>${label}</label>
    <label style="display:flex;align-items:center;gap:10px;padding:10px;border:1.5px dashed var(--border);border-radius:7px;cursor:pointer">
      <span style="font-size:18px">📄</span><div style="font-size:12.5px;font-weight:600;flex:1">${cur?'Replace file':'Click to attach a file'}</div>
      <input type="file" accept="image/*,.pdf" style="display:none" onchange="udAttach(this,'${col}')">
    </label>
    <div id="ud-status" style="margin-top:6px;font-size:11.5px">${cur?`<span style="color:var(--green)">✓ ${esc(cur)} on file</span>`:'<span class="faint">No file attached yet</span>'}</div></div>
    ${col==='id'?`<div class="fg"><label>ID expiry date <span class="faint">(AI reads it from the file, or enter manually)</span></label><input id="ud-expiry" type="date" value="${curExp}"></div>`:''}`;
  modal('Upload document', body, `<button class="btn" onclick="closeModal()">Cancel</button><button class="btn navy" onclick="saveUploadDoc('${id}','${col}')">Save</button>`, true); }
function udAttach(input,col){
  const f=input.files[0]; if(!f) return; window._udFile=f;
  const st=document.getElementById('ud-status');
  if(st) st.innerHTML='<span style="color:var(--blue)">✦ '+esc(f.name)+' attached'+(col==='id'?' — reading expiry…':'')+'</span>';
  if(col==='id') udScanExpiry(f);
}
async function udScanExpiry(file){
  const st=document.getElementById('ud-status');
  if(!window._sessionToken){ if(st)st.innerHTML='<span style="color:var(--green)">✓ '+esc(file.name)+' attached</span> — enter expiry manually.'; return; }
  try{
    const b64=await _fileB64(file); const isImg=(file.type||'').startsWith('image/');
    const prompt='This is a UK photo ID (passport, driving licence, or BRP). Return ONLY JSON: {"expiry":"YYYY-MM-DD or null"}.';
    const content=isImg?[{type:'image',source:{type:'base64',media_type:file.type,data:b64}},{type:'text',text:prompt}]:[{type:'document',source:{type:'base64',media_type:'application/pdf',data:b64}},{type:'text',text:prompt}];
    const res=await fetch(AG_EDGE,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+window._sessionToken},body:JSON.stringify({model:'claude-sonnet-4-5',max_tokens:100,messages:[{role:'user',content}]})});
    const data=await res.json(); const txt=((data.content&&data.content[0]&&data.content[0].text)||'{}').replace(/```json|```/g,'').trim();
    const parsed=JSON.parse(txt);
    if(parsed&&parsed.expiry){ const el=document.getElementById('ud-expiry'); if(el) el.value=parsed.expiry;
      if(st) st.innerHTML='<span style="color:var(--green)">✓ '+esc(file.name)+' attached · expiry '+esc(parsed.expiry)+' — review &amp; Save</span>';
    } else if(st) st.innerHTML='<span style="color:var(--green)">✓ '+esc(file.name)+' attached</span> — enter expiry manually.';
  }catch(e){ if(st) st.innerHTML='<span style="color:var(--green)">✓ '+esc(file.name)+' attached</span> — enter expiry manually.'; }
}
async function saveUploadDoc(id,col){
  const f=window._udFile; if(!f){ toast('Attach a file first',1); return; }
  var l=S.landlords.find(x=>x.id===id); l.docs=l.docs||{}; l.docs[col]=f.name;
  const ext=(f.name.split('.').pop()||'pdf'); const url=await _storageUpload(f,id+'/'+col+'-'+Date.now()+'.'+ext,'property-documents');
  if(url) l.docs[col+'Url']=url;
  if(col==='id'){ l.aml=true; const exp=val('ud-expiry'); if(exp) l.docs.idExpiry=exp; }
  if(col==='ownership')l.ownership=true; if(col==='agreement'){l.agreement=true;l.status='active';}
  save(); pushLandlord(l); window._udFile=null; closeModal(); render(); toast('✓ Document attached');
}

function buildManagementAgreement(l, service){
  const a=S.agency; const props=S.properties.filter(p=>p.landlordId===l.id);

  const appointmentClause = isMulti

    : `<p><b>2. Appointment — sole agency.</b> The Landlord appoints the Agent on a <b>sole agency</b> basis for an initial term of <b>${esc(a.solePeriodWeeks||'12')} weeks</b> from the date of this agreement ("the Tie-In Period"), renewing thereafter until ended per Clause 10. During the Tie-In Period the Landlord will not instruct any other agent to market the property(ies). If the Landlord lets the property during the Tie-In Period — including to a tenant the Landlord finds themselves — the Agent's full fee remains payable if the Agent introduced that tenant or was the effective cause of the letting; the Landlord may otherwise let privately without a fee to the Agent where the Agent had no involvement. Switching to another agent during the Tie-In Period does not end the Landlord's fee liability to the Agent for a tenant the Agent already introduced.</p>`;

  const dutiesClause=isFull
    ? `<p><b>3. Agent's duties (full management).</b> The Agent will: prepare marketing particulars and advertise the property (Rightmove, Zoopla and the Agent's own channels); arrange and accompany viewings; carry out Right to Rent and tenant referencing checks (credit history, employer and previous-landlord references, affordability); prepare the tenancy agreement; protect the deposit in a Government-authorised scheme within 30 days of receipt and serve the prescribed information; issue the Agent's management invoice to the Landlord monthly; instruct routine repairs up to £${esc(a.repairLimit||'250')} without prior approval (higher value works require the Landlord's authorisation except genuine emergencies); arrange statutory compliance certificates where instructed; conduct property inspections at least every 6 months with a written report; and serve statutory notices as instructed by the Landlord. Rent is paid by the Tenant directly to the Landlord — the Agent does not collect or hold rent. The Landlord will notify the Agent within 2 working days of any missed or late rent payment so the Agent can contact the Tenant on the Landlord's behalf; arrears-chasing beyond an initial reminder is charged per Clause 5b. Where the property already has a tenant in place at the start of this agreement, the Agent takes over management under that tenancy's existing terms (rent, deposit and any fixed term already agreed) — the marketing, viewing and referencing duties above do not apply to that tenancy, and all other duties in this clause apply from the date of instruction.</p>`
    : `<p><b>3. Agent's duties (tenant-find only).</b> The Agent will: prepare marketing particulars and advertise the property; arrange and accompany viewings; carry out Right to Rent and tenant referencing checks; prepare the tenancy agreement; and protect the deposit in a Government-authorised scheme. Once the tenancy commences, ongoing management, rent collection, repairs, inspections and compliance renewals are the Landlord's own responsibility and fall outside this agreement.</p>`;

  const feeClause=isFull
    ? `<p><b>5. Management fee.</b> The Landlord shall pay the Agent a management commission of <b>${propFee(props[0]||{})||(isMulti?MULTI_FEE:DEF_FEE)}% of gross monthly rent</b> (stated against each property above; ${isMulti?'the multiple-agency rate':'the sole-agency rate'}) plus VAT where applicable, invoiced monthly and payable within ${esc(a.paymentTerms||14)} days as rent is paid directly to the Landlord rather than collected by the Agent. Commission is payable for as long as the tenancy the Agent arranged or manages remains in place, including any renewal, extension, or statutory periodic tenancy that follows it, and continues to be payable to the Agent even after this agreement ends if that original tenancy continues.</p>`
    : `<p><b>5. Tenant-find fee.</b> The Landlord shall pay the Agent a one-off fee of <b>${feeOf(l)} weeks' rent</b>${isMulti?' (≈ 1 month, the multiple-agency rate)':' (the sole-agency rate)'} plus VAT where applicable, calculated as the agreed monthly rent × 12 ÷ 52, payable on commencement of the tenancy the Agent introduces. The same fee is payable again if that tenant renews or extends beyond an initial fixed term arranged by the Agent, and if a person introduced by the Agent takes a tenancy of the property within 6 months of an introduction even if the Agent did not conclude that tenancy.</p>`;
  const abortiveClause = (a.abortiveFee>0) ? `<p><b>5a. Withdrawal / abortive marketing fee.</b> If the Landlord withdraws instruction, or lets the Property privately or through another agent, after marketing has commenced but before a tenancy arranged by the Agent has started, the Landlord shall pay the Agent an abortive fee of <b>${gbp(a.abortiveFee)}</b> plus VAT where applicable, to cover marketing costs reasonably incurred (photography, portal listing fees, EPC where arranged by the Agent, and staff time). This fee is separate from and does not reduce any fee due under Clause 5.</p>` : '';
  const ancillaryRows=[a.noticeFee>0?`<li>Drafting &amp; serving a statutory notice (Section 8 possession notice or Section 13 rent-increase notice): <b>${gbp(a.noticeFee)}</b> plus VAT where applicable, per notice.</li>`:'',
    a.renewalFee>0?`<li>Arranging a tenancy renewal or extension with the sitting tenant: <b>${gbp(a.renewalFee)}</b> plus VAT where applicable.</li>`:'',
    a.arrearsFee>0?`<li>Chasing rent arrears beyond the first reminder letter: <b>${gbp(a.arrearsFee)}</b> plus VAT where applicable, per additional letter/call escalation.</li>`:'',
    a.keyFee>0?`<li>Lost key replacement or an out-of-hours lockout call-out: <b>${gbp(a.keyFee)}</b> plus VAT where applicable.</li>`:'',
    a.insuranceFee>0?`<li>Administering a landlord insurance claim (liaising with the insurer, providing evidence and records) on the Landlord's behalf: <b>${gbp(a.insuranceFee)}</b> plus VAT where applicable, per claim.</li>`:'',
    a.disputeFee>0?`<li>Preparing evidence and representations for a deposit protection scheme dispute (adjudication) on the Landlord's behalf: <b>${gbp(a.disputeFee)}</b> plus VAT where applicable, per dispute.</li>`:'',

  const ancillaryClause = ancillaryRows.length ? `<p><b>5b. Ancillary fees.</b> The following additional services are charged to the Landlord only when they arise, at the rates below:</p><ul style="margin:4px 0 10px 20px;padding:0">${ancillaryRows.join('')}</ul>` : '';

  const cmp = a.cmp && a.cmp!=='Not holding client money'
    ? `The Agent protects client money through ${esc(a.cmp)}${a.cmpNo?' (ref. '+esc(a.cmpNo)+')':''}.`
    : `The Agent does not hold client money on account; rent is remitted directly to the Landlord and the Agent's fee is invoiced separately.`;
  const redress = a.redress ? `The Agent is a member of ${esc(a.redress)}${a.redressNo?' (ref. '+esc(a.redressNo)+')':''}, an approved redress scheme under the Redress Schemes for Lettings Agency Work (Requirement to Belong to a Scheme etc.) (England) Order 2014.` : `The Agent is a member of an approved property redress scheme.`;

  return `
    <h2 style="text-align:center;margin-top:0">${title}</h2>

    <p><b>2. Property(ies).</b> This agreement covers:</p>
    ${propList}
    ${appointmentClause}
    ${dutiesClause}
    <p><b>4. Landlord's duties &amp; warranties.</b> The Landlord confirms they are the legal owner (or have the legal owner's authority) and are entitled to let the Property, that any mortgage lender's consent-to-let and any freeholder/superior landlord's consent have been obtained where required (the Landlord's own responsibility, not the Agent's), and that the Property is fit for habitation. The Landlord will keep in force, at their own cost: a valid Gas Safety Record (CP12) where gas appliances are present, an Electrical Installation Condition Report (EICR) renewed at least every 5 years, a valid Energy Performance Certificate rated E or above, and working smoke alarms on every storey plus a carbon monoxide alarm in any room with a fixed combustion appliance. The Landlord authorises the Agent to arrange or renew these where instructed, at the Landlord's cost, and to disclose all material information about the Property to prospective tenants as required by consumer protection law.</p>
    ${feeClause}
    ${abortiveClause}
    ${ancillaryClause}
    <p><b>6. VAT &amp; payment.</b> ${a.vatRegistered?'All fees are stated exclusive of VAT, which is charged at the prevailing rate.':'The Agent is not currently VAT-registered; no VAT is added to the fees above.'} Invoices are payable within ${esc(a.paymentTerms||14)} days of issue. The Agent does not hold or deduct from rent under either instruction type — rent is paid by the Tenant directly to the Landlord, and all Agent fees are invoiced separately.</p>
    <p><b>7. Marketing &amp; To-Let board.</b> The Landlord authorises the Agent to advertise the Property (including on property portals and the Agent's own channels) and, unless the Landlord opts out below, to erect one <b>${esc(a.name||'Agent')}</b> "To Let" / "Let By" board at the Property during the marketing period and for a reasonable period after a let is agreed (typically 4–6 weeks), in accordance with the Town and Country Planning (Control of Advertisements) (England) Regulations 2007. Only one board will be displayed at any time and it will be removed within 14 days of the Agent being instructed to do so. Board opt-out: <b>${l.boardOptOut?'Landlord has opted OUT of a board':'Board permitted'}</b>.</p>

    <p><b>9. Right to Rent, referencing &amp; anti-money-laundering.</b> The Agent will carry out Right to Rent checks on prospective tenants in accordance with the Immigration Act 2014, and standard referencing (credit history, employer and previous-landlord references, affordability assessment) before recommending a tenancy. The Agent carries out identity, address and sanctions-screening checks on the Landlord under the Money Laundering, Terrorist Financing and Transfer of Funds (Information on the Payer) Regulations 2017, and retains those records for 5 years.</p>

async function sendAgreement(id){
  const l=L(id); const service=document.getElementById('ag-service').value;
  const email=val('ag-email'); const agentName=val('ag-agent-name')||S.agency.name||'The agent';
  if(!email){ toast('Enter the landlord\'s email',1); return; }
  if(!_agSigPad||_agSigPad.isEmpty()){ toast('Please add your signature',1); return; }
  if(!LIVE){ toast('Connect to Supabase to send (not available in demo)',1); return; }
  const token=uid('agt')+Math.random().toString(36).slice(2,10);
  const row={ id:uid('ag'), agency_id:window._agencyId, landlord_id:l.id, token, service,
    document_html:buildManagementAgreement(l,service), agent_name:agentName, agent_email:window._agentEmail||'',
    agent_sig_png:_agSigPad.toDataURL('image/png'), agent_signed_at:new Date().toISOString(),
    landlord_name:l.name, landlord_email:email, entity:l.entity||'individual', joint_name:l.entity==='joint'?(l.joint||''):'', joint_email:l.entity==='joint'?(l.jointEmail||''):'', status:'sent' };
  const { error }=await sb.from('agency_agreements').insert(row);
  if(error){ console.error(error); toast('⚠ Could not create agreement — retry',1); return; }
  l.email=email; l.agreement=false; l.status='pending'; l.comms=l.comms||[];
  l.comms.push({id:uid('c'),date:today(),type:'Note',note:(service==='letonly'?'Tenant-find':'Management')+' agreement signed by agent & sent to landlord for counter-signature.'});
  pushLandlord(l);
  S.agreements=S.agreements||[]; S.agreements.push(row);
  const link=new URL('agency-esign.html?t='+encodeURIComponent(token), location.href).href;
  const r1=await agencyEmail(email, 'Please sign your '+(service==='letonly'?'Tenant-Find':'Letting & Management')+' Agreement — '+(S.agency.name||'NexLet'), agreementEmailHtml(l,agentName,link,service));
  let r2=null;
  if(l.entity==='joint'&&l.jointEmail) r2=await agencyEmail(l.jointEmail, 'Please sign your '+(service==='letonly'?'Tenant-Find':'Letting & Management')+' Agreement — '+(S.agency.name||'NexLet'), agreementEmailHtml(l,agentName,link,service));
  const sentList=[email+(r1.ok?' ✓':' ✗ FAILED')]; if(r2) sentList.push(l.jointEmail+(r2.ok?' ✓':' ✗ FAILED'));
  l.comms.push({id:uid('c'),date:today(),type:'Note',note:'Signing link emailed to: '+sentList.join(', ')}); pushLandlord(l);
  closeModal(); render();
  const allOk=r1.ok&&(!r2||r2.ok);
  if(allOk) toast('✓ Agreement sent to '+sentList.map(s=>s.replace(' ✓','')).join(' & '));
  else toast('⚠ Send failed for: '+sentList.filter(s=>s.includes('FAILED')).join(', ')+' — check email address and retry',1);
}

async function reconcileAgreements(){
  if(!LIVE||!S.agreements) return; let changed=false;
  for(const a of S.agreements){
    if(a.status==='signed' && a.landlord_id){
      const l=L(a.landlord_id);
      if(l.id && !l.agreement){
        l.agreement=true; l.status='active'; l.docs=l.docs||{};
        l.docs.agreement=l.docs.agreement||('Signed '+(a.service==='letonly'?'Tenant-Find':'Management')+' Agreement');
        l.comms=l.comms||[]; l.comms.push({id:uid('c'),date:today(),type:'Note',note:'Agreement counter-signed by landlord — now live.'});
        pushLandlord(l); changed=true; emailSignedAgreement(a,l); sendWelcomeLetter(l);
      }
    }
  }
  if(changed) render();
}

async function tplPolish(){
  const t=tplByKey(TPL.key); const built=_tplBuild(); const btn=document.getElementById('tpl-ai');

  if(btn){ btn.disabled=true; btn.innerHTML='✦ Polishing…'; }
  const plain=built.body.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim();
  const prompt=`You are a senior UK letting agent at ${agencyBrand().name}. Rewrite the letter below to be warmer, clearer and professional, keeping ALL facts, names, figures and dates identical. Keep it concise. Return ONLY the letter body as simple HTML <p> paragraphs (no markdown, no subject line, no signature change).\n\nLETTER:\n${plain}`;

function groundById(c){ return GROUNDS.find(g=>g[0]===c); }
function _addPeriod(dateStr, per){ const d=dateStr?new Date(dateStr):new Date(); if(per.unit==='years'){ d.setFullYear(d.getFullYear()+per.amt); } else if(per.unit==='months'){ d.setMonth(d.getMonth()+per.amt); } else if(per.unit==='weeks'){ d.setDate(d.getDate()+per.amt*7); } else { d.setDate(d.getDate()+per.amt); } return d.toISOString().slice(0,10); }

async function serveNotice(id){ const n=S.notices.find(x=>x.id===id); if(!n)return;
  const method=document.getElementById('sv-method'); const dt=document.getElementById('sv-date');
  n.status='served'; n.served=dt?dt.value:(n.served||today());
  const p=P(n.propertyId)||{}; const l=L(n.landlordId||p.landlordId);
  if(method){ let docUrl='';
    if(window._serveProofFile){ const ext=(window._serveProofFile.name.split('.').pop()||'jpg'); docUrl=await _storageUpload(window._serveProofFile,p.id+'/service-proof-'+Date.now()+'.'+ext,'property-documents')||''; }
    n.serviceProof={method:method.value,date:n.served,notes:(document.getElementById('sv-notes')||{}).value||'',docUrl};
    window._serveProofFile=null;
  }
  if(l&&l.id){ l.comms=l.comms||[]; l.comms.push({id:uid('c'),date:today(),type:'Notice',note:(n.kind==='section13'?'Section 13 rent increase notice':'Section 8 possession notice')+' marked as served ('+(n.serviceProof?n.serviceProof.method:'method not recorded')+') — '+(p.address||'')}); pushLandlord(l); }
  save(); pushNotice(n); closeModal(); render(); toast('\u2713 Marked as served — proof of service saved'); }
function withdrawNotice(id){ const n=S.notices.find(x=>x.id===id); if(!n)return; n.status='withdrawn'; save(); pushNotice(n); render(); toast('Notice withdrawn'); }
function deleteNotice(id){ const n=S.notices.find(x=>x.id===id); if(!n)return;
  if(!confirm('Delete this draft notice? This cannot be undone.')) return;
  S.notices=S.notices.filter(x=>x.id!==id);
  if(LIVE) sb.from('agency_notices').delete().eq('id',id).then(()=>{}).catch(e=>console.error(e));
  save(); go('notices'); toast('Draft deleted'); }
function _noticeRecipients(n){
  const p=P(n.propertyId)||{}; const t=p.tenant||{}; const rec=tenantRecFor(n.propertyId)||{};
  const out=[]; const seen=new Set();
  const add=(email,label)=>{ email=(email||'').trim(); if(email&&!seen.has(email.toLowerCase())){ seen.add(email.toLowerCase()); out.push({email,label}); } };
  add(t.email||rec.email,'tenant');
  (t.occupants||rec.occupants||[]).forEach(o=>add(o.email,o.name||'occupant'));
  if(rec.guarantor&&rec.guarantor.email) add(rec.guarantor.email,'guarantor');
  return out;
}

function initials(n){ return (n||'?').split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase(); }

// ═══════════════════════════════════════════════════════════════════════════
// RENT & ARREARS
// ═══════════════════════════════════════════════════════════════════════════
function _activeTenants(){ return (S.tenants||[]).filter(t=>t.status==='active'); }
function ensureRentDue(){
  const ym=today().slice(0,7);
  _activeTenants().forEach(t=>{
    S.rentLedger=S.rentLedger||[];
    const has=S.rentLedger.some(r=>r.tenantId===t.id && (r.due||'').slice(0,7)===ym);
    if(!has && t.rent){ const r={id:uid('rl'),propertyId:t.propertyId,tenantId:t.id,due:ym+'-01',amount:t.rent,paidDate:'',status:'due',notes:''}; S.rentLedger.push(r); pushRent(r); }
  });
  // auto-flag overdue (>7 days past due, still unpaid) as late
  (S.rentLedger||[]).forEach(r=>{ if(r.status==='due' && daysUntil(r.due)<-7){ r.status='late'; pushRent(r); } });
}
function tenantArrears(tid){ return (S.rentLedger||[]).filter(r=>r.tenantId===tid && r.status!=='paid' && new Date(r.due)<=new Date()).reduce((s,r)=>s+r.amount,0); }
function vRentArrears(){
  ensureRentDue();
  const ts=_activeTenants();
  const totalArrears=ts.reduce((s,t)=>s+tenantArrears(t.id),0);
  const inArrears=ts.filter(t=>tenantArrears(t.id)>0).length;
  const rows=ts.map(t=>{
    const p=P(t.propertyId)||{}; const arrears=tenantArrears(t.id);
    const last=(S.rentLedger||[]).filter(r=>r.tenantId===t.id&&r.status==='paid').sort((a,b)=>new Date(b.paidDate)-new Date(a.paidDate))[0];
    return `<div class="row"><div class="av">${initials(t.name)}</div>
      <div style="flex:1;min-width:0"><div style="font-size:14px;font-weight:600;color:var(--navy)">${esc(t.name)}</div>
      <div class="faint" style="font-size:12px">${esc(p.address||'—')} · ${gbp(t.rent)}/mo${last?' · last paid '+fmtDate(last.paidDate):''}</div></div>
      ${arrears>0?`<span class="pill" style="background:var(--red-bg);color:var(--red)">${gbp(arrears)} arrears</span>`:`<span class="pill" style="background:var(--green-bg);color:var(--green)">Up to date</span>`}
      ${arrears>0?`<button class="btn sm" style="border-color:var(--amber);color:var(--amber)" onclick="arrearsAction('${t.id}')">⚖ Arrears action</button>`:''}
      <button class="btn sm" onclick="logPaymentPicker('${t.id}')">Log payment</button></div>`;
  }).join('');
  return `<h1 class="pg">Rent &amp; Arrears</h1><div class="sub">Rent due is generated monthly per active tenancy. Mark payments as received to keep arrears accurate — this also feeds the Ground 8 arrears threshold on Possession &amp; Notices, and notifies full-management landlords with a statement.</div>
    <div style="display:flex;justify-content:flex-end;margin-bottom:12px"><button class="btn" onclick="openStatement()">📄 Landlord statement (½-yearly / yearly)</button></div>
    <div class="grid4" style="margin-bottom:18px">
      <div class="kpi"><div class="l">Active tenancies</div><div class="v">${ts.length}</div></div>
      <div class="kpi"><div class="l">Total arrears</div><div class="v" style="color:${totalArrears>0?'var(--red)':'var(--green)'}">${gbp(totalArrears)}</div></div>
      <div class="kpi"><div class="l">Tenants in arrears</div><div class="v" style="color:var(--amber)">${inArrears}</div></div>
      <div class="kpi"><div class="l">Monthly roll</div><div class="v">${gbp(ts.reduce((s,t)=>s+t.rent,0))}</div></div>
    </div>
    <div class="panel">${rows||'<div class="empty">No active tenancies yet. Set up a tenant from a property to start tracking rent.</div>'}</div>`;
}
function logPaymentPicker(tid){
  const ts=_activeTenants(); const pick=tid||( ts[0]||{}).id;
  const opts=ts.map(t=>`<option value="${t.id}" ${t.id===pick?'selected':''}>${esc(t.name)} — ${esc((P(t.propertyId)||{}).address||'')}</option>`).join('');
  const body=`<div class="fg"><label>Tenant</label><select id="lp-tenant" onchange="logPaymentPicker(this.value)">${opts}</select></div>${renderDueList(pick)}`;
  modal('Log a rent payment', body, `<button class="btn" onclick="closeModal()">Close</button>`);
}
function renderDueList(tid){
  const dues=(S.rentLedger||[]).filter(r=>r.tenantId===tid&&r.status!=='paid').sort((a,b)=>new Date(a.due)-new Date(b.due));
  if(!dues.length) return '<div class="faint" style="font-size:13px;margin-top:10px">No outstanding amounts for this tenant.</div>';
  return `<div style="margin-top:10px">${dues.map(r=>`<div class="kv"><span class="k">${fmtDate(r.due)} · ${gbp(r.amount)}${r.status==='late'?' <span style=\"color:var(--red);font-weight:600\">(late)</span>':''}</span><span class="v"><button class="btn sm" onclick="markPaid('${r.id}')">Mark paid</button></span></div>`).join('')}</div>`;
}
function markPaid(rid){
  const r=(S.rentLedger||[]).find(x=>x.id===rid); if(!r)return;
  r.status='paid'; r.paidDate=today(); pushRent(r);
  const t=(S.tenants||[]).find(x=>x.id===r.tenantId)||{};
  const p=P(t.propertyId)||{}; const l=L(p.landlordId)||{};
  closeModal();
  // Full-management: rent is received on the landlord's behalf → confirm the received-
  // and-remitted notification (correct wording + net-of-fee statement) before it sends.
  if(l.id && l.service==='full'){ _rentReceivedConfirm(r,t,p,l); return; }
  render(); toast('✓ Payment logged');
}
// Confirmation step — the agent stays in control of what the landlord receives.
function _rentReceivedConfirm(r,t,p,l){
  const fee=Math.round(r.amount*propFee(p))/100; const net=Math.round((r.amount-fee)*100)/100;
  const period=new Date(r.due).toLocaleDateString('en-GB',{month:'long',year:'numeric'});
  const body=`<div class="note" style="margin-bottom:14px">Rent of <b>${gbp(r.amount)}</b> from <b>${esc(t.name)}</b> for <b>${esc(p.address)}</b> is marked received (${fmtDate(r.paidDate)}). As you manage this let, we'll notify <b>${esc(landlordName(l))}</b> and record a rent statement.</div>
    <div style="background:var(--off);border:1px solid var(--border);border-radius:10px;padding:14px;font-size:12.5px;line-height:1.8;margin-bottom:6px">
      <div style="display:flex;justify-content:space-between"><span>Rent received · ${esc(period)}</span><b>${money2(r.amount)}</b></div>
      <div style="display:flex;justify-content:space-between"><span>Less: management fee (${propFee(p)}%)</span><b style="color:var(--red)">− ${money2(fee)}</b></div>
      <div style="display:flex;justify-content:space-between;border-top:1px solid var(--border);margin-top:6px;padding-top:6px"><b>Net to remit to landlord</b><b style="color:var(--navy)">${money2(net)}</b></div>
    </div>
    <label style="display:flex;align-items:center;gap:8px;font-size:12.5px;margin:12px 0 2px;cursor:pointer"><input type="checkbox" id="rp-email" style="width:auto" ${l.email?'checked':''} ${l.email?'':'disabled'}> Email the statement to ${l.email?esc(l.email):'landlord (no email on file)'}</label>`;
  modal('Rent received — notify landlord', body,
    `<button class="btn" onclick="closeModal();render();toast('✓ Payment logged')">Skip</button><button class="btn navy" onclick="_rentReceivedSend('${r.id}')">Send statement</button>`);
}
async function _rentReceivedSend(rid){
  const r=(S.rentLedger||[]).find(x=>x.id===rid); if(!r){closeModal();return;}
  const t=(S.tenants||[]).find(x=>x.id===r.tenantId)||{}; const p=P(t.propertyId)||{}; const l=L(p.landlordId)||{};
  const doEmail=(document.getElementById('rp-email')||{}).checked;

    <div style="background:#0B1E3D;padding:18px 22px;border-radius:10px 10px 0 0"><span style="color:#fff;font-size:18px;font-weight:700">${esc(agencyBrand().name)}</span></div>
    <div style="padding:22px;border:1px solid #E4EAF1;border-top:none;border-radius:0 0 10px 10px">
      <p>Dear ${esc(landlordName(l))},</p>
