  const lines=props.map(p=>({desc:`Management fee · ${p.address} · ${propFee(p)}% of ${gbp(p.rent)}/mo × ${pd.months} month${pd.months>1?'s':''}${IV.freq==='quarterly'?' (in advance)':''}`,net:Math.round(p.rent*propFee(p)/100*pd.months*100)/100}));
  return {lines:lines.length?lines:[{desc:'Management fee',net:0}],title:'INVOICE',totalLabel:'Total due',period:pd,kind:'invoice',vat:!!S.agency.vatRegistered};
}
function renderInvoice(){

  // Remittance only exists once the agency actually receives rent — see holdsClientMoney().
  const DOCS=[['management','Management fee'],...(holdsClientMoney()?[['remittance','Rent remittance (collect & pay out)']]:[]),['tenantfind','Tenant-find (one-off)'],['maintenance','Maintenance / disbursement'],['ancillary','Ancillary fee (Clause 5b)']];

  confirmSend({title:lbl,subject:lbl+' — '+(a0.name||'NexLet'),to:[l.email],

async function _sendInvoiceNow(id){
  const inv=(S.invoices||[]).find(i=>i.id===id); if(!inv) return;
  const l=L(inv.landlordId);
  const a=S.agency, t=invTotal(inv);
  const due=new Date(new Date(inv.issued).getTime()+(a.paymentTerms||14)*864e5).toISOString().slice(0,10);
  const subject=(inv.type==='remittance'?'Remittance statement ':'Invoice ')+inv.no+' — '+(a.name||'NexLet');
  const html=invoiceEmailHtml(inv,l,a,t,due);
  const r=await agencyEmail(l.email, subject, html);

    render(); toast('✓ '+inv.no+' emailed to '+l.email); }

}

// ── AI: verify landlord ID doc (name + expiry) against the name they gave us ──
async function obVerifyId(btn){
  const file=OB._file_?.idDoc; if(!file){toast('Re-attach the file, then verify',1);return;}
  btn.disabled=true; btn.textContent='Reading…';
  try{
    const b64=await _fileB64(file); const isImg=(file.type||'').startsWith('image/');
    const prompt='This is a UK photo ID (passport, driving licence, or BRP). Return ONLY JSON: {"name":"full name as shown","expiry":"YYYY-MM-DD or null"}.';
    const content=isImg?[{type:'image',source:{type:'base64',media_type:file.type,data:b64}},{type:'text',text:prompt}]:[{type:'document',source:{type:'base64',media_type:'application/pdf',data:b64}},{type:'text',text:prompt}];
    const res=await fetch(AG_EDGE,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+window._sessionToken},body:JSON.stringify({model:'claude-sonnet-4-5',max_tokens:200,messages:[{role:'user',content}]})});
    const data=await res.json(); const txt=((data.content&&data.content[0]&&data.content[0].text)||'{}').replace(/```json|```/g,'').trim();
    const parsed=JSON.parse(txt);
    OB.idAiChecked=true; OB.idAiName=parsed.name||''; OB.idAiExpiry=parsed.expiry||'';
    const norm=s=>(s||'').toLowerCase().replace(/[^a-z ]/g,'').split(' ').filter(Boolean);
    const a=new Set(norm(OB.name)); const b=norm(OB.idAiName);
    const hits=b.filter(t=>a.has(t)).length;
    OB.idAiMatch = hits>=Math.min(2,a.size) || (a.size===1&&hits>=1);
    OB.aml = OB.idAiMatch;
  }catch(e){ toast('Could not read the ID — check the document yourself below',1); OB.idAiChecked=true; OB.idAiMatch=false; OB.idAiName=''; }
  renderOnboard();
}

function uploadDoc(id,col,passedLabel){ const l=L(id);
  const DOC_LABELS={id:'Photo ID (AML)',address:'Proof of address (AML)',ownership:'Proof of ownership',
    agreement:'Signed agreement',mortgageConsent:'Consent to let (mortgage lender)',
    freeholderConsent:'Freeholder consent to let',incorporation:'Certificate of incorporation',
    directorId:'Director photo ID',id2:'Owner 2 — photo ID',address2:'Owner 2 — proof of address'};
  const label=passedLabel||DOC_LABELS[col]||'Document';
  const cur=l.docs&&l.docs[col]; const curExp=(col==='id'&&l.docs&&l.docs.idExpiry)||'';
  window._udFile=null;
  const body=`<div class="fg"><label>${label}</label>
    <label style="display:flex;align-items:center;gap:10px;padding:10px;border:1.5px dashed var(--border);border-radius:7px;cursor:pointer">
      <span style="font-size:18px">📄</span><div style="font-size:12.5px;font-weight:600;flex:1">${cur?'Replace file':'Click to attach a file'}</div>
      <input type="file" accept="image/*,.pdf" style="display:none" onchange="udAttach(this,'${col}')">
    </label>
    <div id="ud-status" style="margin-top:6px;font-size:11.5px">${cur?`<span style="color:var(--green)">✓ ${esc(cur)} on file</span>`:'<span class="faint">No file attached yet</span>'}</div></div>
    ${col==='id'?`<div class="fg"><label>ID expiry date <span class="faint">(AI reads it from the file, or enter manually)</span></label><input id="ud-expiry" type="date" value="${curExp}"></div>`:''}`;
  modal('Upload document', body, `<button class="btn" onclick="closeModal()">Cancel</button><button class="btn navy" onclick="saveUploadDoc('${id}','${col}')">Save</button>`, true); }
function udAttach(input,col){
  const f=input.files[0]; if(!f) return; window._udFile=f;
  const st=document.getElementById('ud-status');
  if(st) st.innerHTML='<span style="color:var(--blue)">✦ '+esc(f.name)+' attached'+(col==='id'?' — reading expiry…':'')+'</span>';
  if(col==='id') udScanExpiry(f);
}
async function udScanExpiry(file){
  const st=document.getElementById('ud-status');
  if(!window._sessionToken){ if(st)st.innerHTML='<span style="color:var(--green)">✓ '+esc(file.name)+' attached</span> — enter expiry manually.'; return; }
  try{
    const b64=await _fileB64(file); const isImg=(file.type||'').startsWith('image/');
    const prompt='This is a UK photo ID (passport, driving licence, or BRP). Return ONLY JSON: {"expiry":"YYYY-MM-DD or null"}.';
    const content=isImg?[{type:'image',source:{type:'base64',media_type:file.type,data:b64}},{type:'text',text:prompt}]:[{type:'document',source:{type:'base64',media_type:'application/pdf',data:b64}},{type:'text',text:prompt}];
    const res=await fetch(AG_EDGE,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+window._sessionToken},body:JSON.stringify({model:'claude-sonnet-4-5',max_tokens:100,messages:[{role:'user',content}]})});
    const data=await res.json(); const txt=((data.content&&data.content[0]&&data.content[0].text)||'{}').replace(/```json|```/g,'').trim();
    const parsed=JSON.parse(txt);
    if(parsed&&parsed.expiry){ const el=document.getElementById('ud-expiry'); if(el) el.value=parsed.expiry;
      if(st) st.innerHTML='<span style="color:var(--green)">✓ '+esc(file.name)+' attached · expiry '+esc(parsed.expiry)+' — review &amp; Save</span>';
    } else if(st) st.innerHTML='<span style="color:var(--green)">✓ '+esc(file.name)+' attached</span> — enter expiry manually.';
  }catch(e){ if(st) st.innerHTML='<span style="color:var(--green)">✓ '+esc(file.name)+' attached</span> — enter expiry manually.'; }
}

/* A hand-off with no date cannot be chased, and "still waiting on referencing"
   is the commonest reason a move-in slips. Three working days is the point at
   which it is worth a phone call rather than more waiting. */
function _refChase(r){
  if(!r||!r.sentAt||r.creditState==='complete') return '';
  const days=Math.floor((Date.now()-new Date(r.sentAt))/86400000);
  if(days<3) return '';
  return '<div class="note warn" style="margin-top:10px;padding:8px 11px;font-size:12px">Sent '+days
    +' days ago with no result back'+(r.partnerRef?' (their ref '+esc(r.partnerRef)+')':'')+'. Worth a chase.</div>';
}

function _credit(stateTo){ RF.applicant=val('rf-app'); RF.income=parseInt(val('rf-income'))||0; RF.note=val('rf-note'); RF.status=val('rf-status');
  RF.sentAt=val('rf-sent')||RF.sentAt||''; RF.partnerRef=val('rf-ref')||RF.partnerRef||'';

async function agencyEmail(to,subject,html,attachmentUrls){
  const headers={'Content-Type':'application/json'};
  if(window._sessionToken) headers['Authorization']='Bearer '+window._sessionToken;
  const brand=agencyBrand().name;
  const taggedSubject=(brand&&subject&&!subject.startsWith('['+brand+']'))?`[${brand}] ${subject}`:subject;
  try{
    // Documents go out from a system address so they look systematic, but any
    // reply must reach a mailbox that is actually read — otherwise replies
    // vanish, which is exactly what was happening before this was added.
    const replyTo=(S.agency&&S.agency.replyTo)||'';
    const res=await fetch(AG_EDGE,{method:'POST',headers,body:JSON.stringify({type:'send_email',to,subject:taggedSubject,html,bcc:(S.agency&&S.agency.archiveEmail)||'',from:brand+' <documents@nexlet.co.uk>',...(replyTo?{reply_to:replyTo}:{}),...(attachmentUrls&&attachmentUrls.length?{attachment_urls:attachmentUrls}:{})})});
    const data=await res.json().catch(()=>({}));
    if(!res.ok){ console.error('[agencyEmail] failed',res.status,data);
      const bad={ok:false,error:data.error||data.message||('HTTP '+res.status)};
      if(window.NexLetComms) NexLetComms.noteEmail(to,taggedSubject,html,bad);
      return bad; }
    // Logged here rather than at the 25 call sites, so nothing depends on
    // anyone remembering. Recipient attribution happens inside noteEmail.
    if(window.NexLetComms) NexLetComms.noteEmail(to,taggedSubject,html,{ok:true});
    return {ok:true};
  }catch(e){ console.error('[agencyEmail] exception',e);
    const bad={ok:false,error:e.message||String(e)};
    if(window.NexLetComms) NexLetComms.noteEmail(to,taggedSubject,html,bad);

function buildManagementAgreement(l, service){
  const a=S.agency; const props=S.properties.filter(p=>p.landlordId===l.id);
  const isFull=service==='full';
  const isMulti=l.agencyType==='multiple';
  const title=isFull?'Letting &amp; Management Agreement':'Tenant-Find Agreement';

  const appointmentClause = isMulti
    ? `<p><b>2. Appointment — multiple agency.</b> The Landlord appoints the Agent on a <b>multiple agency</b> basis. The Landlord is free to instruct other agents to market the same property(ies) simultaneously. A fee is payable to the Agent only where the Agent introduces the tenant with whom a tenancy is subsequently entered into, or where the Agent is otherwise the effective cause of the letting. If a tenancy is arranged through a different agent, no fee is payable to the Agent under this agreement. The Agent's fee is set higher than a sole agency instruction to reflect this risk (Clause 5).</p>`
    : `<p><b>2. Appointment — sole agency.</b> The Landlord appoints the Agent on a <b>sole agency</b> basis for an initial term of <b>${esc(a.solePeriodWeeks||'12')} weeks</b> from the date of this agreement ("the Tie-In Period"), renewing thereafter until ended per Clause 10. During the Tie-In Period the Landlord will not instruct any other agent to market the property(ies). If the Landlord lets the property during the Tie-In Period — including to a tenant the Landlord finds themselves — the Agent's full fee remains payable if the Agent introduced that tenant or was the effective cause of the letting; the Landlord may otherwise let privately without a fee to the Agent where the Agent had no involvement. Switching to another agent during the Tie-In Period does not end the Landlord's fee liability to the Agent for a tenant the Agent already introduced.</p>`;

  // The statutory deposit duty falls on whoever RECEIVES the deposit. Where the
  // landlord takes it direct, the Agent's duty is to obtain and file the
  // evidence — promising to protect money it never receives would be false.
  const _depHeld=(a.depHolderDefault||'landlord');
  const _depDuty=_depHeld==='landlord'
    ? 'obtain from the Landlord, and keep on file, evidence that the deposit has been protected in a Government-authorised scheme within 30 days of receipt and that the prescribed information has been served — the Landlord receiving the deposit direct and remaining responsible for both duties'
    : (_depHeld==='scheme'
      ? 'arrange for the deposit to be transferred to a Government-authorised custodial scheme within 30 days of receipt and serve the prescribed information'
      : 'protect the deposit in a Government-authorised scheme within 30 days of receipt and serve the prescribed information');
  const dutiesClause=isFull
    ? `<p><b>3. Agent's duties (full management).</b> The Agent will: prepare marketing particulars and advertise the property (Rightmove, Zoopla and the Agent's own channels); arrange and accompany viewings; carry out Right to Rent and tenant referencing checks (credit history, employer and previous-landlord references, affordability); prepare the tenancy agreement; ${_depDuty}; issue the Agent's management invoice to the Landlord monthly; instruct routine repairs up to £${esc(a.repairLimit||'250')} without prior approval (higher value works require the Landlord's authorisation except genuine emergencies); arrange statutory compliance certificates where instructed; conduct property inspections at least every 6 months with a written report; and serve statutory notices as instructed by the Landlord. Rent is paid by the Tenant directly to the Landlord — the Agent does not collect or hold rent. The Landlord will notify the Agent within 2 working days of any missed or late rent payment so the Agent can contact the Tenant on the Landlord's behalf; arrears-chasing beyond an initial reminder is charged per Clause 5b. Where the property already has a tenant in place at the start of this agreement, the Agent takes over management under that tenancy's existing terms (rent, deposit and any fixed term already agreed) — the marketing, viewing and referencing duties above do not apply to that tenancy, and all other duties in this clause apply from the date of instruction.</p>`
    : `<p><b>3. Agent's duties (tenant-find only).</b> The Agent will: prepare marketing particulars and advertise the property; arrange and accompany viewings; carry out Right to Rent and tenant referencing checks; prepare the tenancy agreement; and ${_depDuty}. Once the tenancy commences, ongoing management, rent collection, repairs, inspections and compliance renewals are the Landlord's own responsibility and fall outside this agreement.</p>`;

  const feeClause=isFull
    ? `<p><b>5. Management fee.</b> The Landlord shall pay the Agent a management commission of <b>${propFee(props[0]||{})||(isMulti?MULTI_FEE:DEF_FEE)}% of gross monthly rent</b> (stated against each property above; ${isMulti?'the multiple-agency rate':'the sole-agency rate'}) plus VAT where applicable, invoiced monthly and payable within ${esc(a.paymentTerms||14)} days as rent is paid directly to the Landlord rather than collected by the Agent. Commission is payable for as long as the tenancy the Agent arranged or manages remains in place, including any renewal, extension, or statutory periodic tenancy that follows it, and continues to be payable to the Agent even after this agreement ends if that original tenancy continues.</p>`
    : `<p><b>5. Tenant-find fee.</b> The Landlord shall pay the Agent a one-off fee of <b>${feeOf(l)} weeks' rent</b>${isMulti?' (≈ 1 month, the multiple-agency rate)':' (the sole-agency rate)'} plus VAT where applicable, calculated as the agreed monthly rent × 12 ÷ 52, payable on commencement of the tenancy the Agent introduces. The same fee is payable again if that tenant renews or extends beyond an initial fixed term arranged by the Agent, and if a person introduced by the Agent takes a tenancy of the property within 6 months of an introduction even if the Agent did not conclude that tenancy.</p>`;
  const abortiveClause = (a.abortiveFee>0) ? `<p><b>5a. Withdrawal / abortive marketing fee.</b> If the Landlord withdraws instruction, or lets the Property privately or through another agent, after marketing has commenced but before a tenancy arranged by the Agent has started, the Landlord shall pay the Agent an abortive fee of <b>${gbp(a.abortiveFee)}</b> plus VAT where applicable, to cover marketing costs reasonably incurred (photography, portal listing fees, EPC where arranged by the Agent, and staff time). This fee is separate from and does not reduce any fee due under Clause 5.</p>` : '';
  const ancillaryRows=[a.noticeFee>0?`<li>Drafting &amp; serving a statutory notice (Section 8 possession notice or Section 13 rent-increase notice): <b>${gbp(a.noticeFee)}</b> plus VAT where applicable, per notice.</li>`:'',

    a.disputeFee>0?`<li>Preparing evidence and representations for a deposit protection scheme dispute (adjudication) on the Landlord's behalf: <b>${gbp(a.disputeFee)}</b> plus VAT where applicable, per dispute.</li>`:'',
    a.invMoveinFee>0?`<li>Move-in inventory &amp; check-in report (photographic condition record, room by room): <b>${gbp(a.invMoveinFee)}</b> plus VAT where applicable, per tenancy.</li>`:'',
    a.invMoveoutFee>0?`<li>Move-out &amp; check-out report (compared against the move-in record, for deposit purposes): <b>${gbp(a.invMoveoutFee)}</b> plus VAT where applicable, per tenancy.</li>`:''].filter(Boolean);
  // Says plainly whether the Agent handles money. Where it does not, the

  const _moneyClause = _depHeld==='landlord'

       <ul style="margin:4px 0 10px 20px;padding:0">

    : `<p><b>11b. Client money.</b> Where the Agent receives rent or a deposit on the Landlord's behalf, it is held in a designated client account, separate from the Agent's own funds, and is covered by the Agent's Client Money Protection membership${a.cmp&&a.cmp!=='Not holding client money'?' with '+esc(a.cmp):''}. Rent received is remitted to the Landlord's nominated account in accordance with clause 5, less any fees properly due. The Agent will protect the deposit in a Government-authorised scheme within 30 days of receipt and serve the prescribed information within the same period.</p>`;
  const ancillaryClause = ancillaryRows.length ? `<p><b>5b. Ancillary fees.</b> The following additional services are charged to the Landlord only when they arise, at the rates below:</p><ul style="margin:4px 0 10px 20px;padding:0">${ancillaryRows.join('')}</ul>` : '';

  const cmp = a.cmp && a.cmp!=='Not holding client money'
    ? `The Agent protects client money through ${esc(a.cmp)}${a.cmpNo?' (ref. '+esc(a.cmpNo)+')':''}.`

  const redress = a.redress ? `The Agent is a member of ${esc(a.redress)}${a.redressNo?' (ref. '+esc(a.redressNo)+')':''}, an approved redress scheme under the Redress Schemes for Lettings Agency Work (Requirement to Belong to a Scheme etc.) (England) Order 2014.` : `The Agent is a member of an approved property redress scheme.`;

  const now=new Date();
  const bInit=(a.name||'Beacon Residentials').split(/\s+/).map(w=>w[0]||'').join('').slice(0,3).toUpperCase();
  const docRef=bInit+'-'+(isFull?'LMA':'TFA')+'-'+now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
  const glanceRows=[
    ['Service level', isFull?'Full management':'Tenant-find only'],

  return `

      <div style="font-weight:700;color:#1B2F4A;letter-spacing:.06em;font-size:11px;margin-bottom:6px">AT A GLANCE</div>
      <table style="width:100%;border-collapse:collapse">${glanceRows.map(r=>`<tr><td style="padding:4px 0;width:38%;color:#8A7D6E;vertical-align:top">${r[0]}</td><td style="padding:4px 0">${r[1]}</td></tr>`).join('')}</table>
      <div style="margin-top:8px;color:#8A7D6E;font-size:11px">This summary is for convenience only. The numbered clauses below are what both parties are bound by, and take precedence over it.</div>
    </div>

    <p><b>1. Parties &amp; definitions.</b> This agreement is between <b>${esc(a.name||'the Agent')}</b>${a.companyNo?' (company no. '+esc(a.companyNo)+')':''}${a.address?' of '+esc(a.address):''} ("the Agent") and <b>${esc(l.name)}${l.entity==='joint'&&l.joint?' &amp; '+esc(l.joint):''}</b>${l.address?' of '+esc(l.address):''} ("the Landlord"${l.entity==='joint'?', jointly and severally liable':''}), together "the Parties". "The Property" means the property or properties listed in Clause 1a. "Tenancy" means an assured shorthold tenancy or other tenancy of the Property arranged under this agreement.</p>
    <p><b>1a. The Property(ies).</b> This agreement covers:</p>
    ${propList}
    ${appointmentClause}
    ${dutiesClause}
    <p><b>4. Landlord's duties &amp; warranties.</b> The Landlord confirms they are the legal owner (or have the legal owner's authority) and are entitled to let the Property, that any mortgage lender's consent-to-let and any freeholder/superior landlord's consent have been obtained where required (the Landlord's own responsibility, not the Agent's), and that the Property is fit for habitation. The Landlord will keep in force, at their own cost: a valid Gas Safety Record (CP12) where gas appliances are present, an Electrical Installation Condition Report (EICR) renewed at least every 5 years, a valid Energy Performance Certificate rated E or above, and working smoke alarms on every storey plus a carbon monoxide alarm in any room with a fixed combustion appliance. The Landlord authorises the Agent to arrange or renew these where instructed, at the Landlord's cost, and to disclose all material information about the Property to prospective tenants as required by consumer protection law.</p>
    ${feeClause}
    ${abortiveClause}
    ${ancillaryClause}
    <p><b>6. VAT &amp; payment.</b> ${a.vatRegistered?'All fees are stated exclusive of VAT, which is charged at the prevailing rate.':'The Agent is not currently VAT-registered; no VAT is added to the fees above.'} Invoices are payable within ${esc(a.paymentTerms||14)} days of issue. The Agent does not hold or deduct from rent under either instruction type — rent is paid by the Tenant directly to the Landlord, and all Agent fees are invoiced separately.</p>
    <p><b>7. Marketing &amp; To-Let board.</b> The Landlord authorises the Agent to advertise the Property (including on property portals and the Agent's own channels) and, unless the Landlord opts out below, to erect one <b>${esc(a.name||'Agent')}</b> "To Let" / "Let By" board at the Property during the marketing period and for a reasonable period after a let is agreed (typically 4–6 weeks), in accordance with the Town and Country Planning (Control of Advertisements) (England) Regulations 2007. Only one board will be displayed at any time and it will be removed within 14 days of the Agent being instructed to do so. Board opt-out: <b>${l.boardOptOut?'Landlord has opted OUT of a board':'Board permitted'}</b>.</p>
    <p><b>8. Client money &amp; redress.</b> ${cmp} ${redress}</p>
    <p><b>9. Right to Rent, referencing &amp; anti-money-laundering.</b> The Agent will carry out Right to Rent checks on prospective tenants in accordance with the Immigration Act 2014, and standard referencing (credit history, employer and previous-landlord references, affordability assessment) before recommending a tenancy. The Agent carries out identity, address and sanctions-screening checks on the Landlord under the Money Laundering, Terrorist Financing and Transfer of Funds (Information on the Payer) Regulations 2017, and retains those records for 5 years.</p>
    <p><b>10. Term &amp; termination.</b> ${isMulti?'This agreement may be ended by either party giving one month\'s written notice at any time.':`This agreement continues after the initial Tie-In Period (Clause 2) until ended by either party giving one month's written notice.`} Termination does not affect fees already accrued or due under Clause 5 on tenancies arranged before the notice takes effect, including on renewals of those tenancies as set out in Clause 5.</p>
    <p><b>11. Complaints procedure.</b> Any complaint about the Agent's service should be made in writing to the Agent in the first instance, who will acknowledge it within 3 working days and provide a final response within 8 weeks. If unresolved, the Landlord may refer the complaint to ${a.redress?esc(a.redress):'the Agent\'s redress scheme'} free of charge.</p>
    ${_moneyClause}
    <p><b>12. Liability &amp; insurance.</b> The Agent will exercise reasonable skill and care in performing its duties but is not liable for matters outside its reasonable control, including tenant default, damage to the Property, or delays caused by third parties (contractors, referencing providers, courts). The Landlord is responsible for maintaining adequate buildings and landlord contents insurance, and for ensuring any such policy permits the Property to be let.</p>
    <p><b>13. Data protection.</b> The Agent processes personal data as a data controller under UK GDPR${a.icoNo?' (ICO registration '+esc(a.icoNo)+')':''}, solely to provide the services in this agreement, and will not share it beyond what is necessary for the letting relationship (referencing providers, contractors, deposit schemes, HMRC where relevant).</p>
    <p><b>14. Notices.</b> Any notice under this agreement must be in writing and sent to the postal or email address the recipient has provided, and is treated as received the next working day (post) or same day (email, if sent before 5pm on a working day).</p>
    <p><b>15. Force majeure.</b> Neither party is liable for delay or failure to perform caused by circumstances beyond their reasonable control.</p>

      ? `<p><b>15a. Client account interest.</b> ${cmp} Any interest earned on client money held by the Agent is retained by the Agent to offset banking and administration costs, unless otherwise agreed in writing.</p>`
      : `<p><b>15a. Client money.</b> ${cmp}</p>`}

    <p><b>16. Entire agreement.</b> This document, together with any signed variation, is the entire agreement between the Parties regarding the Property and supersedes any prior discussion or representation.</p>

}

// ── Signature capture: draw with mouse/touch, or type your name in a signature-style font ──
const SIG_FONTS=[['Dancing Script','cursive, sans-serif'],['Caveat','cursive, sans-serif']];
function sigBlockHtml(prefix){
  return `<div class="fg"><label>Your signature</label>
    <div style="display:flex;gap:14px;margin-bottom:8px;font-size:12.5px">
      <label style="cursor:pointer;display:flex;align-items:center;gap:5px"><input type="radio" name="${prefix}-sigmode" value="draw" checked onchange="setSigMode('${prefix}','draw')" style="width:auto">Draw</label>
      <label style="cursor:pointer;display:flex;align-items:center;gap:5px"><input type="radio" name="${prefix}-sigmode" value="type" onchange="setSigMode('${prefix}','type')" style="width:auto">Type</label>
    </div>
    <div id="${prefix}-draw-wrap" style="border:1.5px solid #E3D9C8;border-radius:8px;overflow:hidden;background:#fff"><canvas id="${prefix}-sig" style="display:block;width:100%;height:130px;touch-action:none;cursor:crosshair"></canvas></div>
    <div id="${prefix}-type-wrap" style="display:none">
      <input id="${prefix}-sig-text" placeholder="Type your name" oninput="renderTypedSig('${prefix}')" style="margin-bottom:8px">
      <select id="${prefix}-sig-font" onchange="renderTypedSig('${prefix}')" style="margin-bottom:8px">${SIG_FONTS.map(f=>`<option value="${f[0]},${f[1]}">${f[0]}</option>`).join('')}</select>
      <div style="border:1.5px solid #E3D9C8;border-radius:8px;background:#fff;height:90px;display:flex;align-items:center;padding:0 16px;overflow:hidden"><span id="${prefix}-sig-preview" style="font-size:38px;color:#1B2F4A;white-space:nowrap"></span></div>
    </div>
    <div style="margin-top:6px"><button class="btn sm" onclick="clearSig('${prefix}')" type="button">Clear</button></div></div>`;
}
function setSigMode(prefix,mode){
  window['_'+prefix+'SigMode']=mode;
  document.getElementById(prefix+'-draw-wrap').style.display=mode==='draw'?'':'none';
  document.getElementById(prefix+'-type-wrap').style.display=mode==='type'?'':'none';
}
function renderTypedSig(prefix){
  const text=val(prefix+'-sig-text'); const font=val(prefix+'-sig-font').split(',')[0];
  document.getElementById(prefix+'-sig-preview').style.fontFamily="'"+font+"', cursive";
  document.getElementById(prefix+'-sig-preview').textContent=text;
}
function clearSig(prefix){
  const pad=window['_'+prefix+'SigPadObj']; if(pad) pad.clear();
  const t=document.getElementById(prefix+'-sig-text'); if(t){ t.value=''; renderTypedSig(prefix); }
}
function initSigPad(prefix){
  window['_'+prefix+'SigMode']='draw';
  const c=document.getElementById(prefix+'-sig'); if(!c||!window.SignaturePad) return;
  const ratio=Math.max(window.devicePixelRatio||1,1);
  c.width=c.offsetWidth*ratio; c.height=c.offsetHeight*ratio; c.getContext('2d').scale(ratio,ratio);
  window['_'+prefix+'SigPadObj']=new SignaturePad(c,{penColor:'#1B2F4A',minWidth:0.7,maxWidth:2.2});
}
// Returns a dataURL for whichever mode is active, or null if nothing captured
function getSigDataUrl(prefix){
  const mode=window['_'+prefix+'SigMode']||'draw';
  if(mode==='draw'){ const pad=window['_'+prefix+'SigPadObj']; return (pad&&!pad.isEmpty())?pad.toDataURL('image/png'):null; }
  const text=val(prefix+'-sig-text'); if(!text) return null;
  const font=val(prefix+'-sig-font').split(',')[0];
  const c=document.createElement('canvas'); c.width=600; c.height=160; const ctx=c.getContext('2d');
  ctx.fillStyle='#fff'; ctx.fillRect(0,0,c.width,c.height);
  ctx.fillStyle='#1B2F4A'; ctx.font="52px '"+font+"', cursive"; ctx.textBaseline='middle';
  ctx.fillText(text,20,c.height/2);
  return c.toDataURL('image/png');
}

function openAgreement(id){
  const l=L(id); if(!l.id) return;
  const service=l.service||'full';
  const body=`
    <div class="fg"><label>Agreement type — the service the landlord is signing up to</label>
      <select id="ag-service" onchange="agRefreshPreview('${id}')">
        <option value="full" ${service==='full'?'selected':''}>Full management</option>

      </select></div>
    <div class="fg"><label>Landlord's email — the secure signing link is sent here</label><input id="ag-email" value="${esc(l.email||'')}" placeholder="landlord@email.com"></div>
    ${l.entity==='joint'?`<div class="fg"><label>Joint owner ${l.joint?'('+esc(l.joint)+') ':''}email — they'll be sent the same link</label><input id="ag-joint-email" value="${esc(l.jointEmail||'')}" placeholder="joint-owner@email.com"></div>`:''}
    <div class="fg"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px"><label style="margin:0">Agreement preview</label><button type="button" class="btn sm" onclick="NexLetPrint.fromEl('ag-preview','Management Agreement','Draft for review')">⎙ Print / save as PDF</button></div>
      <div id="ag-preview" style="max-height:220px;overflow-y:auto;border:1px solid #E3D9C8;border-radius:8px;padding:14px;font-size:12.5px;line-height:1.7;background:var(--off)">${buildManagementAgreement(l,service)}</div></div>
    <div class="fg"><label>Your name (signing for ${esc(S.agency.name||'the agency')})</label><input id="ag-agent-name" value="${esc(window._agentName||S.agency.name||'')}"></div>
    ${sigBlockHtml('ag')}
    <p class="hint">You sign first, then NexLet emails the landlord a secure link to counter-sign. Both parties receive a timestamped copy automatically once complete.</p>`;
  modal('Send agreement for e-signature', body,
    `<button class="btn" onclick="closeModal()">Cancel</button>
     <button class="btn" onclick="markAgreementOffline('${id}')">Mark signed offline</button>
     <button class="btn navy" onclick="sendAgreement('${id}')">Sign &amp; send to landlord</button>`, true);
  setTimeout(()=>{ initSigPad('ag'); },30);
}
function agRefreshPreview(id){ const l=L(id); const sv=document.getElementById('ag-service').value; document.getElementById('ag-preview').innerHTML=buildManagementAgreement(l,sv); }
function agClearSig(){ if(_agSigPad) _agSigPad.clear(); }

async function sendAgreement(id){
  const l=L(id); const service=document.getElementById('ag-service').value;
  const email=val('ag-email'); const agentName=val('ag-agent-name')||S.agency.name||'The agent';
  const jointEmail=l.entity==='joint'?val('ag-joint-email'):'';
  if(!email){ toast('Enter the landlord\'s email',1); return; }
  if(l.entity==='joint'&&!jointEmail){ toast('Enter the joint owner\'s email too',1); return; }
  const sigDataUrl=getSigDataUrl('ag');
  if(!sigDataUrl){ toast('Please add your signature',1); return; }
  if(!LIVE){ toast('Connect to Supabase to send (not available in demo)',1); return; }
  const token=uid('agt')+Math.random().toString(36).slice(2,10);
  const row={ id:uid('ag'), agency_id:window._agencyId, landlord_id:l.id, token, service,
    document_html:buildManagementAgreement(l,service), agent_name:agentName, agent_email:window._agentEmail||'',
    agent_sig_png:sigDataUrl, agent_signed_at:new Date().toISOString(),
    landlord_name:l.name, landlord_email:email, entity:l.entity||'individual', joint_name:l.entity==='joint'?(l.joint||''):'', joint_email:jointEmail, status:'sent' };
  const { error }=await sb.from('agency_agreements').insert(row);
  if(error){ console.error(error); toast('⚠ Could not create agreement — retry',1); return; }
  l.email=email; if(l.entity==='joint') l.jointEmail=jointEmail; l.agreement=false; l.status='pending'; l.comms=l.comms||[];
  l.comms.push({id:uid('c'),date:today(),type:'Note',note:(service==='letonly'?'Tenant-find':'Management')+' agreement signed by agent & sent to landlord for counter-signature.'});
  pushLandlord(l);
  S.agreements=S.agreements||[]; S.agreements.push(row);
  const link=new URL('agency-esign.html?t='+encodeURIComponent(token), location.href).href;
  const r1=await agencyEmail(email, 'Please sign your '+(service==='letonly'?'Tenant-Find':'Letting & Management')+' Agreement — '+(S.agency.name||'NexLet'), agreementEmailHtml(l,agentName,link,service));
  let r2=null;
  if(jointEmail) r2=await agencyEmail(jointEmail, 'Please sign your '+(service==='letonly'?'Tenant-Find':'Letting & Management')+' Agreement — '+(S.agency.name||'NexLet'), agreementEmailHtml(l,agentName,link,service));
  const sentList=[email+(r1.ok?' ✓':' ✗ FAILED')]; if(r2) sentList.push(jointEmail+(r2.ok?' ✓':' ✗ FAILED'));
  l.comms.push({id:uid('c'),date:today(),type:'Note',note:'Signing link emailed to: '+sentList.join(', ')}); pushLandlord(l);
  closeModal(); render();
  const allOk=r1.ok&&(!r2||r2.ok);
  if(allOk) toast('✓ Agreement sent to '+sentList.map(s=>s.replace(' ✓','')).join(' & '));
  else toast('⚠ Send failed for: '+sentList.filter(s=>s.includes('FAILED')).join(', ')+' — check email address and retry',1);
}

function agreementEmailHtml(l,agentName,link,service){
  const nm=service==='letonly'?'Tenant-Find Agreement':'Letting & Management Agreement';
  const b=agencyBrand();
  return `<div style="font-family:Arial,sans-serif;max-width:520px;margin:0 auto;color:#4A4038">
    <div style="background:#1B2F4A;padding:20px 24px;border-radius:10px 10px 0 0"><span style="color:#fff;font-size:20px;font-weight:700">${esc(b.name)}</span>${b.ico?`<div style="font-size:10px;color:#C9B99E;margin-top:2px">ICO Reg. ${esc(b.ico)}</div>`:''}</div>
    <div style="border:1px solid #E3D9C8;border-top:none;border-radius:0 0 10px 10px;padding:26px 24px">
      <p>Dear ${esc(landlordName(l))},</p>
      <p>${esc(agentName)} at <b>${esc(b.name)}</b> has prepared your <b>${nm}</b> and signed it. It's ready for you to review and counter-sign.</p>

   'partial' once some have. Anything testing only 'sent' silently treats a
   part-signed document as unsent. */
const TA_DOC_LABEL={tenancy:'Tenancy agreement',condensation:'Condensation and mould annexe',household:'Household composition declaration'};

/* Housing Act 2004 s.258: people count as ONE household where they are relatives
   or a couple. Three or more people in two or more households makes the property
   an HMO, which brings licensing, higher standards and £30k+ fines for getting
   it wrong. The relationships are therefore the whole question, and the only
   people who actually know them are the occupants. This list follows s.258 —
   half-blood counts as full blood, step-relations and foster children count. */
const HH_RELATIONSHIPS=['Husband / wife / civil partner','Partner — living together as a couple',
  'Son / daughter','Father / mother','Brother / sister',

   give a binding declaration. Permitted occupiers DO sign this one, unlike the

function hhSignsDeclaration(o){

function _hhSave(pid){
  const rec=tenantRecFor(pid); if(!rec) return null;
  (rec.occupants||[]).filter(o=>o.name).forEach((o,i)=>{
    const el=document.getElementById('hh-rel-'+i);
    /* Only commit an actual choice. Writing the placeholder — or a browser default
       — would manufacture a relationship nobody stated. */
    if(el&&el.value) o.relationship=el.value;
  });
  return rec;
}
/* Names of occupants with no relationship set. Every listed occupant, not only
   the signers: children appear in the table and their relationship is what
   decides the household test, so an unanswered child ships a table with a gap
   in it. They do not sign, but the lead tenant is stating their relationship. */
function _hhUnanswered(pid){
  const rec=tenantRecFor(pid); if(!rec) return [];
  return (rec.occupants||[]).filter(o=>o.name&&!o.relationship).map(o=>o.name);
}

  ${permOcc.length?C('3.5','The following are permitted occupiers. They are not tenants, do not sign this agreement, and have no right to remain at the Property once the Tenancy ends. A Right to Rent check is required for each of them who is aged 18 or over before they occupy:')+D(permOcc.map((o,ix)=>{
    const a=occAge(o);
    return ['3.5.'+(ix+1),esc(o.name)+(a!=null?', age '+a:'')+(a!=null&&a>=18?' — an adult; a Right to Rent check is required before occupation':(a!=null?' — a minor; no Right to Rent check is required until the age of 18':''))];
  })):''}

  ${S(4,'Tenant’s covenants')}
  <p style="margin:2px 0 8px;color:#5A6B82">The Tenant agrees with the Landlord as follows:</p>

  ${Sub('4.1','Payments')}
  ${D([
    ['4.1.1','to pay the Rent promptly at the times and in the manner specified in this agreement, whether demanded or not, by standing order to the account nominated by the Landlord;'],
    ['4.1.2','to ensure that cleared funds reach that account no later than 12.00 noon on the due date; if the due date is not a Working Day, payment is due on the preceding Working Day;'],
    ['4.1.3','not to be required to pay more than one month’s Rent in advance at any time;'],
    ['4.1.4','to pay simple interest at the Interest Rate, calculated daily, on any Rent or other sum that remains unpaid more than 14 days after its due date, from the due date until payment (both before and after any judgment);'],
    ['4.1.5','not to withhold any part of the Rent on the ground that the Landlord or the Agent holds the Deposit;'],
    ['4.1.6','to meet the reasonable cost of a contractor call-out requested by the Tenant where no fault is found, or where the fault is found to have been caused by the Tenant, a member of their household or a visitor;'],
    ['4.1.7','to pay the reasonable and evidenced costs incurred by the Landlord in recovering unpaid Rent or remedying any breach of this agreement, to the extent permitted by the Tenant Fees Act 2019.']
  ])}

  ${Sub('4.2','Council tax, utilities and outgoings')}
  ${D([
    ['4.2.1','to pay council tax and all charges for gas, electricity, water, telecommunications, broadband and the TV licence at the Property, including a fair share of any standing charge for the period of the Tenancy;'],
    ['4.2.2','to notify each supplier and the local authority that the Tenancy has started, and to put the accounts for services used into the Tenant’s name;'],
    ['4.2.3','to give the meter readings taken at check-in to the relevant suppliers, and to take and provide final readings at the end of the Tenancy;'],
    ['4.2.4','not to tamper with, alter or add to any meter or its installation, including fitting a pre-payment meter, without the Landlord’s prior written consent;'],
    ['4.2.5','to give a forwarding address to the utility suppliers and the local authority at the end of the Tenancy.']
  ])}

  ${Sub('4.3','Use of the Property')}
  ${D([
    ['4.3.1','to use the Property as a private residence for the Tenant and any declared occupiers only, and not to run a business from it or register a company at the address — this does not restrict ordinary working from home;'],
    ['4.3.2','not to use the Property for any illegal or immoral purpose, nor to hold an auction there, nor to use or permit any unlawfully held drug or substance at the Property;'],
    ['4.3.3','not to dry laundry other than in permitted areas, and to take reasonable precautions against pest infestation, meeting treatment costs where the infestation is caused by the Tenant;'],
    ['4.3.4','not to put oil, grease, nappies, wipes or corrosive substances into any sink, drain or waste pipe.']
  ])}

  ${Sub('4.4','Assignment, subletting and occupiers')}
  ${D([
    ['4.4.1','not to assign the Tenancy, underlet, part with or share possession or occupation of the Property or any part of it, nor to take in lodgers or paying guests, without the Landlord’s prior written consent;'],
    ['4.4.2','not to allow anyone other than the Tenant and the declared occupiers to live at the Property without the Landlord’s prior written consent;'],
    ['4.4.3','to notify the Landlord in writing of any change in the people occupying the Property.']
  ])}

  ${Sub('4.5','Licences under the Housing Act 2004 and HMO use')}
  ${D([
    ['4.5.1','not to use the Property in any manner that might lead to it becoming a house in multiple occupation under section 254 of the Housing Act 2004 without the Landlord’s express written consent;'],
    ['4.5.2','not to use the Property in any manner that might cause a condition of any licence granted under any part of the Housing Act 2004 to be breached;'],
    ['4.5.3','to comply with any licence condition of which the Tenant has been given notice.']
  ])}

  ${Sub('4.6','Maintenance and condition')}
  ${D([
    ['4.6.1','to keep the Property, including fixtures, fittings and furnishings, clean, tidy and in the same condition as recorded in the Inventory at the start of the Tenancy, fair wear and tear excepted;'],
    ['4.6.2','to use the Property in a tenant-like manner and to meet reasonable professional cleaning costs if it is not returned to the standard recorded at check-in;'],
    ['4.6.3','to clean windows, blinds and curtains as needed and within one month of the Tenancy ending, excluding the outside of upper-floor windows in flats;'],
    ['4.6.4','to clean taps and shower heads at least monthly to prevent limescale, and to have any chimney flue in use swept annually and at the end of the Tenancy;'],
    ['4.6.5','to keep smoke and carbon monoxide alarms in working order, replacing batteries as needed and reporting any fault promptly;'],
    ['4.6.6','to replace broken glass, blown bulbs, tubes and fuses promptly at the Tenant’s own cost;'],
    ['4.6.7','to take reasonable precautions against frost damage to pipes and against overloading electrical circuits, and, where the Property is left vacant for 7 days or more, to run all taps for several minutes before first use afterwards;'],
    ['4.6.8','to take reasonable steps to heat and ventilate the Property so as to minimise condensation, to keep extractor fans, vents and ducts clear and clean, and to report any damp, mould or condensation to the Landlord or the Agent <strong>within 3 working days</strong> of it becoming apparent, or as soon as reasonably practicable; and not to paint over or conceal mould instead of reporting it. Annexe A to this agreement sets out the practical steps this involves. The Landlord is responsible for investigating and remedying damp and mould under clause 6, save that where an independent inspection shows it resulted from the Tenant’s breach of this clause, or from the Tenant refusing access or concealing it after being asked to report it, the Tenant meets the reasonable, evidenced cost of remedy;'],
    ['4.6.9','to report without delay all defects and repairs needed for which the Tenant is not responsible, and any damage to communal areas.']
  ])}

  ${Sub('4.7','Alterations and decoration')}
  ${D([
    ['4.7.1','not to make any alteration or addition to the Property, including the garden, nor to erect any shed, hut or other structure, nor to remove any of the Landlord’s fixtures or fittings, without the Landlord’s prior written consent, which will not be unreasonably withheld;'],
    ['4.7.2','not to redecorate or change the colour of any surface without the Landlord’s prior written consent;'],
    ['4.7.3','not to fix anything to the walls, ceilings, woodwork or doors using nails, glue, adhesive tape or similar fixings, except a reasonable number of picture hooks, and to make good any resulting damage;'],
    ['4.7.4','not to erect any aerial, satellite dish, sign or similar without consent, and to meet the cost of installation, removal and any resulting damage;'],
    ['4.7.5','that the Tenant may request the Landlord’s consent to reasonable disability-related improvements under section 190 of the Equality Act 2010, and such consent will not be unreasonably withheld.']
  ])}

  ${Sub('4.8','Safety and insurance')}
  ${D([
    ['4.8.1','to recognise that any insurance maintained by the Landlord does not cover the Tenant’s own belongings, and that the Tenant is responsible for insuring their own possessions;'],
    ['4.8.2','not to do anything that would invalidate the Landlord’s buildings or contents insurance, and to meet any additional premium, excess or cost caused by a breach of this clause;'],
    ['4.8.3','to report any fire, theft, loss or damage to the police where appropriate and to the Landlord or the Agent as soon as possible, with written details to follow;'],
    ['4.8.4','not to bring into the Property or use any gas appliance that has not been installed and checked by a Gas Safe registered engineer in accordance with the Gas Safety (Installation and Use) Regulations 1998;'],
    ['4.8.5','not to keep or use at the Property any dangerous, flammable or explosive substance other than in quantities normal for household use;'],
    ['4.8.6','not to charge or store inside the Property any electric bicycle, electric scooter or similar vehicle, or any lithium-ion battery for one, except in a location agreed with the Landlord in writing, and to use only the manufacturer’s charger and not to charge unattended or overnight;'],
    ['4.8.7','not to install an electric vehicle charging point at the Property without the Landlord’s prior written consent;'],
    ['4.8.8','to take out and maintain insurance covering the Tenant’s own contents and the Tenant’s liability for accidental damage to the Landlord’s property, and to produce evidence of that cover on reasonable request.']
  ])}

  ${Sub('4.9','Head Lease')}
  ${D([
    ['4.9.1','to comply with all obligations imposed upon the Landlord by any superior landlord where the Property is held under a superior lease, once the Tenant has been given notice of them'+(_hlAnnexe?'; Annexe B to this agreement gives that notice':'')+';'],
    ['4.9.2','not to do anything at the Property that would put the Landlord in breach of the superior lease;'],
    ['4.9.3','to allow the superior landlord, its managing agent and their contractors access to the Property on reasonable notice where the superior lease permits it, and to report any matter affecting the structure, exterior or communal areas to the Agent without delay.']
  ])}

  ${Sub('4.10','Right to Rent')}
  ${D([
    ['4.10.1','to ensure at all times that every adult residing at the Property has a right to rent as set out in Part 3 of the Immigration Act 2014;'],
    ['4.10.2','to notify the Landlord or the Agent in writing before any additional adult occupies the Property, so that the required check can be carried out;'],
    ['4.10.3','to produce, on reasonable request, documents evidencing the right to rent of any person residing at the Property;'],
    ['4.10.4','to accept responsibility for compliance with Part 3 of the Immigration Act 2014 in relation to any sub-letting or licence the Tenant grants, whether or not authorised by the Landlord.']
  ])}

  ${Sub('4.11','Garden')}
  ${D([
    ['4.11.1','to keep any garden, driveway, patio or balcony in the same condition as at the start of the Tenancy, free of weeds and rubbish;'],
    ['4.11.2','not to alter the layout of the garden, nor to remove any established planting, without the Landlord’s consent;'],
    ['4.11.3','to cut any grass at least once every two weeks during the growing season and keep it in a tidy condition.']
  ])}

  ${Sub('4.12','Animals and pets')}
  ${D([
    ['4.12.1','that the position at the start of the Tenancy is: '+esc(pets)+';'],
    ['4.12.2','that the Tenant may ask the Landlord for consent to keep a pet at the Property under section 16A of the Housing Act 1988, and that consent will not be unreasonably refused;'],
    ['4.12.3','that a request must be made in writing and should say what type and breed of animal it is, its age, whether it is neutered and microchipped, how many animals the Tenant already keeps, and whether the Tenant has kept that animal in rented accommodation before;'],
    ['4.12.4','that the Landlord will reply in writing within <strong>28 days</strong> of receiving a written request; where the Landlord reasonably needs further information from the Tenant, or needs the consent of a superior landlord or an insurer, that period is extended by the time reasonably required to obtain it, and the Landlord will tell the Tenant in writing that an extension applies and why;'],
    ['4.12.5','that consent may reasonably be refused where a superior lease prohibits animals, where the Landlord’s insurer will not cover the risk, where the Property is not suitable for the animal in question, or where keeping the animal would be unlawful;'],
    ['4.12.6','that consent may be given subject to reasonable conditions, which may include keeping the animal under proper control, preventing nuisance to neighbours and other occupiers, and having the Property professionally cleaned and treated for fleas at the end of the Tenancy;'],
    ['4.12.7','that consent relates only to the animal named in it and does not extend to any replacement or additional animal;'],
    ['4.12.8','to be responsible for any damage, soiling, odour or infestation caused by an animal kept at the Property, whether or not consent was given, and to meet the reasonable and evidenced cost of putting it right.']
  ])}

  ${Sub('4.13','Nuisance and noise')}
  ${D([
    ['4.13.1','not to do, or permit to be done, anything at the Property that may become a nuisance, damage, annoyance or inconvenience to the Landlord, the Agent, any neighbour or any adjoining occupier;'],
    ['4.13.2','not to play, or permit to be played, any musical instrument, audio equipment, television or similar that can be heard outside the Property between 11.00 pm and 9.00 am;'],
    ['4.13.3','to take reasonable steps to ensure that everyone living at or visiting the Property complies with this clause.']
  ])}

  ${Sub('4.14','Smoking')}
  ${D([
    ['4.14.1','not to smoke cigarettes, cigars, pipes, vapes or any other substance inside the Property, and not to permit any visitor to do so;'],
    ['4.14.2','to meet the reasonable cost of any fumigation or redecoration needed to return the Property to the condition recorded at check-in following a breach of this clause.']
  ])}

  ${Sub('4.15','Disposal of rubbish')}
  ${D([
    ['4.15.1','to keep dustbins out of view except on the day of collection, and not to store bags or loose refuse outside the Property;'],
    ['4.15.2','to comply with any requirement of the Landlord or the local authority relating to the storage, separation and disposal of household waste and recycling.']
  ])}

  ${Sub('4.16','Leaving the Property vacant')}
  ${D([
    ['4.16.1','not to leave the Property vacant for more than 14 days without first notifying the Landlord in writing;'],
    ['4.16.2','to comply with any requirement of the Landlord’s insurance relating to unoccupied property, and to protect the Property from frozen or burst pipes and other damage while it is empty;'],
    ['4.16.3','to be liable for the cost of remedying any damage arising from a failure to comply with this clause, and for the reasonable cost of keeping the Property secure while empty.']
  ])}

  ${Sub('4.17','Vehicles and parking')}
  ${D([
    ['4.17.1','that parking provision at the Property is: '+esc(parking)+';'],
    ['4.17.2','to park only in any space allocated to the Property, and not to obstruct any access, driveway or communal area;'],
    ['4.17.3','not to keep a caravan, boat, trailer or commercial vehicle at the Property without the Landlord’s prior written consent;'],
    ['4.17.4','not to abandon any vehicle at the Property; any abandoned vehicle may be removed by the Landlord and the Tenant will pay the reasonable cost of removal and storage;'],
    ['4.17.5','not to carry out repair work on any vehicle at the Property, nor to charge or discharge fuel, oil, brake fluid, power steering fluid or coolant;'],
    ['4.17.6','that this Tenancy carries no entitlement to a local authority residents’ parking permit.']
  ])}

  ${Sub('4.18','Locks, keys and security')}
  ${D([
    ['4.18.1','to secure all locks, bolts and any alarm when leaving the Property or at night;'],
    ['4.18.2','not to fit, remove or change any lock, nor change any alarm code, without the Landlord’s prior written consent, except in an emergency, and to provide the Landlord with a set of keys to any new lock;'],
    ['4.18.3','to notify the Landlord in writing of the number of any additional keys cut for the existing locks;'],
    ['4.18.4','to return all keys, fobs, permits and security devices at the end of the Tenancy, and to be liable for the reasonable cost of replacing any not returned, including any resulting lock change.']
  ])}

  ${Sub('4.19','Visits by the Landlord')}
  ${D([
    ['4.19.1','to permit the Landlord, the Agent, any superior landlord and their contractors to enter the Property at reasonable times, on at least 24 hours’ written notice, to inspect, maintain or repair it, and without notice in a genuine emergency;'],
    ['4.19.2','to permit periodic inspections by appointment, normally no more often than every three months unless there is cause for concern;'],
    ['4.19.3','in the period before the Tenancy is due to end, to permit reasonable viewings by prospective tenants or buyers by appointment;'],
    ['4.19.4','to permit the display of a “To Let” or “For Sale” board at the Property for a minimum of 14 days from the start of the Tenancy, and to be liable for the reasonable cost of replacing or resiting a board removed or damaged by the Tenant within that period.']
  ])}

  ${Sub('4.20','Other tenant responsibilities')}
  ${D([
    ['4.20.1','to comply with all legislation applicable to the use or occupation of the Property;'],
    ['4.20.2','to make every reasonable endeavour to ensure that all persons living at or visiting the Property comply with the Tenant’s obligations under this agreement;'],
    ['4.20.3','to notify the Landlord or the Agent promptly of any change to the Tenant’s contact details, including email address and telephone number;'],
    ['4.20.4','not to cause damage to any wooden or laminate flooring, including by walking on it in high-heeled shoes;'],
    ['4.20.5','where the Tenant claims Universal Credit or Housing Benefit including an amount for housing costs, to tell the Landlord or the Agent and to co-operate with any reasonable request for information needed to verify the Rent or the Tenancy.']
  ])}

  ${Sub('4.21','Ending the tenancy')}
  ${D([
    ['4.21.1','that the Tenant may end the Tenancy by giving the Landlord at least <strong>two months’ written notice</strong>, which must expire on either the first or the last day of a rental period;'],
    ['4.21.2','that where the Tenant comprises more than one person, a notice given by any one of them ends the Tenancy for all of them, and a notice once given may be withdrawn only with the written agreement of the Landlord and of every person comprising the Tenant;'],
    ['4.21.3','to allow the Landlord or the Agent to inspect the Property at the end of the Tenancy, and to attend that inspection if the Tenant wishes;'],
    ['4.21.4','at the end of the Tenancy, to leave the Landlord’s furniture and effects in the rooms in which they were at the start of the Tenancy;'],
    ['4.21.5','to remove all of the Tenant’s belongings and rubbish, and to return the Property clean and in the condition recorded in the Inventory, fair wear and tear excepted;'],
    ['4.21.6','that where belongings are left at the Property after the Tenancy ends, the Landlord will take reasonable steps to tell the Tenant at the last postal or email address held for them, will store the items for <strong>14 days</strong>, and may then sell or dispose of them; items that are perishable, unsanitary or unsafe to store may be disposed of immediately; the reasonable and evidenced cost of removal, storage and disposal may be deducted from any proceeds of sale or recovered from the Tenant;'],
    ['4.21.7','to return all keys, fobs, permits and security devices to the Agent by 12.00 noon on the last day of the Tenancy, and to remain liable for Rent and outgoings until they are returned;'],
    ['4.21.8','to provide a forwarding address to the Landlord and the Agent.']
  ])}

  ${S(5,'Recovery of possession')}
  ${C('5.1','The Landlord cannot end this Tenancy by serving a “section 21” notice, that procedure having been abolished by the Renters’ Rights Act 2025.')}
  ${C('5.2','The Landlord may only recover possession by obtaining a court order on one or more of the grounds in Schedule 2 to the Housing Act 1988 as amended, having first served the prescribed notice specifying the ground or grounds relied upon and giving the period of notice required for that ground.')}
  ${C('5.3','Nothing in this clause prevents the Tenancy from being ended by agreement between the parties, or by the Tenant giving notice under clause 4.21.1.')}
  ${C('5.4','Where the Tenant is in breach of this agreement, the Landlord’s right to claim damages, unpaid Rent or the cost of remedying the breach survives the ending of the Tenancy.')}

  ${S(6,'Landlord’s covenants')}
  <p style="margin:2px 0 8px;color:#5A6B82">The Landlord agrees with the Tenant:</p>
  ${D([
    ['6.1','to keep in repair the structure and exterior of the Property, including drains, gutters and external pipes, and to keep in repair and proper working order the installations for the supply of water, gas and electricity, for sanitation and for space and water heating, in accordance with section 11 of the Landlord and Tenant Act 1985 — save where the disrepair arises from the Tenant’s misuse or negligence;'],
    ['6.2','to ensure the Property is fit for human habitation at the start of and throughout the Tenancy, in accordance with section 9A of the Landlord and Tenant Act 1985;'],
    ['6.3','to comply with <strong>Awaab’s Law</strong>, investigating reported hazards within 14 days and beginning emergency repairs within 24 hours where required;'],
    ['6.4','to keep in repair such fixtures and fittings as are provided by the Landlord and listed in the Inventory, provided that the Landlord is not required to repair any item broken through the negligence or misuse of the Tenant, their household or visitors, nor to replace any item with an exact duplicate where a substitute reasonably accomplishes the same function;'],
    ['6.5','to maintain a valid Gas Safety Record, checked annually, and an Electrical Installation Condition Report renewed at least every five years, and to provide copies to the Tenant;'],
    ['6.6','where the Property is let furnished, to ensure that furniture and furnishings meet the Furniture and Furnishings (Fire) (Safety) Regulations 1988;'],
    ['6.7','to ensure smoke and carbon monoxide alarms are provided and in working order at the start of the Tenancy, in accordance with the Smoke and Carbon Monoxide Alarm (England) Regulations 2015;'],
    ['6.8','that the Tenant, paying the Rent and observing the obligations in this agreement, may quietly possess and enjoy the Property during the Tenancy without unlawful interruption by the Landlord or any person claiming through or under the Landlord;'],
    ['6.9','to give the Tenant at least 24 hours’ written notice before entering the Property, except in a genuine emergency;'],
    ['6.10','to pay all outgoings in respect of the Property other than those that are the Tenant’s responsibility under this agreement;'],
    ['6.11','that nothing in this agreement obliges the Landlord to insure the Tenant’s contents, and that where the Landlord elects to insure the Property, nothing in this agreement obliges the Landlord to make a claim on that insurance.']
  ])}

  ${S(7,'Uninhabitability of the Property')}
  ${C('7.1','If the Property is destroyed or rendered uninhabitable by an event that is not the result of negligence or breach of contract by either party, the Rent ceases to be payable until the Property is made habitable again, unless insurance money is withheld because of an act or omission of the Tenant, a member of their household or a visitor.')}
  ${C('7.2','If, in the reasonable opinion of an appropriate expert, the Property cannot be made habitable within one month, either party may give one month’s written notice to terminate this agreement, following which it ends and no further obligations arise under it, without prejudice to any claim in respect of matters pre-dating termination.')}

  ${S(8,'Service of notices')}
  ${C('8.1','Any notice or document served by the Landlord or the Agent on the Tenant must be in writing. It is validly served if delivered by hand to the Property, left at the Property, sent by first-class post to the Property, or sent by email to an address recorded for the Tenant in the Particulars or notified in writing afterwards.')}
  ${C('8.2','<strong>Consent to service by email.</strong> The Tenant expressly agrees that any notice or document under this agreement or under the Housing Act 1988 — including a notice seeking possession under section 8, a notice of rent increase under section 13, and any document in court proceedings — may be validly served on the Tenant by email to the address recorded for them in the Particulars. Each Tenant confirms that the address given is one they use and read regularly, and accepts service by that means.')}
  ${C('8.3','Any notice served by the Tenant on the Landlord must be in writing and is validly served if sent by first-class post to, or left at, the address given for the Agent in this agreement, or sent by email to the Agent at the address given in this agreement.')}
  ${C('8.4','A notice is treated as served: (a) where delivered by hand or left at the Property, on the day it is left; (b) where sent by first-class post, on the second Working Day after posting; and (c) where sent by email, on the day it is sent if sent before 4.30 pm on a Working Day, and otherwise on the next Working Day. Service by email takes effect when the message leaves the sender’s system; a failure by the recipient to open or read it does not affect valid service.')}
  ${C('8.5','Where the Tenant comprises more than one person, service on any one of them is treated as service on all of them.')}
  ${C('8.6','In accordance with section 48 of the Landlord and Tenant Act 1987, the address at which the Tenant may serve notices on the Landlord — including notices in proceedings — is that given for the Agent at clause 1.1.1.')}
  ${C('8.7','Each party must notify the other in writing within 14 days of any change to their postal address, email address or telephone number. Where the Tenant does not do so, service at the last address notified remains valid.')}

  ${S(9,'Deposit')}
  ${dep!=null?C('9.1','The Tenant pays the Deposit of '+gbp(dep)+' on signing this agreement. '+_dc.pays+' The Deposit may not exceed five weeks’ Rent, or six weeks’ Rent where the annual Rent is £50,000 or more.'):C('9.1','No Deposit is payable under this agreement.')}
  ${C('9.2','The Deposit is held as security for the performance of the Tenant’s obligations under this agreement and to compensate the Landlord for any breach by the Tenant.')}
  ${C('9.3',_dc.holds+' '+_dc.pi+(rec.schemeRef?' The scheme reference for this Deposit is <strong>'+esc(rec.schemeRef)+'</strong>.':''))}
  ${_dh==='landlord'?C('9.3.1','The Agent does not receive, hold or handle the Deposit or any rent payment. All such payments are made by the Tenant direct to the Landlord, and the Agent accepts no responsibility for money it does not receive.'):''}
  ${C('9.4','No interest on the Deposit is payable to the Tenant.')}
  ${C('9.5','At the end of the Tenancy the Landlord or the Agent will inspect the Property against the Inventory and prepare a check-out report, and will set out in writing any proposed deductions within 14 days. The Tenant is entitled to attend that inspection. Where the Tenant arranges to attend and then does not do so, the Landlord or the Agent may either carry out the inspection in the Tenant’s absence — in which case the report stands as the record of the condition of the Property unless the Tenant shows it to be wrong — or offer one further appointment, the reasonable cost of which the Tenant will meet.')}
  ${C('9.6','Deductions may be made from the Deposit, or claimed as compensation, in reasonable and evidenced amounts for:')}
  ${D([
    ['9.6.1','damage to the Property or its fixtures and fittings caused by the Tenant, their household or visitors, beyond fair wear and tear;'],
    ['9.6.2','cleaning required to return the Property to the standard recorded in the Inventory;'],
    ['9.6.3','damage, soiling, odour or infestation arising from a pet kept at the Property;'],
    ['9.6.4','unpaid Rent, council tax or utility charges arising during the Tenancy;'],
    ['9.6.5','the cost of replacing keys, fobs or security devices not returned, including any resulting lock change;'],
    ['9.6.6','the removal and disposal of belongings or rubbish left at the Property; and'],
    ['9.6.7','any other breach by the Tenant of the terms of this agreement.']
  ])}
  ${C('9.7','Where the Tenant disagrees with a proposed deduction, the disputed amount is resolved through the free dispute resolution service of the Deposit Scheme, or by agreement between the parties or order of the court. The undisputed balance will be released without delay.')}
  ${C('9.8','Where the Tenant comprises more than one person, any one of them may act on behalf of the others in the deposit dispute process, and the Landlord may discharge the Deposit by paying any one, some or all of them.')}
  ${C('9.9','Where the Tenant comprises more than one person, they must between them appoint one of their number as lead tenant to deal with the Deposit and any dispute about it, and must notify the Landlord or the Agent in writing of that appointment. Until they do, the first-named Tenant is treated as the lead tenant.')}
  ${C('9.10','Where all or part of the Deposit is paid by someone who is not the Tenant, it is treated as paid on the Tenant’s behalf and will be dealt with at the end of the Tenancy as if the Tenant had paid it, unless the Landlord and that person agree otherwise in writing.')}

async function sendTenancyAgreement(pid){
  const p=P(pid); const l=L(p.landlordId); const rec=tenantRecFor(pid);
  const email=val('ta-email'); const agentName=val('ta-agent-name')||S.agency.name||'The agent';
  if(!email){ toast('Enter the tenant\'s email',1); return; }
  const sigDataUrl=getSigDataUrl('ta');
  if(!sigDataUrl){ toast('Please add your signature',1); return; }
  if(!LIVE){ toast('Connect to Supabase to send (not available in demo)',1); return; }
  // A resend replaces the document and mints fresh tokens, so any signature
  // already collected belongs to the superseded row. Never do that silently.
  const _prior=tenancyAgreementFor(rec.id);
  if(_prior){
    const _done=(_prior.signatories||[]).filter(s=>s.signed_at);
    if(_prior.status==='signed'){
      if(!confirm('This agreement is already fully signed by '+(_done.map(s=>s.name).filter(Boolean).join(', ')||'all parties')+'.\n\nSending a new one means everyone signs again. The signed copy stays on file.\n\nContinue?')) return;
    } else if(_done.length){
      if(!confirm('WARNING \u2014 '+_done.length+' of '+(_prior.signatories||[]).length+' have already signed:\n'+_done.map(s=>'  \u2022 '+(s.name||s.email||'')).join('\n')+'\n\nSending a new agreement VOIDS those signatures and everyone must start again.\n\nTo remind only the people who have not signed, cancel and use Chase instead.\n\nReally start again?')) return;
    }

  // behalf and each person can sign separately, on their own device.
  const newToken=()=>{ const a=new Uint8Array(16); crypto.getRandomValues(a);
    return Array.from(a).map(b=>b.toString(16).padStart(2,'0')).join(''); };
  const token=newToken();
  // Joint tenants only — permitted occupiers do not sign (clause 3.5).
  const _perm=isPermittedOccupier;
  const occupants=(rec.occupants||[]).filter(o=>o.name&&!_perm(o)).map(o=>({name:o.name,email:o.email||'',personType:'joint'}));
  const signatories=[{role:'tenant',name:rec.name||'',email,token,sig_png:null,signed_at:null}]
    .concat(occupants.map(o=>({role:'occupant',name:o.name,email:o.email,token:newToken(),sig_png:null,signed_at:null})));
  const row={ id:uid('ta'), agency_id:window._agencyId, property_id:pid, tenant_id:rec.id, landlord_id:l.id, token,
    document_html: buildTenancyAgreementHtml(p,rec,l), agent_name:agentName, agent_email:window._agentEmail||'',
    agent_sig_png:sigDataUrl,
    tenant_name:rec.name, tenant_email:email, occupants, signatories, status:'sent' };
  const { error }=await sb.from('agency_tenancy_agreements').insert(row);
  if(error){ console.error(error); toast('⚠ Could not send — run tenancy-agreement-esign-migration.sql then retry',1); return; }
  if(_prior&&_prior.status!=='signed'){
    _prior.status='void'; _prior.superseded_by=row.id;
    const {error:_ve}=await sb.from('agency_tenancy_agreements').update({status:'void'}).eq('id',_prior.id);
    if(_ve) console.error(_ve);
  }
  S.tenancyAgreements=S.tenancyAgreements||[]; S.tenancyAgreements.push(row);
  _advanceStage(pid,'contract');
  rec.email=rec.email||email; pushTenantRec(rec);
  const linkFor=tk=>new URL('tenancy-esign.html?t='+encodeURIComponent(tk), location.href).href;
  const mailBody=(nm,tk)=>`<p>Hi ${esc(nm)},</p><p>Please review and sign your tenancy agreement for <b>${esc(p.address)}</b>.</p><p><a href="${linkFor(tk)}">Sign your tenancy agreement</a></p><p style="font-size:12px;color:#6B7280">This link is personal to you. Each tenant signs separately using their own link — you do not need to be together to sign.</p>`;
  const subj='Please sign your tenancy agreement — '+p.address;
  const r1=await agencyEmail(email,subj,mailBody((rec.name||'').split(' ')[0],token));
  const occResults=[];
  for(const s of signatories.slice(1)){ if(s.email) occResults.push({email:s.email, r:await agencyEmail(s.email,subj,mailBody((s.name||'').split(' ')[0],s.token))}); }

    entityLabel:(rec.name||'')+' — '+(p.address||''),

  closeModal(); render();

async function reissueSignedCopies(pid){

  if(_ll.email && confirm('Also send a copy to the landlord, '+(landlordName(_ll)||_ll.email)+'?'))

    `<p>Dear ${esc(sigs.map(s=>s.name).filter(Boolean).join(' and ')||'all')},</p>

    entityLabel:(rec.name||'')+' — '+(p.address||''),

function withdrawNotice(id){ const n=S.notices.find(x=>x.id===id); if(!n)return; n.status='withdrawn'; save(); pushNotice(n); render(); toast('Notice withdrawn'); }
function deleteNotice(id){ const n=S.notices.find(x=>x.id===id); if(!n)return;

function _noticeRecipients(n){
  const p=P(n.propertyId)||{}; const t=p.tenant||{}; const rec=tenantRecFor(n.propertyId)||{};
  const out=[]; const seen=new Set();
  const add=(email,label)=>{ email=(email||'').trim(); if(email&&!seen.has(email.toLowerCase())){ seen.add(email.toLowerCase()); out.push({email,label}); } };
  add(t.email||rec.email,'tenant');
  (t.occupants||rec.occupants||[]).forEach(o=>add(o.email,o.name||'occupant'));
  if(rec.guarantor&&rec.guarantor.email) add(rec.guarantor.email,'guarantor');
  return out;
}

function initials(n){ return (n||'?').split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase(); }

function _activeTenants(){ return (S.tenants||[]).filter(t=>t.status==='active'); }
function ensureRentDue(){
  const ym=today().slice(0,7);
  _activeTenants().forEach(t=>{
    S.rentLedger=S.rentLedger||[];
    const has=S.rentLedger.some(r=>r.tenantId===t.id && (r.due||'').slice(0,7)===ym);
    if(!has && t.rent){ const r={id:uid('rl'),propertyId:t.propertyId,tenantId:t.id,due:ym+'-01',amount:t.rent,paidDate:'',status:'due',notes:''}; S.rentLedger.push(r); pushRent(r); }
  });
  // auto-flag overdue (>7 days past due, still unpaid) as late
  (S.rentLedger||[]).forEach(r=>{ if(r.status==='due' && daysUntil(r.due)<-7){ r.status='late'; pushRent(r); } });
}
function tenantArrears(tid){ return (S.rentLedger||[]).filter(r=>r.tenantId===tid && r.status!=='paid' && new Date(r.due)<=new Date()).reduce((s,r)=>s+r.amount,0); }
function vRentArrears(){
  ensureRentDue();
  const ts=_activeTenants();
  const totalArrears=ts.reduce((s,t)=>s+tenantArrears(t.id),0);
  const inArrears=ts.filter(t=>tenantArrears(t.id)>0).length;
  const rows=ts.map(t=>{
    const p=P(t.propertyId)||{}; const arrears=tenantArrears(t.id);
    const last=(S.rentLedger||[]).filter(r=>r.tenantId===t.id&&r.status==='paid').sort((a,b)=>new Date(b.paidDate)-new Date(a.paidDate))[0];
    return `<div class="row"><div class="av">${initials(t.name)}</div>

      ${arrears>0?`<span class="pill" style="background:var(--red-bg);color:var(--red)">${gbp(arrears)} arrears</span>`:`<span class="pill" style="background:var(--green-bg);color:var(--green)">Up to date</span>`}

  }).join('');

    </div>
    <div class="panel">${rows||'<div class="empty">No active tenancies yet. Set up a tenant from a property to start tracking rent.</div>'}</div>`;

    `<button class="btn" onclick="closeModal();render();toast('✓ Payment logged')">Skip</button><button class="btn navy" onclick="_rentReceivedSend('${r.id}')">Send statement</button>`);

async function _rentReceivedSend(rid){
  const r=(S.rentLedger||[]).find(x=>x.id===rid); if(!r){closeModal();return;}
  const t=(S.tenants||[]).find(x=>x.id===r.tenantId)||{}; const p=P(t.propertyId)||{}; const l=L(p.landlordId)||{};
  const doEmail=(document.getElementById('rp-email')||{}).checked;
  const fee=Math.round(r.amount*propFee(p))/100; const net=Math.round((r.amount-fee)*100)/100;
  const period=new Date(r.due).toLocaleDateString('en-GB',{month:'long',year:'numeric'});

// ── ARREARS — correct legal escalation. Months of unpaid rent drive the recommended
//    step: friendly reminder → formal 7-day arrears letter → Section 8 (Ground 8 is
//    mandatory at ≥2 months' arrears; Grounds 10/11 are discretionary). ──
function arrearsMonths(t){ const owed=tenantArrears(t.id); return t.rent?owed/t.rent:0; }
function arrearsStep(t){
  const m=arrearsMonths(t);
  if(m>=3) return {k:'s8',label:'Section 8 — Ground 8 (mandatory)',color:'var(--red)',bg:'var(--red-bg)',note:'Three or more months\u2019 rent is unpaid (the Renters\u2019 Rights Act 2025 raised this from 2 months). Ground 8 is a mandatory possession ground — serve a Section 8 notice (min. 4 weeks). Grounds 10 & 11 (some/persistent arrears) can be added.'};
  if(m>=1) return {k:'formal',label:'Formal arrears letter (7-day)',color:'var(--amber)',bg:'var(--amber-bg)',note:'A month\u2019s rent is outstanding. Send a formal arrears letter giving 7 days to pay before further action, and keep it on file.'};
  if(m>0) return {k:'reminder',label:'Friendly reminder',color:'var(--blue)',bg:'var(--blue-bg)',note:'Rent is late. Send a courteous reminder — most arrears clear at this stage.'};
  return null;
}
function arrearsAction(tid){

/* Resolves null rather than hanging when the image cannot be decoded. The
   original had no onerror on either the reader or the <img>, so res() was
   reachable only from img.onload — and a file the browser cannot decode never
   fires it. HEIC is the iPhone camera default and no desktop browser decodes it,
   so the commonest phone upload of all sat on an unsettleable promise: the caller
   awaited forever, its progress indicator counting up, with no way out but
   Cancel. The timeout is the backstop for a decode that neither loads nor errors.
   Every caller must treat null as "use the original file". */
function _resizeImg(file,maxW){ return new Promise((res)=>{
  let done=false; const finish=b=>{ if(done) return; done=true; clearTimeout(t); res(b); };
  const t=setTimeout(()=>finish(null),15000);
  const img=new Image(); const fr=new FileReader();
  fr.onerror=()=>finish(null);
  img.onerror=()=>finish(null);
  fr.onload=()=>{ img.onload=()=>{ try{
      const scale=Math.min(1,maxW/img.width); const c=document.createElement('canvas');
      c.width=img.width*scale; c.height=img.height*scale;
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      c.toBlob(b=>finish(b),'image/jpeg',0.72);
    }catch(e){ console.error('_resizeImg',e); finish(null); } }; img.src=fr.result; };
  fr.readAsDataURL(file); }); }
// Fetches a photo (storage URL, or a legacy inline data: URL from before storage upload) as base64 for the AI proxy.
async function _urlToB64(url){
  if(url.startsWith('data:')){ return {b64:url.split(',')[1], mime:url.split(';')[0].split(':')[1]}; }
  const signed=await _signedUrlFor(url);
  const res=await fetch(signed||url); const blob=await res.blob();
  const b64=await new Promise(r=>{ const fr=new FileReader(); fr.onload=()=>r(String(fr.result).split(',')[1]); fr.readAsDataURL(blob); });
  return {b64, mime:blob.type||'image/jpeg'};
}
async function _imgPart(u){ const {b64,mime}=await _urlToB64(u); return {type:'image',source:{type:'base64',media_type:mime,data:b64}}; }

async function createInventory2(){
  // Everything between disabling the button and closeModal() ran unguarded —
  // any thrown error left the button stuck on "Creating…" forever with no
  // toast, no console hint the user would see, nothing. try/catch/finally
  // guarantees the button always resets, and now the write is actually
  // awaited: it only counts as created once the database write is confirmed
  // (pushInv2 already verifies the row landed), not on a fire-and-forget hope.
  const btn=document.getElementById('iv2-create-btn');
  if(btn&&btn.disabled) return;
  if(btn){ btn.disabled=true; btn.textContent='Creating…'; }
  try{
    const tid=val('iv2-t'); const t=(S.tenants||[]).find(x=>x.id===tid)||{};
    if(!tid||!t.propertyId){ toast('Pick a tenancy first',1); return; }
    const v={id:uid('iv2'),propertyId:t.propertyId,tenantId:tid,rooms:[],depositHeld:parseFloat(val('iv2-dep'))||t.deposit||0,totalDeduction:0,status:'draft'};
    S.inventories2=S.inventories2||[]; S.inventories2.unshift(v);
    const ok=await pushInv2(v);
    if(!ok){ S.inventories2=S.inventories2.filter(x=>x.id!==v.id); return; } // pushInv2 already toasted why
    const p=P(v.propertyId)||{}; _chargeInvFee('movein',p,L(p.landlordId));
    closeModal(); go('inventorydetail',v.id); toast('✓ Inventory created — add rooms');
  }catch(e){
    console.error('createInventory2',e);
    toast('⚠ Could not create the inventory \u2014 '+(e.message||'unknown error'),1);
  }finally{
    if(btn){ btn.disabled=false; btn.textContent='Create'; }
  }
}
