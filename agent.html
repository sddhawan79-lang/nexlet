      <table style="width:100%;border-collapse:collapse;font-size:14px;margin:14px 0">
        <tr><td style="padding:8px 0;border-bottom:1px solid #E4EAF1">Rent received</td><td style="padding:8px 0;border-bottom:1px solid #E4EAF1;text-align:right">${_money(r.amount)}</td></tr>
        <tr><td style="padding:8px 0;border-bottom:1px solid #E4EAF1">Management fee (${propFee(p)}%)</td><td style="padding:8px 0;border-bottom:1px solid #E4EAF1;text-align:right">− ${_money(fee)}</td></tr>
        <tr><td style="padding:10px 0;font-weight:700">Net remitted to you</td><td style="padding:10px 0;text-align:right;font-weight:700;color:#009970">${_money(net)}</td></tr></table>
      <p>The net sum will be paid to your nominated account in line with your instruction${p&&p.rentDueDay?` (rent due day: ${esc(p.rentDueDay)})`:''}. Please retain this statement for your records.</p>
      <p style="color:#7A8FA6;font-size:12px">${esc(agencyBrand().name)} · held under our Client Money Protection scheme. This is an automated statement; reply with any queries.</p>

  closeModal(); render(); toast('✓ Rent statement recorded'+(doEmail&&l.email?' & emailed':''));

// ── ARREARS — correct legal escalation. Months of unpaid rent drive the recommended
//    step: friendly reminder → formal 7-day arrears letter → Section 8 (Ground 8 is
//    mandatory at ≥2 months' arrears; Grounds 10/11 are discretionary). ──
function arrearsMonths(t){ const owed=tenantArrears(t.id); return t.rent?owed/t.rent:0; }
function arrearsStep(t){
  const m=arrearsMonths(t);
  if(m>=3) return {k:'s8',label:'Section 8 — Ground 8 (mandatory)',color:'var(--red)',bg:'var(--red-bg)',note:'Three or more months\u2019 rent is unpaid (the Renters\u2019 Rights Act 2025 raised this from 2 months). Ground 8 is a mandatory possession ground — serve a Section 8 notice (min. 4 weeks). Grounds 10 & 11 (some/persistent arrears) can be added.'};
  if(m>=1) return {k:'formal',label:'Formal arrears letter (7-day)',color:'var(--amber)',bg:'var(--amber-bg)',note:'A month\u2019s rent is outstanding. Send a formal arrears letter giving 7 days to pay before further action, and keep it on file.'};
  if(m>0) return {k:'reminder',label:'Friendly reminder',color:'var(--blue)',bg:'var(--blue-bg)',note:'Rent is late. Send a courteous reminder — most arrears clear at this stage.'};
  return null;
}
function arrearsAction(tid){
  const t=(S.tenants||[]).find(x=>x.id===tid)||{}; const p=P(t.propertyId)||{}; const l=L(p.landlordId)||{};
  const step=arrearsStep(t); if(!step){ toast('This tenant is up to date',0); return; }
  const owed=tenantArrears(t.id); const m=arrearsMonths(t);
  const body=`<div class="note" style="margin-bottom:12px"><b>${esc(t.name)}</b> · ${esc(p.address||'')}<br>Arrears: <b style="color:var(--red)">${gbp(owed)}</b> (${m.toFixed(1)} months' rent)</div>
    <div style="background:${step.bg};border:1px solid ${step.color};border-radius:10px;padding:13px 15px;margin-bottom:12px">
      <div style="font-weight:700;color:${step.color};font-size:13px;margin-bottom:4px">Recommended: ${step.label}</div>
      <div style="font-size:12.5px;line-height:1.6;color:var(--txt)">${step.note}</div></div>
    <div class="hint" style="margin-bottom:10px">Full legal escalation ladder — reminder → 7-day formal letter → Section 8. Ground 8 needs ≥3 months' arrears both at service and at the hearing.</div>`;
  const actions = step.k==='s8'
    ? `<button class="btn" onclick="closeModal()">Close</button><button class="btn navy" onclick="closeModal();_arrearsLetter('${tid}');">Send arrears letter first</button><button class="btn" style="background:var(--red);color:#fff;border-color:var(--red)" onclick="closeModal();_startS8('${tid}')">Prepare Section 8 →</button>`
    : `<button class="btn" onclick="closeModal()">Close</button><button class="btn navy" onclick="closeModal();_arrearsLetter('${tid}')">Send ${step.k==='formal'?'formal arrears letter':'reminder'}</button>`;
  modal('Arrears action — '+esc(t.name), body, actions);
}
function _arrearsLetter(tid){
  const t=(S.tenants||[]).find(x=>x.id===tid)||{}; const p=P(t.propertyId)||{};
  // Hand off to the Letters module pre-set to the arrears template for this property.
  go('templates');
  toast('Open "Arrears reminder" and select '+(p.address||'the property'),0);
}
function _startS8(tid){
  const t=(S.tenants||[]).find(x=>x.id===tid)||{}; const p=P(t.propertyId)||{};
  go('notices');
  toast('Start a Section 8 notice for '+(p.address||'this property')+' — Grounds 8/10/11',0);

// ── PERIODIC LANDLORD STATEMENT — half-yearly / yearly summary of rent collected,
//    fees and net remitted, per property. Printable; uses landlordName (joint/company).
let ST=null;
function openStatement(){

  ST={landlordId:first.id||'', period:'half', y:new Date().getFullYear(), half:new Date().getMonth()<6?1:2};

function renderStatementPicker(){

  modal('Landlord statement', body, `<button class="btn" onclick="closeModal()">Cancel</button><button class="btn navy" onclick="buildStatement()">Generate statement</button>`, true);
}
function buildStatement(){
  const l=L(ST.landlordId); if(!l.id){toast('Pick a landlord',1);return;}
  const from = ST.period==='year' ? new Date(ST.y,0,1) : new Date(ST.y,ST.half===1?0:6,1);
  const to   = ST.period==='year' ? new Date(ST.y,11,31) : new Date(ST.y,ST.half===1?5:11,31);

    const rent=paid.reduce((s,r)=>s+r.amount,0); const fee=Math.round(rent*propFee(p))/100; const net=Math.round((rent-fee)*100)/100;
    return {p,count:paid.length,rent,fee,net};
  }).filter(r=>r.count>0);

  const a=S.agency;

      <div style="text-align:right;flex-shrink:0"><div style="font-family:var(--disp);font-size:18px;color:var(--navy);white-space:nowrap">LANDLORD STATEMENT</div>
        <div class="faint" style="font-size:12.5px;margin-top:4px">${esc(label)}</div></div>
    </div>
    <div style="font-size:12.5px;margin-bottom:18px"><div style="font-size:10px;font-weight:700;color:var(--faint);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px">Statement for</div>
      <div style="font-weight:600;color:var(--navy)">${landlordLegalLine(l)}</div><div class="faint">${esc(l.address||'')}</div></div>
    <table style="width:100%;border-collapse:collapse;font-size:12.5px;margin-bottom:16px">

function awaabDeadline(job){
  if(!job.dampMould && job.severity!=='hazard') return null;
  const created=new Date(job.createdAt||Date.now());
  const investigateDays=job.severity==='hazard'?1:10; const fixDays=investigateDays+5;
  const inv=new Date(created); inv.setDate(inv.getDate()+investigateDays);
  const fix=new Date(created); fix.setDate(fix.getDate()+fixDays);
  const stage=job.status==='reported'?{label:'Investigate by',date:inv,overdue:new Date()>inv}:{label:'Fix by',date:fix,overdue:new Date()>fix};
  return stage;
}

function _resizeImg(file,maxW){ return new Promise((res)=>{ const img=new Image(); const fr=new FileReader();
  fr.onload=()=>{ img.onload=()=>{ const scale=Math.min(1,maxW/img.width); const c=document.createElement('canvas'); c.width=img.width*scale; c.height=img.height*scale;
    c.getContext('2d').drawImage(img,0,0,c.width,c.height); c.toBlob(b=>res(b),'image/jpeg',0.72); }; img.src=fr.result; }; fr.readAsDataURL(file); }); }
// Fetches a photo (storage URL, or a legacy inline data: URL from before storage upload) as base64 for the AI proxy.
async function _urlToB64(url){
  if(url.startsWith('data:')){ return {b64:url.split(',')[1], mime:url.split(';')[0].split(':')[1]}; }
  const res=await fetch(url); const blob=await res.blob();
  const b64=await new Promise(r=>{ const fr=new FileReader(); fr.onload=()=>r(String(fr.result).split(',')[1]); fr.readAsDataURL(blob); });
  return {b64, mime:blob.type||'image/jpeg'};
}

function _aiSearchLocal(q){ const s=q.toLowerCase(); let best=null,bestScore=0; FEATURES.forEach(f=>{ const hay=(f.t+' '+f.d+' '+f.kw).toLowerCase(); const score=s.split(/\s+/).filter(w=>w.length>2&&hay.includes(w)).length; if(score>bestScore){bestScore=score;best=f;} }); return bestScore>0?best:null; }
function openAiFinder(){
  const body=`<div class="fg"><label>Ask in plain English — e.g. “where do I send a rent increase” or “how do I scan a gas certificate”</label>
      <input id="aif-q" placeholder="Type your question…" onkeydown="if(event.key==='Enter')aiFinderRun()"></div>
    <div id="aif-result"></div>
    <div class="faint" style="font-size:11.5px;margin-top:10px">Popular: ${FEATURES.slice(0,6).map(f=>`<a href="#" onclick="go('${f.v}');closeModal();return false" style="color:var(--blue);margin-right:10px">${esc(f.t)}</a>`).join('')}</div>`;
  modal('✦ Where do I find…?', body, `<button class="btn" onclick="closeModal()">Close</button><button class="btn navy" onclick="aiFinderRun()">Search</button>`);
  setTimeout(()=>{const i=document.getElementById('aif-q');if(i)i.focus();},50);
}
async function aiFinderRun(){
  const q=val('aif-q'); const box=document.getElementById('aif-result'); if(!q){return;}
  const card=f=>`<div class="note" style="margin-top:12px;cursor:pointer" onclick="go('${f.v}');closeModal()"><b style="color:var(--navy)">${esc(f.t)} →</b><div style="margin-top:3px">${esc(f.d)}</div></div>`;
  const local=_aiSearchLocal(q);
  if(local){ box.innerHTML=card(local); return; }
  if(!window._sessionToken){ box.innerHTML='<div class="faint" style="margin-top:10px">No exact match — try a section name from the sidebar, or connect to search with AI.</div>'; return; }
  box.innerHTML='<div class="faint" style="margin-top:10px;color:var(--blue)">✦ Thinking…</div>';
  try{
    const list=FEATURES.map(f=>f.v+': '+f.t+' — '+f.d).join('\n');
    const prompt=`A letting agent typed this question about where to find something in their portal: "${q}"\n\nAvailable sections:\n${list}\n\nReturn ONLY the single best matching section key (the word before the colon), nothing else. If nothing matches, return "none".`;
    const res=await fetch(AG_EDGE,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+window._sessionToken},body:JSON.stringify({model:'claude-sonnet-4-5',max_tokens:20,messages:[{role:'user',content:prompt}]})});
    const data=await res.json(); const key=((data.content&&data.content[0]&&data.content[0].text)||'').trim().toLowerCase();
    const f=FEATURES.find(x=>x.v===key);
    box.innerHTML = f?card(f):'<div class="faint" style="margin-top:10px">Couldn’t find a match — try browsing the sidebar.</div>';
  }catch(e){ console.error(e); box.innerHTML='<div class="faint" style="margin-top:10px">Search unavailable right now — try browsing the sidebar.</div>'; }
}

// COMPLIANCE — tree view: Landlord ▸ Property ▸ Certificate (native <details>,
// auto-expanded wherever something needs attention).
// ═══════════════════════════════════════════════════════════════════════════
function vCompliance(){
  const items=[]; S.properties.forEach(p=>{ _fullCertItems(p).forEach(it=>items.push({k:it[0],lab:it[1],date:it[2],rag:_itemRag(it)})); });
  const tot=items.length, ok=items.filter(x=>x.rag.k==='ok').length, soon=items.filter(x=>x.rag.k==='soon').length, bad=items.filter(x=>x.rag.k==='expired'||x.rag.k==='missing').length;
  const byLandlord=S.landlords.map(l=>{
    const props=S.properties.filter(p=>p.landlordId===l.id);
    const certs=[]; props.forEach(p=>{ _fullCertItems(p).forEach(it=>certs.push(_itemRag(it).k)); });
    const issues=certs.filter(k=>k!=='ok').length;
    return {l,props,issues,total:certs.length};
  }).filter(x=>x.props.length);
  const rows=byLandlord.map(({l,props,issues,total})=>{
    const propHtml=props.map(p=>{
      const items3=_fullCertItems(p).map(it=>[it[0],it[1]+(it[0]==='epc'&&p.certs&&p.certs.epcRating?' · '+p.certs.epcRating:''),it[2],it[3],it[4]]);
      const pIssues=items3.filter(it=>_itemRag(it).k!=='ok').length;
      const rec3=tenantRecFor(p.id); const dc=p.certs||{};
      const docUrlOf=k=>({gas:dc.gasDocUrl,eicr:dc.eicrDocUrl,epc:dc.epcDocUrl,legionella:dc.legionellaDocUrl,hmo:dc.hmoDocUrl,smoke:dc.smokeDocUrl,co:dc.coDocUrl,deposit:rec3&&rec3.depositCertUrl,rtr:rec3&&rec3.rtrDocUrl}[k]);
      const certHtml=items3.map(it=>{ const [k,lab,d,kind]=it; const r=_itemRag(it); const action=k==='rtr'?`rtrWizard('${p.id}')`:k==='deposit'?`setTenant('${p.id}')`:`editCert('${p.id}','${k}')`; const docUrl=docUrlOf(k); return `<div class="tree-leaf">
          <span class="tree-dot" style="background:${r.color}"></span>
          <span style="flex:1;font-size:12.5px">${lab}</span>
          <span class="faint" style="font-size:11.5px;margin-right:8px">${kind==='custom'?r.label:d?(kind==='decl'?'Confirmed '+fmtDate(d):fmtDate(d)):(kind==='decl'?'Not confirmed':'No certificate')}</span>
          <span class="pill" style="background:${r.bg};color:${r.color}">${r.label}</span>
          ${docUrl?`<button class="btn sm" onclick="viewDoc('${docUrl}','${esc(lab)}')">View</button>`:''}
          <button class="btn sm" onclick="${action}">${r.k==='ok'?'Update':k==='deposit'?'Manage':'Add'}</button>
        </div>`; }).join('');
      return `<details class="tree-node" ${pIssues?'open':''}>
        <summary><span class="tree-caret">▸</span><span class="tree-ic">⌂</span><span style="flex:1;font-weight:600;font-size:13px;color:var(--navy)">${esc(p.address)}${p.city?', '+esc(p.city):''}</span>${pIssues?`<span class="pill" style="background:var(--red-bg);color:var(--red)">${pIssues} to fix</span>`:`<span class="pill" style="background:var(--green-bg);color:var(--green)">All valid</span>`}</summary>
        <div class="tree-children">${certHtml}</div></details>`;
    }).join('');
    return `<details class="tree-node lvl0" ${issues?'open':''}>
      <summary><span class="tree-caret">▸</span><span class="tree-ic" style="background:var(--navy);color:#fff">⚇</span><span style="flex:1;font-weight:700;font-size:13.5px;color:var(--navy)">${esc(l.name)}</span><span class="faint" style="font-size:12px;margin-right:6px">${props.length} propert${props.length===1?'y':'ies'}</span>${issues?`<span class="pill" style="background:var(--red-bg);color:var(--red)">${issues} of ${total} need attention</span>`:`<span class="pill" style="background:var(--green-bg);color:var(--green)">Fully compliant</span>`}</summary>
      <div class="tree-children">${propHtml}</div></details>`;
  }).join('');
  return `<h1 class="pg">Compliance</h1><div class="sub">Every certificate across your portfolio, grouped by landlord and property. Expands automatically where something needs attention.</div>
    <div class="grid4" style="margin-bottom:18px">
      <div class="kpi"><div class="l">Certificates tracked</div><div class="v">${tot}</div></div>
      <div class="kpi"><div class="l">Valid</div><div class="v" style="color:var(--green)">${ok}</div></div>
      <div class="kpi"><div class="l">Expiring soon</div><div class="v" style="color:var(--amber)">${soon}</div></div>
      <div class="kpi"><div class="l">Expired / missing</div><div class="v" style="color:var(--red)">${bad}</div></div>
    </div>
    <div class="panel" style="padding:6px 10px">${rows||'<div class="empty">No properties yet.</div>'}</div>`;
}
async function agentLogout(){
  try{ if(sb) await sb.auth.signOut(); }catch(e){ console.error(e); }
  try{ localStorage.removeItem('nxl_role'); }catch(e){}
  location.href='login.html';
}
function esc(v){ return v==null?'':String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function val(id){ const e=document.getElementById(id); return e?e.value.trim():''; }
function modal(title,body,ft,lock){ document.getElementById('modal-root').innerHTML=`<div class="ov" onclick="${lock?'':'if(event.target===this)closeModal()'}"><div class="modal"><div class="modal-hd"><h3>${title}</h3><button class="x" onclick="closeModal()">×</button></div><div class="modal-bd">${body}</div><div class="modal-ft">${ft}</div></div></div>`; }
function closeModal(){ document.getElementById('modal-root').innerHTML=''; OB=null; RF=null; }
let _tt; function toast(m,bad){ const t=document.getElementById('toast'); t.textContent=m; t.style.background=bad?'var(--red)':'var(--navy)'; t.classList.add('show'); clearTimeout(_tt); _tt=setTimeout(()=>t.classList.remove('show'),2600); }

boot();
